<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Centre de Formation Le Pédagogue — Système de gestion et d'apprentissage">
<title>CFLP — Système d'apprentissage</title>
<style>
:root{--blue:#1d4ed8;--dark:#0f172a;--bg:#f1f5f9;--white:#fff;--border:#e2e8f0;--muted:#64748b;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark)}
header{background:var(--blue);color:white;padding:18px 15px;text-align:center}
header h1{font-size:22px;margin:0 0 6px}
header p{margin:0;font-size:13px}
main{max-width:1000px;margin:20px auto;padding:0 12px}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:12px;box-shadow:0 2px 8px #0000000d}
h2,h3{margin-top:0}
.field{margin-bottom:14px}
label{display:block;font-weight:bold;font-size:14px;margin-bottom:6px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;background:white}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:7px;padding:11px 15px;background:var(--blue);color:white;cursor:pointer;font-weight:bold;margin:3px}
button.secondary{background:#475569}
button.danger{background:var(--red)}
button.success{background:var(--green)}
button:disabled{opacity:.6;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.notice{padding:12px;border-radius:7px;background:#dbeafe;margin:12px 0}
.error{background:#fee2e2;color:#991b1b}
.success-msg{background:#dcfce7;color:#166534}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{padding:18px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe}
.stat strong{font-size:24px;display:block;margin-top:8px}
nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:15px}
nav button{background:#334155}
nav button.active{background:var(--blue)}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}
.table-wrap{overflow-x:auto}
footer{text-align:center;color:var(--muted);padding:25px;font-size:12px}
#toast{position:fixed;bottom:15px;left:10px;right:10px;max-width:600px;margin:auto;padding:13px;border-radius:8px;background:#0f172a;color:white;display:none;z-index:99}
@media(max-width:480px){header h1{font-size:19px}.card{padding:13px}button{padding:10px;font-size:13px}}
</style>
</head>
<body>
<header>
<h1>Centre de Formation Le Pédagogue</h1>
<p>CFLP — Système de gestion et d'apprentissage</p>
</header>

<main>
<section id="authSection" class="card">
<h2>Connexion</h2>
<p class="muted">Connectez-vous avec votre compte autorisé.</p>
<div id="authMessage" class="notice hidden"></div>
<form id="loginForm">
<div class="field">
<label for="email">Adresse e-mail</label>
<input id="email" type="email" autocomplete="username" required>
</div>
<div class="field">
<label for="password">Mot de passe</label>
<input id="password" type="password" autocomplete="current-password" required>
</div>
<button id="loginButton" type="submit">Se connecter</button>
<button type="button" class="secondary" id="resetButton">Mot de passe oublié</button>
</form>
</section>

<section id="appSection" class="hidden">
<div class="card">
<div class="actions" style="justify-content:space-between;align-items:center">
<div>
<strong id="profileName">Utilisateur</strong>
<div class="muted" id="profileRole"></div>
</div>
<button id="logoutButton" class="danger">Déconnexion</button>
</div>
</div>
<nav id="mainNav"></nav>
<div id="pageContent"></div>
</section>
</main>

<footer>Centre de Formation Le Pédagogue — CFLP</footer>
<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,
 sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,doc,getDoc,collection,getDocs,addDoc,updateDoc,
 deleteDoc,serverTimestamp,query,orderBy,limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/*
IMPORTANT :
Remplacez les valeurs ci-dessous par la configuration réelle de votre projet Firebase.
Ne partagez jamais vos mots de passe ni vos clés privées.
*/
const firebaseConfig = {
 apiKey: "VOTRE_API_KEY",
 authDomain: "VOTRE_PROJET.firebaseapp.com",
 projectId: "VOTRE_PROJECT_ID",
 storageBucket: "VOTRE_PROJET.appspot.com",
 messagingSenderId: "VOTRE_MESSAGING_SENDER_ID",
 appId: "VOTRE_APP_ID"
};

const $ = id => document.getElementById(id);
const authSection = $("authSection");
const appSection = $("appSection");
const pageContent = $("pageContent");
const mainNav = $("mainNav");

let app,auth,db,currentUser=null,currentProfile=null;
let activePage="dashboard";
let toastTimer=null;

const modules = [
 {id:"dashboard",label:"Accueil"},
 {id:"utilisateurs",label:"Utilisateurs",collection:"utilisateurs"},
 {id:"classes",label:"Classes",collection:"classes"},
 {id:"cours",label:"Cours",collection:"cours"},
 {id:"notes_cours",label:"Notes de cours",collection:"notes_cours"},
 {id:"devoirs",label:"Devoirs",collection:"devoirs"},
 {id:"remises",label:"Travaux remis",collection:"remises"},
 {id:"examens",label:"Examens",collection:"examens"},
 {id:"resultats",label:"Résultats",collection:"resultats"},
 {id:"annonces",label:"Annonces",collection:"annonces"}
];

function toast(message,error=false){
 const el=$("toast");
 el.textContent=message;
 el.style.background=error?"#991b1b":"#0f172a";
 el.style.display="block";
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.style.display="none",4000);
}

function showAuthMessage(message,error=false){
 const el=$("authMessage");
 el.textContent=message;
 el.classList.remove("hidden","error","success-msg");
 el.classList.add(error?"error":"success-msg");
}

function friendly(err){
 const code=err?.code||"";
 const messages={
  "auth/invalid-credential":"E-mail ou mot de passe incorrect.",
  "auth/user-not-found":"Aucun compte trouvé pour cette adresse.",
  "auth/wrong-password":"Mot de passe incorrect.",
  "auth/too-many-requests":"Trop de tentatives. Réessayez plus tard.",
  "auth/network-request-failed":"Vérifiez votre connexion Internet.",
  "permission-denied":"Accès refusé par les règles de sécurité Firestore.",
  "unavailable":"Service temporairement indisponible."
 };
 return messages[code]||err?.message||"Une erreur est survenue.";
}

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function isAdmin(){
 return ["admin","administrateur"].includes(
  String(currentProfile?.role||"").toLowerCase()
 );
}

function canViewModule(id){
 if(isAdmin())return true;
 const role=String(currentProfile?.role||"").toLowerCase();
 const permissions={
  dashboard:["admin","administrateur","professeur","eleve","étudiant","etudiant","secretaire"],
  classes:["professeur","eleve","étudiant","etudiant","secretaire"],
  cours:["professeur","eleve","étudiant","etudiant"],
  notes_cours:["professeur","eleve","étudiant","etudiant"],
  devoirs:["professeur","eleve","étudiant","etudiant"],
  remises:["professeur","eleve","étudiant","etudiant"],
  examens:["professeur","eleve","étudiant","etudiant"],
  resultats:["professeur","eleve","étudiant","etudiant"],
  annonces:["professeur","eleve","étudiant","etudiant","secretaire"],
  utilisateurs:[]
 };
 return (permissions[id]||[]).includes(role);
}

function canEditModule(id){
 if(isAdmin())return true;
 const role=String(currentProfile?.role||"").toLowerCase();
 return (
  (["devoirs","examens","notes_cours","cours","annonces"].includes(id)&&role==="professeur")||
  (id==="remises"&&["professeur","eleve","étudiant","etudiant"].includes(role))
 );
}

function stamp(){return serverTimestamp();}

async function loadProfile(user){
 const snap=await getDoc(doc(db,"utilisateurs",user.uid));
 if(snap.exists())return {uid:user.uid,...snap.data()};
 return {
  uid:user.uid,
  email:user.email||"",
  nom:user.displayName||user.email||"Utilisateur",
  role:"utilisateur"
 };
}

function renderNav(){
 mainNav.innerHTML="";
 modules.filter(m=>canViewModule(m.id)).forEach(m=>{
  const b=document.createElement("button");
  b.textContent=m.label;
  b.className=m.id===activePage?"active":"";
  b.addEventListener("click",()=>openPage(m.id));
  mainNav.appendChild(b);
 });
}

async function openPage(id){
 const module=modules.find(m=>m.id===id);
 if(!module||!canViewModule(id)){
  toast("Vous n'avez pas accès à cette section.",true);
  return;
 }
 activePage=id;
 renderNav();
 if(id==="dashboard"){renderDashboard();return;}
 await renderCollectionPage(module);
}

function renderDashboard(){
 const role=currentProfile?.role||"Utilisateur";
 pageContent.innerHTML=`
 <div class="card">
  <h2>Bienvenue au CFLP</h2>
  <p>Bonjour, <strong>${esc(currentProfile?.nom||currentUser?.email||"Utilisateur")}</strong>.</p>
  <p class="muted">Rôle : ${esc(role)}</p>
 </div>
 <div class="grid">
  <div class="stat">Votre compte<strong>Actif</strong></div>
  <div class="stat">Votre espace<strong>${esc(role)}</strong></div>
 </div>
 <div class="card">
  <h3>Accès rapide</h3>
  <p>Utilisez les boutons de navigation pour accéder aux sections autorisées de votre compte.</p>
 </div>`;
}

async function renderCollectionPage(m){
 pageContent.innerHTML=`<div class="card"><h2>${esc(m.label)}</h2><p>Chargement...</p></div>`;
 try{
  const snap=await getDocs(query(collection(db,m.collection),limit(100)));
  const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  let html=`<div class="card"><h2>${esc(m.label)}</h2>`;
  if(canEditModule(m.id)){
   html+=`<button id="addRecordButton">Ajouter</button>`;
  }
  html+=`<div class="table-wrap"><table><thead><tr><th>Informations</th><th>Actions</th></tr></thead><tbody>`;
  if(!rows.length){
   html+=`<tr><td colspan="2">Aucune donnée disponible.</td></tr>`;
  }else{
   for(const r of rows){
    const title=r.titre||r.nom||r.title||r.email||r.libelle||r.id;
    html+=`<tr><td><strong>${esc(title)}</strong><br><span class="muted">${esc(r.description||r.contenu||r.classeId||"")}</span></td><td>`;
    if(canEditModule(m.id)){
     html+=`<button data-edit="${esc(r.id)}">Modifier</button>`;
     if(isAdmin())html+=`<button class="danger" data-delete="${esc(r.id)}">Supprimer</button>`;
    }
    html+=`</td></tr>`;
   }
  }
  html+=`</tbody></table></div></div>`;
  pageContent.innerHTML=html;
  $("addRecordButton")?.addEventListener("click",()=>recordForm(m,null));
  pageContent.querySelectorAll("[data-edit]").forEach(b=>{
   b.addEventListener("click",()=>{
    const r=rows.find(x=>x.id===b.dataset.edit);
    recordForm(m,r);
   });
  });
  pageContent.querySelectorAll("[data-delete]").forEach(b=>{
   b.addEventListener("click",async()=>{
    if(!confirm("Voulez-vous vraiment supprimer cet élément ?"))return;
    try{
     await deleteDoc(doc(db,m.collection,b.dataset.delete));
     toast("Élément supprimé.");
     await openPage(m.id);
    }catch(err){
     console.error(err);
     toast(friendly(err),true);
    }
   });
  });
 }catch(err){
  console.error(err);
  pageContent.innerHTML=`<div class="card"><h2>${esc(m.label)}</h2><div class="notice error">${esc(friendly(err))}</div></div>`;
 }
}

function recordForm(m,r){
 const old=r||{};
 pageContent.innerHTML=`
 <div class="card">
  <h2>${r?"Modifier":"Ajouter"} — ${esc(m.label)}</h2>
  <form id="recordForm">
   <div class="field">
    <label for="recordTitle">Titre ou nom *</label>
    <input id="recordTitle" name="titre" required value="${esc(old.titre||old.nom||old.title||"")}">
   </div>
   <div class="field">
    <label for="recordDescription">Description ou contenu</label>
    <textarea id="recordDescription" name="description">${esc(old.description||old.contenu||"")}</textarea>
   </div>
   <div class="field">
    <label for="recordClass">Code de classe</label>
    <input id="recordClass" name="classeId" value="${esc(old.classeId||"")}">
   </div>
   <div class="actions">
    <button type="submit">Enregistrer</button>
    <button type="button" class="secondary" id="cancelRecord">Annuler</button>
   </div>
  </form>
 </div>`;
 $("cancelRecord").addEventListener("click",()=>openPage(m.id));
 $("recordForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const form=new FormData(event.currentTarget);
  const data={
   titre:String(form.get("titre")||"").trim(),
   description:String(form.get("description")||"").trim(),
   classeId:String(form.get("classeId")||"").trim(),
   updatedAt:stamp(),
   updatedBy:currentUser.uid
  };
  if(!data.titre){
   toast("Le titre est obligatoire.",true);
   return;
  }
  try{
   if(r){
    await updateDoc(doc(db,m.collection,r.id),data);
   }else{
    data.createdAt=stamp();
    data.createdBy=currentUser.uid;
    await addDoc(collection(db,m.collection),data);
   }
   toast("Enregistrement effectué.");
   await openPage(m.id);
  }catch(err){
   console.error(err);
   toast(friendly(err),true);
  }
 });
}

$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const email=$("email").value.trim();
 const password=$("password").value;
 $("loginButton").disabled=true;
 try{
  await signInWithEmailAndPassword(auth,email,password);
 }catch(err){
  console.error(err);
  showAuthMessage(friendly(err),true);
 }finally{
  $("loginButton").disabled=false;
 }
});

$("resetButton").addEventListener("click",async()=>{
 const email=$("email").value.trim();
 if(!email){
  showAuthMessage("Entrez votre adresse e-mail avant de demander une réinitialisation.",true);
  return;
 }
 try{
  await sendPasswordResetEmail(auth,email);
  showAuthMessage("Si cette adresse correspond à un compte, un e-mail de réinitialisation sera envoyé.");
 }catch(err){
  console.error(err);
  showAuthMessage(friendly(err),true);
 }
});

$("logoutButton").addEventListener("click",async()=>{
 try{
  await signOut(auth);
 }catch(err){
  toast(friendly(err),true);
 }
});

try{
 if(firebaseConfig.apiKey==="VOTRE_API_KEY"||firebaseConfig.projectId==="VOTRE_PROJECT_ID"){
  showAuthMessage("Configurez d'abord les paramètres Firebase dans le code HTML.",true);
 }else{
  app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  db=getFirestore(app);
  onAuthStateChanged(auth,async user=>{
   currentUser=user;
   if(!user){
    currentProfile=null;
    authSection.classList.remove("hidden");
    appSection.classList.add("hidden");
    return;
   }
   try{
    currentProfile=await loadProfile(user);
    authSection.classList.add("hidden");
    appSection.classList.remove("hidden");
    activePage="dashboard";
    renderNav();
    await openPage("dashboard");
   }catch(err){
    console.error(err);
    toast(friendly(err),true);
   }
  });
 }
}catch(err){
 console.error(err);
 showAuthMessage("Impossible d'initialiser Firebase. Vérifiez la configuration.",true);
}
</script>
</body>
</html>
