<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f3d91">
<meta name="description" content="Centre de Formation Le Pédagogue - Gestion universitaire et école professionnelle">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>Centre de Formation Le Pédagogue</title>

<style>
*{box-sizing:border-box}
:root{
  --primary:#0f3d91;
  --primary2:#174ea6;
  --secondary:#f4f7fb;
  --text:#172033;
  --muted:#667085;
  --border:#e2e8f0;
  --white:#fff;
  --success:#16803c;
  --danger:#c62828;
  --warning:#b26a00;
  --shadow:0 8px 25px rgba(15,61,145,.08)
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:var(--text)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:68px;
  background:var(--white);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.04)
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  color:var(--primary)
}
.brand img{
  width:40px;
  height:40px;
  border-radius:8px;
  object-fit:cover
}
.top-actions{
  display:flex;
  align-items:center;
  gap:8px
}
.top-actions select{
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  background:#fff
}

.sidebar{
  position:fixed;
  top:68px;
  bottom:0;
  left:0;
  width:255px;
  background:#0d3278;
  color:#fff;
  overflow-y:auto;
  z-index:900;
  padding:12px 8px
}
.sidebar-title{
  padding:12px;
  font-size:12px;
  text-transform:uppercase;
  opacity:.7;
  font-weight:700
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:11px 12px;
  border-radius:8px;
  margin:2px 0;
  font-size:14px
}
.nav-btn:hover,.nav-btn.active{
  background:rgba(255,255,255,.14)
}

.main{
  margin-left:255px;
  padding:88px 22px 30px;
  min-height:100vh
}

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#0f3d91,#173b7a)
}
.auth-card{
  width:100%;
  max-width:460px;
  background:#fff;
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.2)
}
.auth-logo{
  width:75px;
  height:75px;
  display:block;
  margin:0 auto 12px;
  border-radius:15px;
  object-fit:cover
}
.auth-title{
  text-align:center;
  color:var(--primary);
  margin:5px 0
}
.auth-subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:20px
}
.auth-tabs{
  display:flex;
  gap:5px;
  margin-bottom:20px
}
.auth-tabs button{
  flex:1;
  border:1px solid var(--border);
  background:#fff;
  padding:10px;
  border-radius:8px
}
.auth-tabs button.active{
  background:var(--primary);
  color:#fff
}

.form-group{margin-bottom:14px}
.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:600;
  font-size:14px
}
input,select,textarea{
  width:100%;
  border:1px solid #d5dce7;
  border-radius:8px;
  padding:10px 11px;
  background:#fff;
  color:var(--text);
  outline:none
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary)
}
textarea{min-height:100px;resize:vertical}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary2)}
.btn-light{background:#edf2f8;color:#172033}
.btn-success{background:#198754;color:#fff}
.btn-danger{background:#c62828;color:#fff}
.btn-warning{background:#f0a500;color:#fff}
.btn-google{background:#fff;color:#333;border:1px solid #d5dce7}
.btn-sm{padding:7px 9px;font-size:12px}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px
}
.page-title h1{margin:0;font-size:25px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px
}
.stat-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  box-shadow:var(--shadow)
}
.stat-card .label{
  color:var(--muted);
  font-size:13px
}
.stat-card .value{
  font-size:28px;
  font-weight:800;
  margin-top:8px;
  color:var(--primary)
}

.panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow)
}
.panel h3{margin-top:0}

.table-wrap{
  overflow-x:auto
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:650px
}
th,td{
  border-bottom:1px solid var(--border);
  padding:11px 9px;
  text-align:left;
  font-size:13px;
  vertical-align:top
}
th{
  background:#f7f9fc;
  font-weight:800
}
.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700
}
.badge-success{background:#dcfce7;color:#166534}
.badge-warning{background:#fff4d6;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}

.grid-form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}
.full{grid-column:1/-1}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted)
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  max-width:360px;
  background:#172033;
  color:#fff;
  padding:13px 16px;
  border-radius:10px;
  z-index:5000;
  box-shadow:0 8px 25px rgba(0,0,0,.2)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:4000
}
.modal-box{
  background:#fff;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:22px
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}
.modal-head h3{margin:0}

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted)
}

.mobile-menu{
  display:none;
  border:0;
  background:#edf2f8;
  border-radius:8px;
  padding:8px 11px
}

@media(max-width:1000px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-menu{display:block}
  .cards{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .topbar{
    padding:0 10px
  }
  .brand span{display:none}
  .top-actions select{max-width:110px}
  .top-actions .btn-light{
    padding:8px;
    font-size:12px
  }
  .main{
    padding:82px 10px 20px
  }
  .cards{grid-template-columns:1fr 1fr}
  .grid-form{grid-template-columns:1fr}
  .page-title{
    align-items:flex-start;
    flex-direction:column
  }
  .auth-card{padding:20px}
}
</style>
</head>

<body>

<!-- ================= AUTHENTIFICATION ================= -->

<div id="toast" class="toast hidden"></div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  setDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   CONFIGURATION FIREBASE
   ========================================================= */

const firebaseConfig = {
  apiKey:"AIzaSyAhrtcVaEZ7oU-p4Ihzl0APX2ccXKi4jBU",
  authDomain:"centre-de-formation-le-pe.firebaseapp.com",
  projectId:"centre-de-formation-le-pe",
  storageBucket:"centre-de-formation-le-pe.firebasestorage.app",
  messagingSenderId:"11834103838",
  appId:"1:11834103838:web:b82c994e78486cd313760f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL =
  "centredeformationlepedagogue@gmail.com";

let currentUser = null;
let currentProfile = null;
let deferredInstallPrompt = null;


/* =========================================================
   OUTILS
   ========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(value){
  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(message){
  const t = $("toast");

  if(!t){
    return;
  }

  t.textContent = message;
  t.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(()=>{
      t.classList.add("hidden");
    },3500);
}

function showError(){
  toast("Une opération n'a pas pu être effectuée.");
}

function isAdmin(){
  return !!(
    currentUser &&
    (
      currentUser.email?.toLowerCase() === ADMIN_EMAIL ||
      (
        currentProfile?.role === "administrateur" &&
        currentProfile?.status === "accepted"
      )
    )
  );
}

function isProfessor(){
  return !!(
    currentProfile?.role === "professeur" &&
    currentProfile?.status === "accepted"
  );
}

function isStudent(){
  return !!(
    currentProfile?.role === "eleve" &&
    currentProfile?.status === "accepted"
  );
}

function canAcademicAccess(){
  return isAdmin() || isProfessor() || isStudent();
}

function adminRequired(){
  if(!isAdmin()){
    toast("Accès réservé à l'administration.");
    return false;
  }

  return true;
}

function closeSidebarMobile(){
  $("sidebar")?.classList.remove("open");
}


/* =========================================================
   AUTHENTIFICATION
   ========================================================= */

window.showAuthTab = function(tab){

  if(tab === "login"){
    $("loginForm").classList.remove("hidden");
    $("registerForm").classList.add("hidden");

    $("loginTab").classList.add("active");
    $("registerTab").classList.remove("active");
  }else{
    $("loginForm").classList.add("hidden");
    $("registerForm").classList.remove("hidden");

    $("loginTab").classList.remove("active");
    $("registerTab").classList.add("active");
  }
};


window.loginEmailPassword = async function(){

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if(!email || !password){
    toast("Veuillez remplir tous les champs.");
    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);
    toast("Email ou mot de passe incorrect.");
  }
};


window.loginGoogle = async function(){

  try{

    const provider = new GoogleAuthProvider();

    const result =
      await signInWithPopup(auth,provider);

    await ensureUserProfile(
      result.user,
      result.user.displayName || ""
    );

  }catch(error){

    console.error(error);
    toast("La connexion Google n'a pas pu être effectuée.");
  }
};


window.registerAccount = async function(){

  const name =
    $("registerName").value.trim();

  const email =
    $("registerEmail").value.trim();

  const password =
    $("registerPassword").value;

  const password2 =
    $("registerPassword2").value;

  if(!name || !email || !password || !password2){
    toast("Veuillez remplir tous les champs.");
    return;
  }

  if(password.length < 6){
    toast("Le mot de passe doit contenir au moins 6 caractères.");
    return;
  }

  if(password !== password2){
    toast("Les mots de passe ne correspondent pas.");
    return;
  }

  try{

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const isAdminEmail =
      email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase();

    await setDoc(
      doc(db,"users",credential.user.uid),
      {
        uid:credential.user.uid,
        email:email,
        nom:name,
        role:isAdminEmail
          ? "administrateur"
          : "eleve",
        status:isAdminEmail
          ? "accepted"
          : "attente",
        createdAt:serverTimestamp()
      },
      {merge:true}
    );

    if(!isAdminEmail){
      await signOut(auth);
      showAuthTab("login");
      toast("Compte créé. Votre compte est en attente de validation.");
    }else{
      toast("Compte administrateur créé.");
    }

  }catch(error){

    console.error(error);

    if(error.code === "auth/email-already-in-use"){
      toast("Cette adresse email existe déjà.");
    }else if(error.code === "auth/invalid-email"){
      toast("Adresse email invalide.");
    }else{
      toast("Impossible de créer le compte.");
    }
  }
};


async function ensureUserProfile(user,name=""){

  const ref =
    doc(db,"users",user.uid);

  const snap =
    await getDoc(ref);

  if(snap.exists()){

    const data = snap.data();

    if(
      user.email?.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
    ){

      await setDoc(
        ref,
        {
          uid:user.uid,
          email:user.email || "",
          nom:data.nom || name || user.displayName || "",
          role:"administrateur",
          status:"accepted"
        },
        {merge:true}
      );
    }

    return;
  }

  const isAdminEmail =
    user.email?.toLowerCase() ===
    ADMIN_EMAIL.toLowerCase();

  await setDoc(
    ref,
    {
      uid:user.uid,
      email:user.email || "",
      nom:name || user.displayName || "",
      role:isAdminEmail
        ? "administrateur"
        : "eleve",
      status:isAdminEmail
        ? "accepted"
        : "attente",
      createdAt:serverTimestamp()
    },
    {merge:true}
  );
}


async function getUserProfile(uid){

  const snap =
    await getDoc(doc(db,"users",uid));

  if(!snap.exists()){
    return null;
  }

  return snap.data();
}


window.logoutUser = async function(){

  try{

    await signOut(auth);

    currentUser = null;
    currentProfile = null;

    $("appPage").classList.add("hidden");
    $("authPage").classList.remove("hidden");

    showAuthTab("login");

    toast("Déconnexion effectuée.");

  }catch(error){

    console.error(error);
    toast("Impossible de se déconnecter.");
  }
};


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(auth,async user=>{

  if(!user){

    currentUser = null;
    currentProfile = null;

    $("appPage").classList.add("hidden");
    $("authPage").classList.remove("hidden");

    return;
  }

  try{

    currentUser = user;

    await ensureUserProfile(user);

    currentProfile =
      await getUserProfile(user.uid);

    if(!currentProfile){

      await signOut(auth);
      toast("Profil utilisateur introuvable.");
      return;
    }

    const adminEmail =
      user.email?.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase();

    if(
      !adminEmail &&
      currentProfile.status !== "accepted"
    ){

      await signOut(auth);

      toast(
        "Votre compte est en attente de validation par l'administration."
      );

      return;
    }

    if(adminEmail){

      currentProfile.role = "administrateur";
      currentProfile.status = "accepted";

      await setDoc(
        doc(db,"users",user.uid),
        {
          uid:user.uid,
          email:user.email || ADMIN_EMAIL,
          role:"administrateur",
          status:"accepted"
        },
        {merge:true}
      );
    }

    $("authPage").classList.add("hidden");
    $("appPage").classList.remove("hidden");

    $("adminNavigation").classList.toggle(
      "hidden",
      !isAdmin()
    );

    await showPage("dashboard");

  }catch(error){

    console.error(error);

    await signOut(auth).catch(()=>{});

    toast("Impossible de charger votre profil.");
  }
});

const genericConfigs = {};

async function renderGenericPage(title,collectionName,fields){

  genericConfigs[collectionName] = {
    title,
    fields
  };

  const snap =
    await getDocs(collection(db,collectionName));

  const rows = [];

  snap.forEach(ds=>{
    rows.push({
      id:ds.id,
      ...ds.data()
    });
  });

  let html = `

    <div class="page-title">
      <div>
        <h1>${esc(title)}</h1>
        <p style="color:#667085">
          Gestion des ${esc(title.toLowerCase())}.
        </p>
      </div>

      ${
        isAdmin()
        ? `<button class="btn btn-primary"
             onclick="openGenericForm('${collectionName}')">
             ➕ Ajouter
           </button>`
        : ""
      }

    </div>

    <div class="panel">
      <div class="table-wrap">
  `;

  if(!rows.length){

    html += `
      <div class="empty">
        Aucun élément enregistré.
      </div>
    `;

  }else{

    html += `<table><thead><tr>`;

    fields.forEach(f=>{
      html += `<th>${esc(f[1])}</th>`;
    });

    if(isAdmin()){
      html += `<th>Actions</th>`;
    }

    html += `</tr></thead><tbody>`;

    rows.forEach(row=>{

      html += `<tr>`;

      fields.forEach(f=>{
        html += `<td>${esc(row[f[0]] || "")}</td>`;
      });

      if(isAdmin()){

        html += `
          <td>
            <div class="actions">

              <button class="btn btn-light btn-sm"
                onclick="openGenericForm('${collectionName}','${row.id}')">
                Modifier
              </button>

              <button class="btn btn-danger btn-sm"
                onclick="deleteGeneric('${collectionName}','${row.id}')">
                Supprimer
              </button>

            </div>
          </td>
        `;
      }

      html += `</tr>`;
    });

    html += `</tbody></table>`;
  }

  html += `
      </div>
    </div>
  `;

  $("mainContent").innerHTML = html;
}


window.openGenericForm = async function(
  collectionName,
  id=""
){

  if(!adminRequired()){
    return;
  }

  const config =
    genericConfigs[collectionName];

  if(!config){
    return;
  }

  let data = {};

  if(id){

    const snap =
      await getDoc(
        doc(db,collectionName,id)
      );

    if(snap.exists()){
      data = snap.data();
    }
  }

  let form = `<div class="grid-form">`;

  config.fields.forEach((field,index)=>{

    const [key,label] = field;

    form += `
      <div class="${index === 0 ? "" : ""}">
        <div class="form-group">
          <label>${esc(label)}</label>
          <input
            id="generic_${esc(key)}"
            value="${esc(data[key] || "")}"
            placeholder="${esc(label)}">
        </div>
      </div>
    `;
  });

  form += `
    </div>

    <button class="btn btn-primary"
      onclick="saveGeneric('${collectionName}','${id}')">
      Enregistrer
    </button>
  `;

  openModal(
    id ? "Modifier" : "Ajouter",
    form
  );
};


window.saveGeneric = async function(
  collectionName,
  id=""
){

  if(!adminRequired()){
    return;
  }

  const config =
    genericConfigs[collectionName];

  const data = {};

  config.fields.forEach(([key])=>{
    data[key] =
      $(`generic_${key}`)?.value.trim() || "";
  });

  try{

    data.updatedAt = serverTimestamp();

    if(id){

      await updateDoc(
        doc(db,collectionName,id),
        data
      );

    }else{

      data.createdAt = serverTimestamp();

      await addDoc(
        collection(db,collectionName),
        data
      );
    }

    closeModal();
    toast("Enregistrement effectué.");
    await showPage(
      document.querySelector(".nav-btn.active")?.dataset.page
      || "dashboard"
    );

  }catch(error){

    console.error(error);
    showError();
  }
};


window.deleteGeneric = async function(
  collectionName,

  }catch(error){

};

window.saveAffectation = async function(){

  if(!adminRequired()){
    return;
  }

  const profId =
    $("affProf")?.value || "";

  const filiereId =
    $("affFiliere")?.value || "";

  const classeId =
    $("affClasse")?.value || "";

  const matiereId =
    $("affMatiere")?.value || "";

  if(!profId || !filiereId || !classeId || !matiereId){

    toast("Veuillez sélectionner tous les éléments.");
    return;
  }

  try{

    const [
      profSnap,
      filiereSnap,
      classeSnap,
      matiereSnap
    ] = await Promise.all([
      getDoc(doc(db,"professeurs",profId)),
      getDoc(doc(db,"filieres",filiereId)),
      getDoc(doc(db,"classes",classeId)),
      getDoc(doc(db,"matieres",matiereId))
    ]);

    const prof =
      profSnap.exists()
      ? profSnap.data()
      : {};

    const filiere =
      filiereSnap.exists()
      ? filiereSnap.data()
      : {};

    const classe =
      classeSnap.exists()
      ? classeSnap.data()
      : {};

    const matiere =
      matiereSnap.exists()
      ? matiereSnap.data()
      : {};

    let professeurUid =
      prof.uid || "";

    if(!professeurUid && prof.email){

      const q =
        query(
          collection(db,"users"),
          where("email","==",prof.email)
        );

      const userSnap =
        await getDocs(q);

      if(!userSnap.empty){
        professeurUid =
          userSnap.docs[0].id;
      }
    }

    await addDoc(
      collection(db,"affectations"),
      {
        professeurId:profId,
        professeurUid:professeurUid,
        professeurNom:prof.nom || "",
        professeurEmail:prof.email || "",
        filiereId:filiereId,
        filiereNom:filiere.nom || "",
        classeId:classeId,
        classeNom:classe.nom || "",
        matiereId:matiereId,
        matiereNom:matiere.nom || "",
        createdAt:serverTimestamp()
      }
    );

    closeModal();
    toast("Affectation enregistrée.");

    await renderAffectations();

  }catch(error){

    console.error(error);
    showError();
  }
};

window.saveAssignment = async function(){

  if(!(isAdmin() || isProfessor())){
    return;
  }

  const titre =
    $("assignmentTitle")?.value.trim() || "";

  const description =
    $("assignmentDescription")?.value.trim() || "";

  const matiereId =
    $("assignmentSubject")?.value || "";

  const classeId =
    $("assignmentClass")?.value || "";

  const dateLimite =
    $("assignmentDeadline")?.value || "";

  if(!titre || !matiereId){

    toast("Le titre et la matière sont obligatoires.");
    return;
  }

  try{

    const matiereSnap =
      await getDoc(
        doc(db,"matieres",matiereId)
      );

    let classe = {};

    if(classeId){

      const c =
        await getDoc(
          doc(db,"classes",classeId)
        );

      if(c.exists()){
        classe = c.data();
      }
    }

    const matiere =
      matiereSnap.exists()
      ? matiereSnap.data()
      : {};

    await addDoc(
      collection(db,"devoirs"),
      {
        titre,
        description,
        matiereId,
        matiereNom:matiere.nom || "",
        classeId,
        classeNom:classe.nom || "",
        dateLimite,
        professeurUid:currentUser.uid,
        professeurNom:currentProfile?.nom || "",
        professeurEmail:currentUser.email || "",
        createdAt:serverTimestamp()
      }
    );

    closeModal();
    toast("Devoir publié.");
    await renderAssignments();

  }catch(error){

    console.error(error);
    showError();
  }
};

window.saveCorrection = async function(id){

  if(!(isAdmin() || isProfessor())){
    return;
  }

  try{

    const snap =
      await getDoc(
        doc(db,"remises",id)
      );

    if(!snap.exists()){
      toast("Remise introuvable.");
      return;
    }

    const r = snap.data();

    if(
      isProfessor() &&
      r.professeurUid !== currentUser.uid
    ){
      toast("Vous ne pouvez pas corriger cette remise.");
      return;
    }

    const noteValue =
      $("correctionNote")?.value;

    const correction =
      $("correctionText")?.value.trim() || "";

    if(
      noteValue === "" ||
      Number(noteValue) < 0 ||
      Number(noteValue) > 100
    ){
      toast("La note doit être comprise entre 0 et 100.");
      return;
    }

    const note = Number(noteValue);

    await updateDoc(
      doc(db,"remises",id),
      {
        note,
        correction,
        correctedAt:serverTimestamp(),
        correctedByUid:currentUser.uid,
        correctedByName:currentProfile?.nom || ""
      }
    );

    await addDoc(
      collection(db,"resultats"),
      {
        remiseId:id,
        devoirId:r.devoirId || "",
        devoirTitre:r.devoirTitre || "",
        etudiantUid:r.etudiantUid || "",
        etudiantNom:r.etudiantNom || "",
        matiereId:r.matiereId || "",
        matiereNom:r.matiereNom || "",
        note,
        correction,
        professeurUid:r.professeurUid || "",
        createdAt:serverTimestamp()
      }
    );

    closeModal();
    toast("Correction enregistrée.");
    await renderSubmissions();

  }catch(error){

    console.error(error);
    showError();
  }
};

window.exportData = async function(){

  if(!adminRequired()){
    return;
  }

  const collections = [
    "users",
    "etudiants",
    "professeurs",
    "departements",
    "filieres",
    "classes",
    "matieres",
    "cours",
    "affectations",
    "inscriptions",
    "devoirs",
    "remises",
    "resultats"
  ];

  try{

    const output = {};

    for(const name of collections){

      const snap =
        await getDocs(
          collection(db,name)
        );

      output[name] =
        snap.docs.map(d=>({
          id:d.id,
          ...d.data()
        }));
    }

    const json =
      JSON.stringify(
        output,
        (key,value)=>{

          if(
            value &&
            typeof value === "object" &&
            value.seconds !== undefined
          ){
            return new Date(
              value.seconds * 1000
            ).toISOString();
          }

          return value;
        },
        2
      );

    const blob =
      new Blob(
        [json],
        {type:"application/json"}
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;
    a.download =
      "centre-de-formation-le-pedagogue-backup.json";

    a.click();

    URL.revokeObjectURL(url);

    toast("Sauvegarde téléchargée.");

  }catch(error){

    console.error(error);
    showError();
  }
};


/* =========================================================
   LANGUE
   ========================================================= */

window.changeLanguage = function(value){

  localStorage.setItem(
    "cfp_language",
    value
  );

  if(value === "ht"){
    toast("Langue Kreyòl sélectionnée.");
  }else{
    toast("Langue française sélectionnée.");
  }
};


function loadLanguage(){

  const saved =
    localStorage.getItem("cfp_language") || "fr";

  if($("languageSelect")){
    $("languageSelect").value = saved;
  }
}


/* =========================================================
   PWA
   ========================================================= */

window.addEventListener(
  "beforeinstallprompt",
  event=>{

    event.preventDefault();

    deferredInstallPrompt = event;

    $("installBtn")?.classList.remove("hidden");
  }
);


window.installPWA = async function(){

  if(!deferredInstallPrompt){

    toast(
      "L'installation n'est pas disponible pour le moment."
    );

    return;
  }

  deferredInstallPrompt.prompt();

  const result =
    await deferredInstallPrompt.userChoice;

  console.log(result);

  deferredInstallPrompt = null;

  $("installBtn")?.classList.add("hidden");
};


window.addEventListener(
  "appinstalled",
  ()=>{
    deferredInstallPrompt = null;
    $("installBtn")?.classList.add("hidden");
  }
);


/* =========================================================
   PERSISTENCE
   ========================================================= */

setPersistence(
  auth,
  browserLocalPersistence
).catch(error=>{
  console.error(error);
});


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if(
  "serviceWorker" in navigator &&
  location.protocol !== "file:"
){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register("./service-worker.js")
        .catch(error=>{
          console.error(error);
        });
    }
  );
}


/* =========================================================
   INITIALISATION
   ========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  ()=>{
    loadLanguage();

    const install =
      $("installBtn");

    if(install){
      install.classList.add("hidden");
    }
  }
);

</script>
