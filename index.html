<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centre de Formation Le Pédagogue</title>
  <!-- Lòt lyen ak estil ou yo ta dwe la -->
</head>
<body>

  <!-- Pati koòdone w yo -->
  <div id="pageContent"></div>
  <button id="installBtn" disabled>📲 Installer l'application</button>

<script>
  // Fonksyon de baz pou notifikasyon (Toast) ak seleksyon eleman ($)
  function $(id) { return document.getElementById(id); }
  function toast(msg, isError = false) {
    alert((isError ? "Erè: " : "") + msg);
  }
  function friendly(e) {
    return e.message || "Gen yon erè ki fèt.";
  }
  function isAdmin() {
    // Mete lojik ou pou verifye si itilizatè a se admin
    // Egzanp: tcheke si limyè a limen nan sesyon an
    return window.currentUserRole === 'admin';
  }

  // --- Kòrèksyon pou jere itilizatè yo ak evite blocage koneksyon an ---
  async function renderUsersManagement() {
    try {
      if (!isAdmin()) {
        $("pageContent").innerHTML = '<div class="card"><h3>Aksè refize</h3><p>Ou pa gen dwa pou w wè paj sa a.</p></div>';
        return;
      }
      // Kod pou jere itilizatè yo
    } catch (e) {
      console.error("Erreur Gestion des utilisateurs :", e);
      toast("Impossible de charger les utilisateurs et les affectations. Vérifiez les règles Firestore.", true);
    }
  }

  async function renderBackup() {
    if (!isAdmin()) return;
    $("pageContent").innerHTML = '<div class="card"><h3>Sauvegarde JSON</h3><p>Exporter les collections Firestore accessibles à votre compte.</p><button id="exportBtn" class="btn primary">Exporter les données</button><div class="notice">Le fichier peut contenir des données personnelles. Conservez-le en sécurité.</div></div>';
    
    $("exportBtn").onclick = async () => {
      const names = ["users","etudiants","eleves","professeurs","departements","filieres","classes","matieres","cours","annees_academiques","affectations","inscriptions","devoirs","examens","tentatives_examens","notes_cours","remises","resultats","videos","documents","statistiques","configuration"];
      const backup = {
        application: "Centre de Formation Le Pédagogue",
        projectId: typeof firebaseConfig !== 'undefined' ? firebaseConfig.projectId : "unknown",
        exportedAt: new Date().toISOString(),
        collections: {}
      };
      try {
        for (const name of names) {
          try {
            const s = await getDocs(collection(db, name));
            backup.collections[name] = s.docs.map(d => ({ id: d.id, ...d.data() }));
          } catch (err) {
            console.warn(`Koleksyon ${name} pa aksesib oswa li vid:`, err);
            backup.collections[name] = [];
          }
        }
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "sauvegarde-le-pedagogue-" + new Date().toISOString().slice(0, 10) + ".json";
        a.click();
        URL.revokeObjectURL(url);
        toast("Export terminé.");
      } catch (e) {
        toast(friendly(e), true);
      }
    };
  }

  /* Enstalasyon PWA — Android, Chrome ak Samsung Internet */
  let installPrompt = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installPrompt = e;
    if ($("installBtn")) {
      $("installBtn").textContent = "📲 Installer l'application";
      $("installBtn").disabled = false;
    }
  });

  window.addEventListener("appinstalled", () => {
    installPrompt = null;
    if ($("installBtn")) {
      $("installBtn").textContent = "✓ Application installée";
      toast("Application installée avec succès.");
    }
  });

  if ($("installBtn")) {
    $("installBtn").addEventListener("click", async () => {
      const btn = $("installBtn");
      const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      if (standalone) {
        toast("L'application est déjà installée.");
        return;
      }
      if (installPrompt) {
        try {
          const promptEvent = installPrompt;
          await promptEvent.prompt();
          const result = await promptEvent.userChoice;
          installPrompt = null;
          if (result?.outcome === "accepted") btn.textContent = "✓ Installation lancée";
          else btn.textContent = "📲 Installer l'application";
        } catch (error) {
          console.error("Erreur installation :", error);
          toast("Utilisez le menu ⋮ du navigateur pour installer l'application.", true);
        }
        return;
      }
      const ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod/i.test(ua)) {
        alert("Pour installer l'application sur iPhone : ouvrez le site dans Safari, appuyez sur Partager, puis sur « Sur l'écran d'accueil ».");
        return;
      }
      alert("Pour installer Centre de Formation Le Pédagogue :\n\n1. Ouvrez le site publié en HTTPS dans Chrome ou Samsung Internet.\n2. Appuyez sur le menu ⋮ du navigateur.\n3. Choisissez « Installer l'application » ou « Ajouter à l'écran d'accueil ».");
    });
  }

  /* Anrejistreman ak verifikasyon Service Worker */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try {
        const registration = await navigator.serviceWorker.register("./sw.js");
        console.log("Service Worker enregistré.");
        await registration.update().catch(error => console.warn("Mise à jour du Service Worker différée :", error));
      } catch (error) {
        console.error("Erreur Service Worker :", error);
      }
    });
  }
</script>
</body>
</html>
