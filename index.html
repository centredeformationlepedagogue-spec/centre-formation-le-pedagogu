<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Centre de Formation Le Pédagogue">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<title>Centre de Formation Le Pédagogue</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1d4ed8;--dark:#0f172a;--bg:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--green:#16a34a;--red:#dc2626}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.btn{padding:10px 14px;border-radius:8px;font-weight:bold;margin:3px}.primary{background:var(--blue);color:white}.green{background:var(--green);color:white}.red{background:var(--red);color:white}.light{background:#e2e8f0;color:#1e293b}
#authPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#0f172a,#1d4ed8)}
.auth-card{background:white;padding:25px;border-radius:16px;width:100%;max-width:440px}
h1,h2,h3{margin-bottom:12px}.auth-card h1{font-size:22px;text-align:center}.auth-card p{text-align:center;color:var(--muted);margin-bottom:15px}
.form-group{margin:12px 0}.form-group label{display:block;font-weight:bold;margin-bottom:6px;font-size:14px}.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;background:white}
.message{padding:11px;margin:10px 0;border-radius:8px;background:#dbeafe;color:#1e40af}.message.error{background:#fee2e2;color:#991b1b}
.topbar{position:fixed;top:0;left:0;right:0;height:65px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 15px;z-index:10;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold}.brand img{width:36px;height:36px}.top-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.top-actions button,.top-actions select{padding:8px;border-radius:7px}
.sidebar{position:fixed;top:65px;bottom:0;left:0;width:245px;overflow:auto;background:var(--dark);color:white;padding:12px;z-index:9}
.nav-title{font-size:11px;text-transform:uppercase;color:#94a3b8;padding:14px 8px 7px}.nav-btn{display:block;width:100%;text-align:left;padding:11px;border-radius:7px;margin-bottom:3px;background:transparent;color:#cbd5e1}.nav-btn:hover,.nav-btn.active{background:var(--blue);color:white}
.main{margin-left:245px;padding:85px 22px 25px}.page-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.page-title p{color:var(--muted)}
.panel,.stat-card,.assignment-card{background:white;border:1px solid var(--border);border-radius:12px;padding:17px;margin-bottom:17px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.stat-card strong{display:block;font-size:27px;margin:7px 0}.stat-card span{color:var(--muted)}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}th{background:#f8fafc}
.search{padding:10px;border:1px solid var(--border);border-radius:8px;max-width:100%;margin-bottom:10px}
.grid-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}.modal-card{background:white;padding:20px;border-radius:13px;width:100%;max-width:650px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:15px;right:15px;background:#0f172a;color:white;padding:13px;border-radius:9px;z-index:40}
.badge{padding:4px 8px;border-radius:20px;background:#dcfce7;color:#166534;font-size:12px}
@media(max-width:950px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-menu{display:inline-block!important}}
@media(max-width:600px){.topbar{padding:0 7px}.brand-name{display:none}.top-actions{gap:3px}.top-actions button,.top-actions select{font-size:11px;padding:7px}.main{padding:80px 10px 20px}.grid-form{grid-template-columns:1fr}.full{grid-column:auto}.stats{gap:7px}.stat-card{padding:11px}.stat-card strong{font-size:22px}}
.mobile-menu{display:none;background:var(--blue);color:white;padding:9px;border-radius:7px}
</style>
</head>
<body>
<div id="authPage">
<div class="auth-card">
<div style="text-align:center;margin-bottom:20px"><img src="./icon-192.png" alt="Logo" style="width:75px;height:75px"><h1>Centre de Formation Le Pédagogue</h1><p>Gestion universitaire et école professionnelle</p><button class="btn green" onclick="installApp()">📲 Installer l’application</button></div>
<div id="authMessage"></div>
<div id="loginBox">
<h2>Connexion</h2>
<div class="form-group"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div>
<div class="form-group"><label>Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
<button class="btn primary" style="width:100%" onclick="login()">Se connecter</button>
<button class="btn light" style="width:100%" onclick="loginGoogle()">🔵 Continuer avec Google</button>
<p>Pas encore de compte ? <button class="btn light" onclick="showRegister()">Créer un compte</button></p>
</div>
<div id="registerBox" class="hidden">
<h2>Créer un compte</h2>
<div class="form-group"><label>Nom complet</label><input id="registerName"></div>
<div class="form-group"><label>Email</label><input id="registerEmail" type="email"></div>
<div class="form-group"><label>Mot de passe</label><input id="registerPassword" type="password" minlength="6"></div>
<button class="btn primary" style="width:100%" onclick="register()">Créer mon compte</button>
<p>Votre compte sera en attente d’approbation par l’administrateur.</p>
<button class="btn light" onclick="showLogin()">Retour à la connexion</button>
</div>
</div>
</div>

<div id="appPage" class="hidden">
<header class="topbar">
<div class="brand"><button class="mobile-menu" onclick="toggleSidebar()">☰</button><img src="./icon-192.png" alt=""><span class="brand-name">Centre de Formation Le Pédagogue</span></div>
<div class="top-actions"><button class="green" onclick="installApp()">📲 Installer</button><span id="userNameTop"></span><span id="roleLabel" class="badge"></span><button class="red" onclick="logout()">Déconnexion</button></div>
</header>
<aside id="sidebar" class="sidebar">
<div class="nav-title">Principal</div><button class="nav-btn active" onclick="showPage('dashboard',this)">🏠 Accueil</button>
<div id="adminNav">
<div class="nav-title">Administration académique</div>
<button class="nav-btn" onclick="showPage('etudiants',this)">👨‍🎓 Étudiants</button>
<button class="nav-btn" onclick="showPage('professeurs',this)">👨‍🏫 Professeurs</button>
<button class="nav-btn" onclick="showPage('departements',this)">🏛️ Départements</button>
<button class="nav-btn" onclick="showPage('filieres',this)">🎓 Filières / Programmes</button>
<button class="nav-btn" onclick="showPage('classes',this)">🏫 Classes / Groupes</button>
<button class="nav-btn" onclick="showPage('matieres',this)">📚 Matières / Cours</button>
<button class="nav-btn" onclick="showPage('annees',this)">📅 Années académiques</button>
<button class="nav-btn" onclick="showPage('affectations',this)">🔗 Affectations</button>
<button class="nav-btn" onclick="showPage('inscriptions',this)">👥 Élèves / Classes</button>
<button class="nav-btn" onclick="showPage('users',this)">👥 Utilisateurs</button>
<button class="nav-btn" onclick="showPage('statistiques',this)">📈 Statistiques</button>
</div>
<div class="nav-title">Espace pédagogique</div>
<button class="nav-btn" onclick="showPage('devoirs',this)">📝 Devoirs</button>
<button class="nav-btn" onclick="showPage('remises',this)">📤 Remises / Corrections</button>
<button class="nav-btn" onclick="showPage('resultats',this)">📊 Résultats / Notes</button>
</aside>
<main class="main">
<section id="page-dashboard"></section>
<section id="page-etudiants" class="hidden"></section><section id="page-professeurs" class="hidden"></section>
<section id="page-departements" class="hidden"></section><section id="page-filieres" class="hidden"></section>
<section id="page-classes" class="hidden"></section><section id="page-matieres" class="hidden"></section>
<section id="page-annees" class="hidden"></section><section id="page-affectations" class="hidden"></section>
<section id="page-inscriptions" class="hidden"></section><section id="page-users" class="hidden"></section>
<section id="page-statistiques" class="hidden"></section><section id="page-devoirs" class="hidden"></section>
<section id="page-remises" class="hidden"></section><section id="page-resultats" class="hidden"></section>
</main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div style="display:flex;justify-content:space-between"><h3 id="modalTitle">Ajouter</h3><button class="btn light" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp,query,where}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAhrtcVaEZ7oU-p4Ihzl0APX2ccXKi4jBU",
authDomain:"centre-de-formation-le-pe.firebaseapp.com",
projectId:"centre-de-formation-le-pe",
storageBucket:"centre-de-formation-le-pe.firebasestorage.app",
messagingSenderId:"11834103838",
appId:"1:11834103838:web:b82c994e78486cd313760f"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),googleProvider=new GoogleAuthProvider();
const ADMIN_EMAIL="Centredeformationlepedagogue@gmail.com";
let currentUser=null,currentProfile=null,deferredPrompt=null;

const fields={
etudiants:{title:"Étudiants",icon:"👨‍🎓",fields:[["nom","Nom complet","text"],["email","Email","email"],["telephone","Téléphone","text"],["filiere","Filière","text"],["classe","Classe","text"],["matricule","Matricule","text"]]},
professeurs:{title:"Professeurs",icon:"👨‍🏫",fields:[["nom","Nom complet","text"],["email","Email","email"],["telephone","Téléphone","text"],["specialite","Spécialité","text"],["departement","Département","text"]]},
departements:{title:"Départements",icon:"🏛️",fields:[["nom","Nom du département","text"],["responsable","Responsable","text"],["description","Description","text"]]},
filieres:{title:"Filières / Programmes",icon:"🎓",fields:[["nom","Nom de la filière","text"],["departement","Département","text"],["niveau","Niveau","text"],["duree","Durée","text"]]},
classes:{title:"Classes / Groupes",icon:"🏫",fields:[["nom","Nom de la classe","text"],["filiere","Filière","text"],["niveau","Niveau","text"],["annee","Année académique","text"]]},
matieres:{title:"Matières / Cours",icon:"📚",fields:[["nom","Nom de la matière","text"],["code","Code de la matière","text"],["professeur","Professeur","text"],["classe","Classe","text"]]},
annees:{title:"Années académiques",db:"annees_academiques",fields:[["nom","Année académique","text"],["debut","Date de début","date"],["fin","Date de fin","date"]]}
};
const $=id=>document.getElementById(id);
const esc=v=>v==null?"":String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dbname=k=>fields[k]?.db||k;
const admin=()=>currentProfile?.role==="administrateur"&&currentProfile?.status==="accepted";
const prof=()=>currentProfile?.role==="professeur"&&currentProfile?.status==="accepted";
const student=()=>["eleve","etudiant"].includes(currentProfile?.role)&&currentProfile?.status==="accepted";
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3000)}
function authMsg(msg,error=true){$("authMessage").innerHTML=`<div class="message ${error?"error":""}">${esc(msg)}</div>`}
window.showRegister=()=>{$("loginBox").classList.add("hidden");$("registerBox").classList.remove("hidden");$("authMessage").innerHTML=""};
window.showLogin=()=>{$("registerBox").classList.add("hidden");$("loginBox").classList.remove("hidden");$("authMessage").innerHTML=""};

async function createProfile(user,name=""){
const ref=doc(db,"users",user.uid),s=await getDoc(ref),isAdmin=(user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase();
if(s.exists()){if(isAdmin)await updateDoc(ref,{email:user.email,nom:name||user.displayName||"",role:"administrateur",status:"accepted"});return}
await setDoc(ref,{uid:user.uid,email:user.email||"",nom:name||user.displayName||"",role:isAdmin?"administrateur":"attente",status:isAdmin?"accepted":"pending",createdAt:serverTimestamp()});
}
window.login=async()=>{
const email=$("loginEmail").value.trim(),password=$("loginPassword").value;
if(!email||!password)return authMsg("Veuillez remplir tous les champs.");
try{await signInWithEmailAndPassword(auth,email,password)}catch(e){console.error(e);authMsg("Connexion impossible. Vérifiez votre email, votre mot de passe et Firebase Authentication.")}
};
window.register=async()=>{
const name=$("registerName").value.trim(),email=$("registerEmail").value.trim(),password=$("registerPassword").value;
if(!name||!email||!password)return authMsg("Veuillez remplir tous les champs.");
if(password.length<6)return authMsg("Le mot de passe doit contenir au moins 6 caractères.");
try{const result=await createUserWithEmailAndPassword(auth,email,password);await createProfile(result.user,name);await signOut(auth);showLogin();authMsg("Compte créé. Il est en attente d'approbation.",false)}catch(e){console.error(e);authMsg("Impossible de créer le compte. Vérifiez les informations et la configuration Firebase.")}
};
window.loginGoogle=async()=>{try{await signInWithPopup(auth,googleProvider)}catch(e){console.error(e);authMsg("Connexion Google impossible. Vérifiez que Google est activé dans Firebase Authentication et que le domaine est autorisé.")}};
async function getProfile(user){
const ref=doc(db,"users",user.uid),s=await getDoc(ref);
if(!s.exists()){await createProfile(user);const n=await getDoc(ref);return n.exists()?n.data():null}
const d=s.data();
if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()&&(d.role!=="administrateur"||d.status!=="accepted")){await updateDoc(ref,{role:"administrateur",status:"accepted"});d.role="administrateur";d.status="accepted"}
return d;
}
onAuthStateChanged(auth,async user=>{
if(!user){currentUser=null;currentProfile=null;$("authPage").classList.remove("hidden");$("appPage").classList.add("hidden");return}
try{
currentUser=user;currentProfile=await getProfile(user);
if(!currentProfile||currentProfile.status!=="accepted"){await signOut(auth);authMsg("Compte en attente d'approbation par l'administrateur.");return}
$("authPage").classList.add("hidden");$("appPage").classList.remove("hidden");
$("userNameTop").textContent=currentProfile.nom||user.email;$("roleLabel").textContent=admin()?"ADMIN":prof()?"PROFESSEUR":"ÉLÈVE";
$("adminNav").classList.toggle("hidden",!admin());dashboard();showPage("dashboard");
}catch(e){console.error(e);await signOut(auth);authMsg("Connexion impossible. Vérifiez les règles Firestore et le profil utilisateur.")}
});
window.logout=()=>signOut(auth);
window.toggleSidebar=()=>$("sidebar").classList.toggle("open");

window.showPage=async(key,button)=>{
document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
$("page-"+key)?.classList.remove("hidden");
document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));if(button)button.classList.add("active");
$("sidebar").classList.remove("open");
if(key==="dashboard")dashboard();
else if(fields[key]&&admin())loadGeneric(key);
else if(key==="users"&&admin())loadUsers();
else if(key==="affectations"&&admin())loadAffectations();
else if(key==="inscriptions"&&admin())loadInscriptions();
else if(key==="statistiques"&&admin())loadStats();
else if(key==="devoirs")loadAssignments();
else if(key==="remises")loadSubmissions();
else if(key==="resultats")loadResults();
};

async function count(col){try{return(await getDocs(collection(db,col))).size}catch(e){return 0}}
async function dashboard(){
const page=$("page-dashboard");
page.innerHTML=`<div class="page-title"><div><h2>Tableau de bord</h2><p>Bienvenue dans votre espace de gestion académique.</p></div></div><div class="panel"><b>Compte :</b> ${esc(currentUser?.email)}<br><b>Rôle :</b> ${admin()?"Administrateur":prof()?"Professeur":"Élève"}</div>${admin()?'<div class="stats"><div class="stat-card">👨‍🎓<strong id="nEt">…</strong><span>Étudiants</span></div><div class="stat-card">👨‍🏫<strong id="nPr">…</strong><span>Professeurs</span></div><div class="stat-card">🏫<strong id="nCl">…</strong><span>Classes</span></div><div class="stat-card">📚<strong id="nMa">…</strong><span>Matières</span></div><div class="stat-card">📝<strong id="nDe">…</strong><span>Devoirs</span></div><div class="stat-card">⏳<strong id="nUs">…</strong><span>Utilisateurs en attente</span></div></div>':""}<div class="panel"><h3>Centre de Formation Le Pédagogue</h3>Gestion universitaire et école professionnelle.</div>`;
if(admin()){for(const [id,col] of [["nEt","etudiants"],["nPr","professeurs"],["nCl","classes"],["nMa","matieres"],["nDe","devoirs"]])$(id).textContent=await count(col);try{const s=await getDocs(collection(db,"users"));let n=0;s.forEach(x=>{if(x.data().status!=="accepted")n++});$("nUs").textContent=n}catch(e){$("nUs").textContent="—"}}
}

async function loadGeneric(key){
const c=fields[key],page=$("page-"+key);
page.innerHTML=`<div class="page-title"><div><h2>${c.title}</h2><p>Gestion des données.</p></div><button class="btn primary" onclick="openRecord('${key}')">➕ Ajouter</button></div><div class="panel"><input class="search" id="search-${key}" placeholder="Rechercher..." oninput="filterRows('${key}')"><div id="table-${key}" class="table-wrap">Chargement…</div></div>`;
await renderGeneric(key);
}
async function renderGeneric(key){
const c=fields[key],box=$("table-"+key);
try{
const s=await getDocs(collection(db,dbname(key)));
if(s.empty){box.innerHTML="Aucune donnée enregistrée.";return}
let html="<table><thead><tr>"+c.fields.map(f=>`<th>${esc(f[1])}</th>`).join("")+"<th>Actions</th></tr></thead><tbody>";
s.forEach(x=>{const d=x.data();html+=`<tr>${c.fields.map(f=>`<td>${esc(d[f[0]])}</td>`).join("")}<td><button class="btn light" onclick="openRecord('${key}','${x.id}')">Modifier</button><button class="btn red" onclick="deleteRecord('${key}','${x.id}')">Supprimer</button></td></tr>`});
box.innerHTML=html+"</tbody></table>";
}catch(e){console.error(e);box.textContent="Impossible de charger les données. Vérifiez les règles Firestore."}
}
window.filterRows=key=>{const q=$("search-"+key).value.toLowerCase();document.querySelectorAll(`#table-${key} tbody tr`).forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none")};
window.openRecord=async(key,id=null)=>{
if(!admin())return toast("Accès réservé à l'administrateur.");
const c=fields[key];let d={};
if(id){const s=await getDoc(doc(db,dbname(key),id));if(!s.exists())return toast("Donnée introuvable.");d=s.data()}
$("modalTitle").textContent=(id?"Modifier ":"Ajouter ")+c.title;
$("modalBody").innerHTML=`<form onsubmit="saveRecord(event,'${key}','${id||""}')"><div class="grid-form">${c.fields.map(f=>`<div class="form-group"><label>${esc(f[1])}</label><input id="f-${f[0]}" type="${f[2]}" value="${esc(d[f[0]]||"")}"></div>`).join("")}</div><button class="btn primary">💾 Enregistrer</button></form>`;
$("modal").classList.remove("hidden");
};
window.saveRecord=async(e,key,id)=>{e.preventDefault();if(!admin())return;const d={};fields[key].fields.forEach(f=>d[f[0]]=$("f-"+f[0]).value.trim());d.updatedAt=serverTimestamp();try{if(id)await updateDoc(doc(db,dbname(key),id),d);else{d.createdAt=serverTimestamp();await addDoc(collection(db,dbname(key)),d)}closeModal();toast("Enregistré avec succès.");await loadGeneric(key);dashboard()}catch(x){console.error(x);toast("Échec d'enregistrement. Vérifiez les règles Firestore.")}};
window.deleteRecord=async(key,id)=>{if(!admin()||!confirm("Supprimer cet élément ?"))return;try{await deleteDoc(doc(db,dbname(key),id));await renderGeneric(key);toast("Élément supprimé.")}catch(e){console.error(e);toast("Suppression impossible.")}};
window.closeModal=()=>{$("modal").classList.add("hidden");$("modalBody").innerHTML=""};

async function loadUsers(){
const p=$("page-users");p.innerHTML=`<div class="page-title"><h2>👥 Utilisateurs</h2><button class="btn light" onclick="loadUsers()">Actualiser</button></div><div class="panel"><input class="search" id="searchUsers" placeholder="Rechercher..." oninput="filterUsers()"><div id="usersTable" class="table-wrap">Chargement…</div></div>`;
try{const s=await getDocs(collection(db,"users"));if(s.empty){$("usersTable").textContent="Aucun utilisateur.";return}let h="<table id='userTable'><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Statut</th><th>UID</th><th>Actions</th></tr></thead><tbody>";
s.forEach(x=>{const d=x.data();h+=`<tr><td>${esc(d.nom)}</td><td>${esc(d.email)}</td><td>${esc(d.role)}</td><td>${esc(d.status)}</td><td>${esc(x.id)}</td><td>${x.id!==currentUser.uid?`<button class="btn green" onclick="acceptUser('${x.id}')">Accepter</button><button class="btn light" onclick="changeRole('${x.id}')">Rôle</button><button class="btn red" onclick="deleteUser('${x.id}')">Supprimer</button>`:"Compte actuel"}</td></tr>`});
$("usersTable").innerHTML=h+"</tbody></table>";
}catch(e){console.error(e);$("usersTable").textContent="Impossible de charger les utilisateurs."}
}
window.filterUsers=()=>{const q=$("searchUsers").value.toLowerCase();document.querySelectorAll("#userTable tbody tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none")};
window.acceptUser=async uid=>{if(!admin())return;const r=prompt("Rôle : 1 = élève, 2 = professeur, 3 = administrateur","1");if(r===null)return;const role=r==="2"?"professeur":r==="3"?"administrateur":"eleve";try{await updateDoc(doc(db,"users",uid),{role,status:"accepted",approvedBy:currentUser.email,approvedAt:serverTimestamp()});toast("Utilisateur accepté.");loadUsers()}catch(e){console.error(e);toast("Impossible d'accepter l'utilisateur.")}};
window.changeRole=async uid=>{if(!admin())return;const r=prompt("Rôle exact : eleve, professeur ou administrateur");if(!["eleve","etudiant","professeur","administrateur"].includes(r))return toast("Rôle invalide.");try{await updateDoc(doc(db,"users",uid),{role:r,status:"accepted",updatedAt:serverTimestamp()});loadUsers()}catch(e){console.error(e);toast("Impossible de modifier le rôle.")}};
window.deleteUser=async uid=>{if(!admin()||!confirm("Supprimer le profil utilisateur ?"))return;try{await deleteDoc(doc(db,"users",uid));loadUsers()}catch(e){console.error(e);toast("Suppression impossible.")}};

async function selectOptions(col,label){const s=await getDocs(collection(db,col));let h='<option value="">Choisir</option>';s.forEach(x=>h+=`<option value="${x.id}">${esc(label(x.data()))}</option>`);return h}
async function loadAffectations(){
$("page-affectations").innerHTML=`<div class="page-title"><h2>🔗 Affectations</h2><button class="btn primary" onclick="openAffectation()">Nouvelle affectation</button></div><div class="panel"><div id="affTable">Chargement…</div></div>`;
try{const s=await getDocs(collection(db,"affectations"));let h="<table><thead><tr><th>Professeur</th><th>Filière</th><th>Classe</th><th>Matière</th><th>Action</th></tr></thead><tbody>";s.forEach(x=>{const d=x.data();h+=`<tr><td>${esc(d.professeurNom)}</td><td>${esc(d.filiereNom)}</td><td>${esc(d.classeNom)}</td><td>${esc(d.matiereNom)}</td><td><button class="btn red" onclick="deleteAffectation('${x.id}')">Supprimer</button></td></tr>`});$("affTable").innerHTML=s.empty?"Aucune affectation.":h+"</tbody></table>"}catch(e){console.error(e);$("affTable").textContent="Erreur de chargement."}
}
window.openAffectation=async()=>{
if(!admin())return;
try{
const [ps,fs,cs,ms]=await Promise.all([selectOptions("professeurs",d=>d.nom||d.email||"Professeur"),selectOptions("filieres",d=>d.nom||"Filière"),selectOptions("classes",d=>d.nom||"Classe"),selectOptions("matieres",d=>d.nom||"Matière")]);
$("modalTitle").textContent="Nouvelle affectation";
$("modalBody").innerHTML=`<form onsubmit="saveAffectation(event)"><div class="form-group"><label>Professeur</label><select id="ap" required>${ps}</select></div><div class="form-group"><label>Filière</label><select id="af" required>${fs}</select></div><div class="form-group"><label>Classe</label><select id="ac" required>${cs}</select></div><div class="form-group"><label>Matière</label><select id="am" required>${ms}</select></div><button class="btn primary">Enregistrer</button></form>`;
$("modal").classList.remove("hidden");
}catch(e){console.error(e);toast("Impossible de charger les choix.")}
};
window.saveAffectation=async e=>{
e.preventDefault();if(!admin())return;
try{
const ids=[$("ap").value,$("af").value,$("ac").value,$("am").value];
const cols=["professeurs","filieres","classes","matieres"];
const snaps=await Promise.all(ids.map((id,i)=>getDoc(doc(db,cols[i],id))));
if(snaps.some(s=>!s.exists()))return toast("Sélection invalide.");
const d=snaps.map(s=>s.data());
const email=(d[0].email||"").toLowerCase();
let uid="";
if(email){const us=await getDocs(query(collection(db,"users"),where("email","==",email)));if(!us.empty)uid=us.docs[0].id}
await addDoc(collection(db,"affectations"),{professeurId:ids[0],professeurUid:uid,professeurNom:d[0].nom||"",professeurEmail:email,filiereId:ids[1],filiereNom:d[1].nom||"",classeId:ids[2],classeNom:d[2].nom||"",matiereId:ids[3],matiereNom:d[3].nom||"",createdAt:serverTimestamp(),createdBy:currentUser.uid});
closeModal();toast("Affectation enregistrée.");loadAffectations();
}catch(e){console.error(e);toast("Impossible d'enregistrer l'affectation.")}
};
window.deleteAffectation=async id=>{if(!admin()||!confirm("Supprimer cette affectation ?"))return;try{await deleteDoc(doc(db,"affectations",id));loadAffectations()}catch(e){console.error(e);toast("Suppression impossible.")}};

async function loadInscriptions(){
$("page-inscriptions").innerHTML=`<div class="page-title"><h2>👥 Élèves / Classes</h2><button class="btn primary" onclick="openInscription()">Inscrire un élève</button></div><div class="panel"><div id="insTable">Chargement…</div></div>`;
try{const s=await getDocs(collection(db,"inscriptions"));let h="<table><thead><tr><th>Élève</th><th>Classe</th><th>Action</th></tr></thead><tbody>";s.forEach(x=>{const d=x.data();h+=`<tr><td>${esc(d.eleveNom)}</td><td>${esc(d.classeNom)}</td><td><button class="btn red" onclick="deleteInscription('${x.id}')">Supprimer</button></td></tr>`});$("insTable").innerHTML=s.empty?"Aucune inscription.":h+"</tbody></table>"}catch(e){console.error(e);$("insTable").textContent="Erreur de chargement."}
}
window.openInscription=async()=>{
if(!admin())return;
try{const [es,cs]=await Promise.all([selectOptions("etudiants",d=>d.nom||d.email||"Élève"),selectOptions("classes",d=>d.nom||"Classe")]);$("modalTitle").textContent="Inscrire un élève";$("modalBody").innerHTML=`<form onsubmit="saveInscription(event)"><div class="form-group"><label>Élève</label><select id="ie" required>${es}</select></div><div class="form-group"><label>Classe</label><select id="ic" required>${cs}</select></div><button class="btn primary">Enregistrer</button></form>`;$("modal").classList.remove("hidden")}catch(e){console.error(e);toast("Impossible de charger les listes.")}
};
window.saveInscription=async e=>{
e.preventDefault();if(!admin())return;
try{const ei=$("ie").value,ci=$("ic").value;const [es,cs]=await Promise.all([getDoc(doc(db,"etudiants",ei)),getDoc(doc(db,"classes",ci))]);if(!es.exists()||!cs.exists())return toast("Élève ou classe introuvable.");const el=es.data(),cl=cs.data();const dup=await getDocs(query(collection(db,"inscriptions"),where("eleveId","==",ei),where("classeId","==",ci)));if(!dup.empty)return toast("Cet élève est déjà inscrit dans cette classe.");await addDoc(collection(db,"inscriptions"),{eleveId:ei,eleveNom:el.nom||el.email||"",eleveEmail:el.email||"",classeId:ci,classeNom:cl.nom||"",createdAt:serverTimestamp(),createdBy:currentUser.uid});closeModal();loadInscriptions();toast("Inscription enregistrée.")}catch(e){console.error(e);toast("Impossible d'enregistrer l'inscription.")}
};
window.deleteInscription=async id=>{if(!admin()||!confirm("Supprimer cette inscription ?"))return;try{await deleteDoc(doc(db,"inscriptions",id));loadInscriptions()}catch(e){console.error(e);toast("Suppression impossible.")}};

async function loadAssignments(){
const p=$("page-devoirs");p.innerHTML=`<div class="page-title"><h2>📝 Devoirs</h2>${admin()||prof()?'<button class="btn primary" onclick="openAssignment()">Nouveau devoir</button>':""}</div><div id="assignmentList" class="grid-form"></div>`;
try{const s=await getDocs(collection(db,"devoirs"));let h="";s.forEach(x=>{const d=x.data();if(prof()&&d.professeurId!==currentUser.uid)return;h+=`<div class="assignment-card"><h3>${esc(d.titre)}</h3><p>${esc(d.description||"")}</p><p>Classe : ${esc(d.classe||"")}</p><p>Date limite : ${esc(d.dateLimite||"Non définie")}</p>${student()?`<button class="btn primary" onclick="submitAssignment('${x.id}','${esc(d.titre)}')">Remettre le devoir</button>`:""}</div>`});$("assignmentList").innerHTML=h||"Aucun devoir disponible."}catch(e){console.error(e);$("assignmentList").textContent="Impossible de charger les devoirs."}
}
window.openAssignment=()=>{if(!admin()&&!prof())return;$("modalTitle").textContent="Créer un devoir";$("modalBody").innerHTML=`<form onsubmit="saveAssignment(event)"><div class="form-group"><label>Titre</label><input id="at" required></div><div class="form-group"><label>Matière</label><input id="am" required></div><div class="form-group"><label>Classe</label><input id="acl" required></div><div class="form-group"><label>Date limite</label><input id="ad" type="date"></div><div class="form-group"><label>Description / consigne</label><textarea id="ades" rows="4"></textarea></div><button class="btn primary">Publier le devoir</button></form>`;$("modal").classList.remove("hidden")};
window.saveAssignment=async e=>{e.preventDefault();if(!admin()&&!prof())return;try{await addDoc(collection(db,"devoirs"),{titre:$("at").value.trim(),matiere:$("am").value.trim(),classe:$("acl").value.trim(),dateLimite:$("ad").value,description:$("ades").value.trim(),professeurId:currentUser.uid,professeurEmail:currentUser.email,createdAt:serverTimestamp()});closeModal();toast("Devoir publié.");loadAssignments()}catch(e){console.error(e);toast("Impossible de publier le devoir.")}};
window.submitAssignment=async(id,titre)=>{if(!student())return;$("modalTitle").textContent="Remettre le devoir";$("modalBody").innerHTML=`<p><b>${titre}</b></p><form onsubmit="saveSubmission(event,'${id}')"><div class="form-group"><label>Votre réponse / travail</label><textarea id="work" rows="7" required></textarea></div><button class="btn primary">Envoyer</button></form>`;$("modal").classList.remove("hidden")};
window.saveSubmission=async(e,id)=>{e.preventDefault();if(!student())return;try{const d=await getDoc(doc(db,"devoirs",id));if(!d.exists())return toast("Devoir introuvable.");await addDoc(collection(db,"remises"),{devoirId:id,devoirTitre:d.data().titre,etudiantId:currentUser.uid,etudiantNom:currentProfile.nom||currentUser.email,etudiantEmail:currentUser.email,professeurId:d.data().professeurId,contenu:$("work").value.trim(),corrige:false,createdAt:serverTimestamp()});closeModal();toast("Travail remis.");}catch(e){console.error(e);toast("Impossible d'envoyer le travail.")}};

async function loadSubmissions(){
$("page-remises").innerHTML=`<div class="page-title"><h2>📤 Remises / Corrections</h2></div><div class="panel"><div id="subTable">Chargement…</div></div>`;
try{let s=await getDocs(collection(db,"remises"));let h="<table><thead><tr><th>Devoir</th><th>Élève</th><th>Travail</th><th>Note /100</th><th>Action</th></tr></thead><tbody>";s.forEach(x=>{const d=x.data();if(prof()&&d.professeurId!==currentUser.uid)return;if(student()&&d.etudiantId!==currentUser.uid)return;h+=`<tr><td>${esc(d.devoirTitre)}</td><td>${esc(d.etudiantNom)}</td><td>${esc(d.contenu)}</td><td>${d.note100??"—"}</td><td>${prof()?`<button class="btn primary" onclick="correctSubmission('${x.id}')">Corriger</button>`:`<button class="btn light" onclick="viewSubmission('${x.id}')">Voir</button>`}</td></tr>`});$("subTable").innerHTML=h+"</tbody></table>"}catch(e){console.error(e);$("subTable").textContent="Impossible de charger les remises."}
}
window.viewSubmission=async id=>{const s=await getDoc(doc(db,"remises",id));if(!s.exists())return;const d=s.data();$("modalTitle").textContent="Détail de la remise";$("modalBody").innerHTML=`<h3>${esc(d.devoirTitre)}</h3><div class="panel">${esc(d.contenu)}</div><p>Note : ${d.note100??"En attente"} /100</p><p>Commentaire : ${esc(d.commentaire||"Aucun")}</p>`;$("modal").classList.remove("hidden")};
window.correctSubmission=async id=>{if(!prof())return;const s=await getDoc(doc(db,"remises",id));if(!s.exists())return;const d=s.data();$("modalTitle").textContent="Corriger le travail";$("modalBody").innerHTML=`<p><b>${esc(d.devoirTitre)} — ${esc(d.etudiantNom)}</b></p><div class="panel">${esc(d.contenu)}</div><form onsubmit="saveCorrection(event,'${id}')"><div class="form-group"><label>Note sur 100</label><input id="grade" type="number" min="0" max="100" required value="${d.note100??""}"></div><div class="form-group"><label>Commentaire</label><textarea id="comment" rows="4">${esc(d.commentaire||"")}</textarea></div><button class="btn green">Enregistrer la correction</button></form>`;$("modal").classList.remove("hidden")};
window.saveCorrection=async(e,id)=>{e.preventDefault();if(!prof())return;const n=Number($("grade").value);if(n<0||n>100)return toast("La note doit être entre 0 et 100.");try{const s=await getDoc(doc(db,"remises",id));if(!s.exists())return;const d=s.data(),commentaire=$("comment").value.trim();await updateDoc(doc(db,"remises",id),{note100:n,commentaire,corrige:true,correcteurId:currentUser.uid,dateCorrection:serverTimestamp()});await addDoc(collection(db,"resultats"),{remiseId:id,devoirId:d.devoirId,devoirTitre:d.devoirTitre,etudiantId:d.etudiantId,etudiantNom:d.etudiantNom,professeurId:currentUser.uid,note100:n,commentaire,dateCorrection:serverTimestamp()});closeModal();toast("Correction enregistrée.");loadSubmissions()}catch(e){console.error(e);toast("Impossible d'enregistrer la correction.")}};

async function loadResults(){
$("page-resultats").innerHTML=`<div class="page-title"><h2>📊 Résultats / Notes</h2></div><div class="panel"><div id="resultsTable">Chargement…</div></div>`;
try{const s=await getDocs(collection(db,"resultats"));let h="<table><thead><tr><th>Devoir</th><th>Élève</th><th>Note /100</th><th>Commentaire</th></tr></thead><tbody>";s.forEach(x=>{const d=x.data();if(student()&&d.etudiantId!==currentUser.uid)return;if(prof()&&d.professeurId!==currentUser.uid)return;h+=`<tr><td>${esc(d.devoirTitre)}</td><td>${esc(d.etudiantNom)}</td><td>${d.note100??"—"}</td><td>${esc(d.commentaire||"")}</td></tr>`});$("resultsTable").innerHTML=h+"</tbody></table>"}catch(e){console.error(e);$("resultsTable").textContent="Impossible de charger les résultats."}
}
async function loadStats(){
const p=$("page-statistiques");p.innerHTML=`<div class="page-title"><h2>📈 Statistiques</h2></div><div class="stats"><div class="stat-card">Étudiants<strong>${await count("etudiants")}</strong></div><div class="stat-card">Professeurs<strong>${await count("professeurs")}</strong></div><div class="stat-card">Classes<strong>${await count("classes")}</strong></div><div class="stat-card">Devoirs<strong>${await count("devoirs")}</strong></div></div>`;
}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});
window.installApp=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else toast("Ouvrez le menu ⋮ de Chrome puis choisissez Installer l'application ou Ajouter à l'écran d'accueil.")};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.log("Service Worker:",e)));
</script>
</body>
