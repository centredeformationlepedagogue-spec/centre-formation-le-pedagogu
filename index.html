<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f3d91">
<meta name="description" content="Centre de Formation Le Pédagogue — Gestion universitaire et école professionnelle">
<title>Centre de Formation Le Pédagogue</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
:root {
  --blue:#0f3d91;
  --blue2:#174ea6;
  --light:#f3f6fc;
  --white:#fff;
  --text:#17243a;
  --muted:#64748b;
  --border:#dce4f0;
  --green:#16834a;
  --red:#c62828;
  --orange:#b96b00;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,Helvetica,sans-serif;
  background:var(--light);color:var(--text)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
button:disabled{opacity:.5;cursor:not-allowed}
#authScreen{
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:18px;
  background:linear-gradient(135deg,#0f3d91,#3674c9)
}
.auth-card{
  width:100%;max-width:440px;background:#fff;
  padding:26px;border-radius:18px;
  box-shadow:0 16px 50px #0002
}
.logo{
  width:76px;height:76px;object-fit:contain;
  display:block;margin:0 auto 12px
}
.auth-card h1{text-align:center;color:var(--blue);font-size:23px}
.auth-card p{text-align:center;color:var(--muted);line-height:1.5}
.field{margin:12px 0}
.field label{display:block;font-weight:bold;margin-bottom:6px;font-size:14px}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--border);
  border-radius:9px;background:#fff;color:var(--text)
}
textarea{min-height:90px;resize:vertical}
.btn{
  border:0;border-radius:8px;padding:10px 14px;
  font-weight:bold;display:inline-flex;align-items:center;
  justify-content:center;gap:6px
}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:#e6edf9;color:var(--blue)}
.btn-danger{background:#fde8e8;color:#a51d1d}
.btn-success{background:#dff6e8;color:#126b3a}
.btn-google{
  width:100%;background:#fff;border:1px solid #dadce0;
  color:#333;margin-top:10px
}
.btn-google strong{color:#4285f4;font-size:18px}
.btn-block{width:100%;margin-top:9px}
.auth-message{padding:10px;border-radius:8px;margin-top:12px;font-size:14px}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.info{background:#dbeafe;color:#1e40af}
#app{min-height:100vh}
.topbar{
  height:66px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px 18px;position:sticky;top:0;z-index:20
}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;color:var(--blue)}
.brand img{width:42px;height:42px;object-fit:contain}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-info{font-size:12px;color:var(--muted);max-width:220px;overflow-wrap:anywhere}
.layout{display:flex;min-height:calc(100vh - 66px)}
.sidebar{
  width:245px;flex-shrink:0;background:#102f6c;color:#fff;
  padding:18px 12px;min-height:calc(100vh - 66px)
}
.sidebar-title{font-size:12px;text-transform:uppercase;opacity:.7;padding:8px}
.nav-btn{
  display:block;width:100%;text-align:left;border:0;
  padding:11px 12px;border-radius:8px;background:transparent;
  color:#eaf1ff;margin:3px 0
}
.nav-btn:hover,.nav-btn.active{background:#ffffff20;color:#fff}
.main{flex:1;min-width:0;padding:24px}
.page-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin-bottom:18px
}
.page-head h2{margin:0;color:var(--blue)}
.card{
  background:#fff;border:1px solid var(--border);
  border-radius:13px;padding:18px;margin-bottom:18px;
  box-shadow:0 2px 8px #102f6c08
}
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
  gap:14px;margin-bottom:20px
}
.stat{
  padding:18px;background:#fff;border:1px solid var(--border);
  border-radius:12px
}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:28px;color:var(--blue);margin-top:8px}
.table-wrap{overflow-x:auto;width:100%}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border-bottom:1px solid var(--border);padding:11px;text-align:left;font-size:13px}
th{background:#edf3fc;color:var(--blue)}
td{overflow-wrap:anywhere}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions .btn{padding:7px 9px;font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .field{margin:0}
.form-grid .full{grid-column:1/-1}
.muted{color:var(--muted)}
.notice{padding:12px;border-radius:9px;background:#eff6ff;color:#1e40af;margin:12px 0}
.badge{display:inline-block;padding:4px 8px;border-radius:30px;font-size:11px;font-weight:bold}
.badge-ok{background:#dcfce7;color:#166534}
.badge-wait{background:#fef3c7;color:#92400e}
.badge-no{background:#fee2e2;color:#991b1b}
#toast{
  position:fixed;bottom:20px;right:20px;z-index:99;
  max-width:calc(100% - 40px);padding:13px 17px;border-radius:9px;
  color:white;background:#17243a;box-shadow:0 5px 20px #0002
}
#toast.bad{background:#a51d1d}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:800px){
  .topbar{height:auto;align-items:flex-start;flex-direction:column}
  .top-actions{width:100%}
  .user-info{max-width:100%}
  .layout{display:block}
  .sidebar{width:100%;min-height:0;padding:10px;display:flex;flex-wrap:wrap;gap:3px}
  .sidebar-title{width:100%}
  .nav-btn{width:auto;flex:1 1 135px;margin:0;font-size:13px}
  .main{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
}
</style>
</head>
<body>

<section id="authScreen">
  <div class="auth-card">
    <img class="logo" src="./icon-192.png"
      onerror="this.style.display='none'" alt="Logo">
    <h1>Centre de Formation Le Pédagogue</h1>
    <p>Gestion universitaire et école professionnelle</p>

    <div id="authMessage"></div>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Adresse e-mail</label>
        <input id="loginEmail" type="email" autocomplete="username" required>

          autocomplete="current-password" required>

    </button>

      Mot de passe oublié ?

    </p>

</section>

<section id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <img src="./icon-192.png" onerror="this.style.display='none'" alt="">
      <span>Centre de Formation Le Pédagogue</span>
    </div>
    <div class="top-actions">
      <span id="userInfo" class="user-info"></span>
      <button id="installBtn" class="btn btn-secondary hidden" type="button">
        Installer l'application
      </button>
      <button id="logoutBtn" class="btn btn-danger" type="button">
        🚪 Déconnexion
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Menu principal</div>
      <div id="navigation"></div>
    </aside>

    <main class="main">
      <div class="page-head">
        <h2 id="pageTitle">Accueil</h2>
        <button id="refreshBtn" class="btn btn-secondary" type="button">
          ↻ Actualiser
        </button>
      </div>
      <div id="pageContent"></div>
      <footer>Centre de Formation Le Pédagogue</footer>
    </main>
  </div>
</section>

<div id="toast" class="hidden"></div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  signOut,
  sendEmailVerification,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  collection,
  getDocs,
  addDoc,
  serverTimestamp,
  query,
  where,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =====================================================
   CONFIGURATION FIREBASE DU PROJET EXISTANT
   ===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyAhrtcVaEZ7oU-p4Ihzl0APX2ccXKi4jBU",
  authDomain: "centre-de-formation-le-pe.firebaseapp.com",
  projectId: "centre-de-formation-le-pe",
  storageBucket: "centre-de-formation-le-pe.firebasestorage.app",
  messagingSenderId: "11834103838",
  appId: "1:11834103838:web:b82c994e78486cd313760f"
};

const ADMIN_EMAIL = "centredeformationlepedagogue@gmail.com";

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });

let currentUser = null;
let currentProfile = null;
let currentPage = "accueil";
let installPrompt = null;
let editingId = null;
let currentModule = null;

/* =====================================================
   OUTILS GÉNÉRAUX
   ===================================================== */

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function toast(message, bad = false) {
  const el = $("toast");
  el.textContent = message;
  el.classList.remove("hidden", "bad");
  if (bad) el.classList.add("bad");
  setTimeout(() => el.classList.add("hidden"), 4500);
}

function showAuthMessage(message, type = "info") {
  $("authMessage").innerHTML =
    `<div class="auth-message ${type}">${escapeHTML(message)}</div>`;
}

function friendlyError(error) {
  const code = error?.code || "";
  const messages = {
    "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
    "auth/invalid-email": "Adresse e-mail invalide.",
    "auth/user-not-found": "Aucun compte ne correspond à cette adresse.",
    "auth/wrong-password": "Mot de passe incorrect.",
    "auth/email-already-in-use": "Cette adresse e-mail possède déjà un compte.",
    "auth/weak-password": "Le mot de passe doit contenir au moins 6 caractères.",
    "auth/popup-closed-by-user": "La fenêtre Google a été fermée.",
    "auth/popup-blocked": "Le navigateur a bloqué la fenêtre Google.",
    "auth/unauthorized-domain": "Ce domaine n'est pas autorisé dans Firebase Authentication.",
    "permission-denied": "Accès refusé par les règles Firestore. Vérifiez les permissions et les champs.",
    "unavailable": "Service temporairement indisponible. Réessayez."
  };
  return messages[code] || error?.message || "Une erreur est survenue.";
}

function isAdmin() {
  return !!currentUser && (
    currentUser.email?.toLowerCase() === ADMIN_EMAIL
      && currentUser.emailVerified
    || currentProfile?.role === "administrateur"
      && currentProfile?.status === "accepted"
  );
}

function isApproved() {
  return !!currentProfile &&
    (isAdmin() ||
      (currentProfile.status === "accepted" &&
       ["professeur", "eleve", "etudiant"].includes(currentProfile.role)));
}

function roleName(role) {
  return ({
    administrateur: "Administrateur",
    professeur: "Professeur",
    eleve: "Élève",
    etudiant: "Étudiant"
  })[role] || role || "Non défini";
}

function statusBadge(status) {
  if (status === "accepted") {
    return '<span class="badge badge-ok">Accepté</span>';
  }
  if (status === "refuse") {
    return '<span class="badge badge-no">Refusé</span>';
  }
  return '<span class="badge badge-wait">En attente</span>';
}

function stamp() {
  return serverTimestamp();
}

/* =====================================================
   AUTHENTIFICATION ET PROFILS
   ===================================================== */

async function ensureUserProfile(user) {
  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);
  const email = (user.email || "").toLowerCase();
  const isAdminEmail = email === ADMIN_EMAIL && user.emailVerified;

  if (!snap.exists()) {
    const profile = {
      uid: user.uid,
      email: user.email || "",
      role: isAdminEmail ? "administrateur" : "eleve",
      status: isAdminEmail ? "accepted" : "attente",
      createdAt: stamp(),
      updatedAt: stamp()
    };

    await setDoc(userRef, profile);
    return profile;
  }

  let profile = snap.data();

  // L'adresse administrateur vérifiée garde son accès administrateur.
  if (isAdminEmail &&
      (profile.role !== "administrateur" || profile.status !== "accepted")) {
    await updateDoc(userRef, {
      role: "administrateur",
      status: "accepted",
      email: user.email || ADMIN_EMAIL,
      updatedAt: stamp()
    });
    profile = {
      ...profile,
      role: "administrateur",
      status: "accepted",
      email: user.email || ADMIN_EMAIL
    };
  }

  return profile;
}

async function completeLogin(user) {
  currentUser = user;

  try {
    currentProfile = await ensureUserProfile(user);
  } catch (error) {
    console.error(error);
    await signOut(auth);
    showAuthMessage(
      "Impossible de charger le profil. Vérifiez les règles Firestore et l'état de vérification de l'e-mail administrateur.",
      "error"
    );
    return;
  }

  if (!isApproved()) {
    const status = currentProfile?.status;
    await signOut(auth);

    if (status === "refuse") {
      showAuthMessage(
        "Votre demande d'accès a été refusée. Contactez l'administrateur.",
        "error"
      );
    } else {
      showAuthMessage(
        "Votre compte est en attente de validation par l'administrateur.",
        "info"
      );
    }
    currentUser = null;
    currentProfile = null;
    return;
  }

  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");

  const name = currentProfile?.nom ||
    currentProfile?.name ||
    user.displayName ||
    user.email;

  $("userInfo").textContent =
    `${name} — ${roleName(currentProfile?.role)}`;

  buildNavigation();
  await openPage("accueil");
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    currentUser = null;
    currentProfile = null;
    $("app").classList.add("hidden");
    $("authScreen").classList.remove("hidden");
    return;
  }

  await completeLogin(user);
});

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    showAuthMessage("Connexion en cours…");
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;
    const result = await signInWithEmailAndPassword(auth, email, password);
    await completeLogin(result.user);
  } catch (error) {
    showAuthMessage(friendlyError(error), "error");
  }
});

$("createAccountBtn").addEventListener("click", async () => {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if (!email || !password) {
    showAuthMessage("Saisissez votre e-mail et un mot de passe.", "error");
    return;
  }

  if (password.length < 6) {
    showAuthMessage("Le mot de passe doit contenir au moins 6 caractères.", "error");
    return;
  }

  try {
    const result = await createUserWithEmailAndPassword(auth, email, password);
    await sendEmailVerification(result.user);
    showAuthMessage(
      "Compte créé. Une demande d'accès en attente a été enregistrée. Vérifiez aussi votre boîte e-mail.",
      "info"
    );
    await signOut(auth);
  } catch (error) {
    showAuthMessage(friendlyError(error), "error");
  }
});

$("googleBtn").addEventListener("click", async () => {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    await completeLogin(result.user);
  } catch (error) {
    showAuthMessage(friendlyError(error), "error");
  }
});

$("resetPasswordBtn").addEventListener("click", async () => {
  const email = $("loginEmail").value.trim();
  if (!email) {
    showAuthMessage("Saisissez votre e-mail avant de demander une réinitialisation.", "error");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showAuthMessage("Si le compte existe, un e-mail de réinitialisation sera envoyé.", "success");
  } catch (error) {
    showAuthMessage(friendlyError(error), "error");
  }
});

$("logoutBtn").addEventListener("click", async () => {
  if (!confirm("Voulez-vous vraiment vous déconnecter ?")) return;
  try {
    await signOut(auth);
    toast("Déconnexion effectuée.");
  } catch (error) {
    toast(friendlyError(error), true);
  }
});

/* =====================================================
   MODULES DE L'APPLICATION
   ===================================================== */

const modules = [
  {id:"etudiants", title:"Étudiants", collection:"etudiants", fields:[
    ["nom","Nom"],["prenom","Prénom"],["email","E-mail"],["telephone","Téléphone"],
    ["uid","UID utilisateur"],["classeId","ID de classe"]
  ]},
  {id:"eleves", title:"Élèves", collection:"eleves", fields:[
    ["nom","Nom"],["prenom","Prénom"],["email","E-mail"],["telephone","Téléphone"],
    ["uid","UID utilisateur"],["classeId","ID de classe"]
  ]},
  {id:"professeurs", title:"Professeurs", collection:"professeurs", fields:[
    ["nom","Nom"],["prenom","Prénom"],["email","E-mail"],["telephone","Téléphone"],
    ["uid","UID utilisateur"],["userId","User ID"]
  ]},
  {id:"departements", title:"Départements", collection:"departements", fields:[
    ["nom","Nom"],["description","Description"]
  ]},
  {id:"filieres", title:"Filières", collection:"filieres", fields:[
    ["nom","Nom"],["description","Description"],["departementId","ID département"]
  ]},
  {id:"classes", title:"Classes", collection:"classes", fields:[
    ["nom","Nom de la classe"],["niveau","Niveau"],["filiereId","ID filière"],
    ["anneeAcademique","Année académique"]
  ]},
  {id:"matieres", title:"Matières", collection:"matieres", fields:[
    ["nom","Nom"],["code","Code"],["description","Description"]
  ]},
  {id:"cours", title:"Cours", collection:"cours", fields:[
    ["nom","Titre du cours"],["description","Description"],["matiereId","ID matière"],
    ["classeId","ID classe"]
  ]},
  {id:"annees", title:"Années académiques", collection:"annees_academiques", fields:[
    ["nom","Nom"],["debut","Date de début"],["fin","Date de fin"],["statut","Statut"]
  ]},
  {id:"affectations", title:"Affectations", collection:"affectations", fields:[
    ["professeurId","ID professeur"],["professeurUid","UID professeur"],
    ["classeId","ID classe"],["matiereId","ID matière"],["coursId","ID cours"]
  ]},
  {id:"inscriptions", title:"Élèves / Classes", collection:"inscriptions", fields:[
    ["etudiantId","UID étudiant"],["eleveId","UID élève"],["classeId","ID classe"],
    ["anneeAcademique","Année académique"],["statut","Statut"]
  ]},
  {id:"devoirs", title:"Devoirs", collection:"devoirs", fields:[
    ["titre","Titre"],["description","Description"],["classeId","ID classe"],
    ["professeurId","UID professeur"],["professeurUid","UID professeur"],
    ["dateLimite","Date limite"]
  ]},
  {id:"remises", title:"Remises / Corrections", collection:"remises", fields:[
    ["devoirId","ID devoir"],["etudiantId","UID étudiant"],["classeId","ID classe"],
    ["professeurId","UID professeur"],["professeurUid","UID professeur"],
    ["contenu","Travail remis"],["dateRemise","Date de remise"],
    ["note100","Note sur 100"],["commentaire","Commentaire"],["statut","Statut"]
  ]},
  {id:"resultats", title:"Résultats", collection:"resultats", fields:[
    ["etudiantId","UID étudiant"],["classeId","ID classe"],
    ["professeurId","UID professeur"],["professeurUid","UID professeur"],
    ["matiereId","ID matière"],["note100","Note sur 100"],
    ["note20","Note sur 20"],["commentaire","Commentaire"]
  ]},
  {id:"statistiques", title:"Statistiques", collection:"statistiques", fields:[
    ["nom","Nom"],["description","Description"],["valeur","Valeur"]
  ]},
  {id:"configuration", title:"Configuration", collection:"configuration", fields:[
    ["nom","Nom"],["valeur","Valeur"],["description","Description"]
  ]}
];

const mainNav = [
  ["accueil","🏠","Accueil"],
  ["etudiants","🎓","Étudiants"],
  ["eleves","👨‍🎓","Élèves"],
  ["professeurs","👨‍🏫","Professeurs"],
  ["departements","🏢","Départements"],
  ["filieres","📚","Filières"],
  ["classes","🏫","Classes"],
  ["matieres","📖","Matières"],
  ["cours","📝","Cours"],
  ["annees","📅","Années académiques"],
  ["affectations","🔗","Affectations"],
  ["inscriptions","📋","Élèves / Classes"],
  ["devoirs","🗒️","Devoirs"],
  ["remises","📥","Remises / Corrections"],
  ["resultats","📊","Résultats"]
];

function buildNavigation() {
  const nav = $("navigation");
  nav.innerHTML = "";

  const allowed = mainNav.filter(([id]) => {
    if (isAdmin()) return true;
    return ["accueil", "devoirs", "remises", "resultats"].includes(id);
  });

  allowed.forEach(([id, icon, label]) => {
    const button = document.createElement("button");
    button.className = "nav-btn" + (id === currentPage ? " active" : "");
    button.textContent = `${icon} ${label}`;
    button.addEventListener("click", () => openPage(id));
    nav.appendChild(button);
  });

  if (isAdmin()) {
    const title = document.createElement("div");
    title.className = "sidebar-title";
    title.textContent = "Administration";
    nav.appendChild(title);

    [
      ["utilisateurs","👥 Utilisateurs"],
      ["sauvegarde","💾 Données / Sauvegarde"]
    ].forEach(([id,label]) => {
      const button = document.createElement("button");
      button.className = "nav-btn" + (id === currentPage ? " active" : "");
      button.textContent = label;
      button.addEventListener("click", () => openPage(id));
      nav.appendChild(button);
    });
  }
}

async function openPage(page) {
  if (!isApproved()) return;
  if (!isAdmin() && !["accueil","devoirs","remises","resultats"].includes(page)) {
    toast("Vous n'avez pas accès à ce module.", true);
    return;
  }

  currentPage = page;
  editingId = null;
  currentModule = null;
  buildNavigation();

  const titles = {
    accueil:"Accueil",
    utilisateurs:"Gestion des utilisateurs",
    sauvegarde:"Données / Sauvegarde"
  };
  const module = modules.find(m => m.id === page);
  $("pageTitle").textContent = titles[page] || module?.title || page;
  $("pageContent").innerHTML = '<div class="card">Chargement…</div>';

  try {
    if (page === "accueil") return await renderDashboard();
    if (page === "utilisateurs") return await renderUsers();
    if (page === "sauvegarde") return await renderBackup();
    if (module) {
      currentModule = module;
      return await renderModule(module);
    }
    $("pageContent").innerHTML = '<div class="card">Module non disponible.</div>';
  } catch (error) {
    console.error(error);
    $("pageContent").innerHTML =
      `<div class="card"><b>Erreur :</b> ${escapeHTML(friendlyError(error))}</div>`;
  }
}

$("refreshBtn").addEventListener("click", () => openPage(currentPage));

  return snap.size;
}

/* =====================================================
   GESTION DES MODULES ET DONNÉES FIRESTORE
   ===================================================== */

async function getModuleRecords(module) {
  let snap;

  if (isAdmin()) {
    snap = await getDocs(collection(db, module.collection));
  } else {
    // Les règles Firestore ne filtrent pas les résultats automatiquement.
    // Les requêtes ci-dessous limitent la lecture aux documents de l'utilisateur.
    if (module.id === "devoirs") {
      const profile = currentProfile || {};
      const classIds = Array.isArray(profile.classIds)
        ? profile.classIds
        : (profile.classeId ? [profile.classeId] : []);

      if (!classIds.length) return [];

      if (classIds.length === 1) {
        snap = await getDocs(query(
          collection(db, "devoirs"),
          where("classeId", "==", classIds[0])
        ));
      } else {
        snap = await getDocs(query(
          collection(db, "devoirs"),
          where("classeId", "in", classIds.slice(0, 30))
        ));
      }
    } else if (module.id === "remises") {
      if (currentProfile.role === "professeur") {
        snap = await getDocs(query(
          collection(db, "remises"),
          where("professeurUid", "==", currentUser.uid)
        ));
      } else {
        snap = await getDocs(query(
          collection(db, "remises"),
          where("etudiantId", "==", currentUser.uid)
        ));
      }
    } else if (module.id === "resultats") {
      if (currentProfile.role === "professeur") {
        snap = await getDocs(query(
          collection(db, "resultats"),
          where("professeurUid", "==", currentUser.uid)
        ));
      } else {
        snap = await getDocs(query(
          collection(db, "resultats"),
          where("etudiantId", "==", currentUser.uid)
        ));
      }
    } else {
      return [];
    }
  }

  return snap.docs.map(d => ({id:d.id, ...d.data()}));
}

async function renderModule(module) {
  const admin = isAdmin();
  const records = await getModuleRecords(module);

  let html = `
    <div class="card">
      <div class="page-head">
        <div>
          <h3>${escapeHTML(module.title)}</h3>
          <p class="muted">${records.length} enregistrement(s)</p>
        </div>
        ${admin || ["devoirs","remises","resultats"].includes(module.id)
          ? `<button class="btn btn-primary" id="newRecordBtn">＋ Ajouter</button>`
          : ""}
      </div>
      <div id="recordFormArea"></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Informations</th><th>Actions</th>
          </tr></thead>
          <tbody>
            ${records.map(record => {
              const summary = module.fields.map(([key,label]) =>
                record[key] !== undefined && record[key] !== ""
                  ? `<div><b>${escapeHTML(label)} :</b> ${escapeHTML(record[key])}</div>`
                  : ""
              ).join("");
              const canEdit = admin ||
                (module.id === "devoirs" && currentProfile.role === "professeur") ||
                (module.id === "remises" && currentProfile.role === "professeur");
              return `<tr>
                <td>${summary || escapeHTML(record.id)}</td>
                <td>
                  <div class="actions">
                    ${canEdit ? `<button class="btn btn-secondary" data-edit="${escapeHTML(record.id)}">Modifier</button>` : ""}
                    ${admin ? `<button class="btn btn-danger" data-delete="${escapeHTML(record.id)}">Supprimer</button>` : ""}
                  </div>
                </td>
              </tr>`;
            }).join("") || '<tr><td colspan="2">Aucun enregistrement.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;

  $("pageContent").innerHTML = html;

  const newButton = $("newRecordBtn");
  if (newButton) newButton.addEventListener("click", () => showRecordForm(module, null));

  $("pageContent").querySelectorAll("[data-edit]").forEach(button => {
    button.addEventListener("click", () => {
      const record = records.find(r => r.id === button.dataset.edit);
      if (record) showRecordForm(module, record);
    });
  });

  $("pageContent").querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", async () => {
      if (!confirm("Supprimer définitivement cet enregistrement ?")) return;
      try {
        await deleteDoc(doc(db, module.collection, button.dataset.delete));
        toast("Enregistrement supprimé.");
        await openPage(module.id);
      } catch (error) {
        toast(friendlyError(error), true);
      }
    });
  });
}

function showRecordForm(module, record) {
  if (!isAdmin() &&
      !["devoirs","remises","resultats"].includes(module.id)) {
    toast("Action réservée à l'administrateur.", true);
    return;
  }

  editingId = record?.id || null;
  currentModule = module;

  const fields = module.fields.map(([key,label]) => {
    let value = record?.[key] ?? "";

    // Préremplir les identifiants de l'utilisateur connecté pour les données pédagogiques.
    if (!record && ["devoirs","remises","resultats"].includes(module.id)) {
      if (key === "professeurId" || key === "professeurUid") {
        value = currentProfile.role === "professeur" ? currentUser.uid : "";
      }
      if (key === "etudiantId" && currentProfile.role !== "professeur") {
        value = currentUser.uid;
      }
    }

    const large = ["description","contenu","commentaire"].includes(key);
    const input = large
      ? `<textarea name="${escapeHTML(key)}">${escapeHTML(value)}</textarea>`
      : `<input name="${escapeHTML(key)}" value="${escapeHTML(value)}"
          ${key === "note100" || key === "note20" ? 'type="number" min="0"' : "type=\"text\""}>`;

    return `<div class="field ${large ? "full" : ""}">
      <label>${escapeHTML(label)}</label>${input}
    </div>`;
  }).join("");

  $("recordFormArea").innerHTML = `
    <div class="card">
      <h3>${record ? "Modifier" : "Ajouter"} — ${escapeHTML(module.title)}</h3>
      <form id="recordForm">
        <div class="form-grid">${fields}</div>
        <div class="actions" style="margin-top:14px">
          <button class="btn btn-primary" type="submit">Enregistrer</button>
          <button class="btn btn-secondary" id="cancelFormBtn" type="button">Annuler</button>
        </div>
      </form>
    </div>`;

  $("cancelFormBtn").addEventListener("click", () => {
    $("recordFormArea").innerHTML = "";
    editingId = null;
  });

  $("recordForm").addEventListener("submit", async event => {
    event.preventDefault();

    const formData = new FormData(event.currentTarget);
    const data = {};

    for (const [key, value] of formData.entries()) {
      data[key] = String(value).trim();
    }

    // Champs d'identité fiables pour les opérations pédagogiques.
    if (["devoirs","remises","resultats"].includes(module.id)) {
      if (currentProfile.role === "professeur") {
        data.professeurId = currentUser.uid;
        data.professeurUid = currentUser.uid;
      }
      if (module.id === "remises" &&
          currentProfile.role !== "professeur" &&
          !isAdmin()) {
        data.etudiantId = currentUser.uid;
      }
    }

    if (module.id === "remises" && !isAdmin() &&
        currentProfile.role === "eleve") {
      delete data.note20;
      delete data.note100;
      delete data.commentaire;
      delete data.corrige;
      delete data.dateCorrection;
    }

    try {
      if (editingId) {
        data.updatedAt = stamp();
        await updateDoc(doc(db, module.collection, editingId), data);
      } else {
        data.createdAt = stamp();
        data.updatedAt = stamp();
        await addDoc(collection(db, module.collection), data);
      }

      toast("Enregistrement effectué.");
      editingId = null;
      await openPage(module.id);
    } catch (error) {
      console.error(error);
      toast(friendlyError(error), true);
    }
  });
}

/* =====================================================
   ADMINISTRATION DES UTILISATEURS
   ===================================================== */

async function renderUsers() {
  if (!isAdmin()) {
    $("pageContent").innerHTML = '<div class="card">Accès réservé à l’administrateur.</div>';
    return;
  }

  const snap = await getDocs(collection(db, "users"));
  const users = snap.docs.map(d => ({id:d.id, ...d.data()}));

  $("pageContent").innerHTML = `
    <div class="card">
      <h3>Utilisateurs enregistrés</h3>
      <p class="muted">Acceptez les demandes, attribuez les rôles et contrôlez les accès.</p>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>E-mail</th><th>Rôle</th><th>Statut</th><th>UID</th><th>Actions</th>
          </tr></thead>
          <tbody>
          ${users.map(user => `
            <tr>
              <td>${escapeHTML(user.email || "")}</td>
              <td>
                <select data-role="${escapeHTML(user.id)}">
                  <option value="eleve" ${user.role === "eleve" ? "selected" : ""}>Élève</option>
                  <option value="etudiant" ${user.role === "etudiant" ? "selected" : ""}>Étudiant</option>
                  <option value="professeur" ${user.role === "professeur" ? "selected" : ""}>Professeur</option>
                  ${user.role === "administrateur" ? '<option value="administrateur" selected>Administrateur</option>' : ""}
                </select>
              </td>
              <td>
                <select data-status="${escapeHTML(user.id)}">
                  <option value="attente" ${user.status === "attente" ? "selected" : ""}>En attente</option>
                  <option value="accepted" ${user.status === "accepted" ? "selected" : ""}>Accepté</option>
                  <option value="refuse" ${user.status === "refuse" ? "selected" : ""}>Refusé</option>
                </select>
              </td>
              <td>${escapeHTML(user.uid || user.id)}</td>
              <td><div class="actions">
                <button class="btn btn-success" data-save-user="${escapeHTML(user.id)}">Enregistrer</button>
                ${user.id !== currentUser.uid
                  ? `<button class="btn btn-danger" data-delete-user="${escapeHTML(user.id)}">Supprimer</button>`
                  : ""}
              </div></td>
            </tr>`).join("") || '<tr><td colspan="5">Aucun utilisateur.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;

  $("pageContent").querySelectorAll("[data-save-user]").forEach(button => {
    button.addEventListener("click", async () => {
      const uid = button.dataset.saveUser;
      const role = $("pageContent").querySelector(`[data-role="${CSS.escape(uid)}"]`).value;
      const status = $("pageContent").querySelector(`[data-status="${CSS.escape(uid)}"]`).value;

      if (uid === currentUser.uid &&
          (role !== "administrateur" || status !== "accepted")) {
        toast("Vous ne pouvez pas retirer votre propre accès administrateur ici.", true);
        return;
      }

      if (role === "administrateur" &&
          uid !== currentUser.uid &&
          currentUser.email.toLowerCase() !== ADMIN_EMAIL) {
        toast("Seul le compte administrateur principal peut attribuer ce rôle.", true);
        return;
      }

      try {
        await updateDoc(doc(db, "users", uid), {
          role,
          status,
          updatedAt: stamp()
        });
        toast("Utilisateur mis à jour.");
        await renderUsers();
      } catch (error) {
        toast(friendlyError(error), true);
      }
    });
  });

  $("pageContent").querySelectorAll("[data-delete-user]").forEach(button => {
    button.addEventListener("click", async () => {
      const uid = button.dataset.deleteUser;
      if (!confirm("Supprimer le profil Firestore de cet utilisateur ? Le compte Firebase Authentication ne sera pas supprimé par cette action.")) return;

      try {
        await deleteDoc(doc(db, "users", uid));
        toast("Profil supprimé.");
        await renderUsers();
      } catch (error) {
        toast(friendlyError(error), true);
      }
    });
  });
}

/* =====================================================
   SAUVEGARDE DES DONNÉES
   ===================================================== */

async function renderBackup() {
  if (!isAdmin()) {
    $("pageContent").innerHTML = '<div class="card">Accès réservé à l’administrateur.</div>';
    return;
  }

  $("pageContent").innerHTML = `
    <div class="card">
      <h3>Exporter les données Firestore</h3>
      <p>Cette fonction crée un fichier JSON avec les collections autorisées.</p>
      <button id="exportBtn" class="btn btn-primary">Exporter les données</button>
      <div class="notice">
        Conservez les sauvegardes dans un endroit sûr. Elles peuvent contenir des données personnelles.
      </div>
    </div>`;

  $("exportBtn").addEventListener("click", async () => {
    const names = [
      "users","etudiants","eleves","professeurs","departements","filieres",
      "programmes","classes","matieres","cours","annees_academiques",
      "horaires","affectations","inscriptions","devoirs","remises",
      "resultats","statistiques","configuration","sauvegardes"
    ];

    const backup = {
      application: "Centre de Formation Le Pédagogue",
      exportedAt: new Date().toISOString(),
      projectId: firebaseConfig.projectId,
      collections: {}
    };

    try {
      for (const name of names) {
        const snap = await getDocs(collection(db, name));
        backup.collections[name] = snap.docs.map(d => ({
          id: d.id,
          ...d.data()
        }));
      }

      const blob = new Blob(
        [JSON.stringify(backup, null, 2)],
        {type:"application/json"}
      );
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `sauvegarde-le-pedagogue-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      toast("Export terminé.");
    } catch (error) {
      toast(friendlyError(error), true);
    }
  });
}
