<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Centre de Formation Le Pédagogue">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<title>Centre de Formation Le Pédagogue</title>
<style>
*{box-sizing:border-box}
:root{--blue:#1d4ed8;--dark:#0f172a;--bg:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--green:#16a34a;--red:#dc2626}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px}
.hidden{display:none!important}
.btn-primary{background:var(--blue);color:white}
.btn-success{background:var(--green);color:white}
.btn-danger{background:var(--red);color:white}
.btn-light{background:#e2e8f0;color:var(--dark)}
#authPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f172a,#2563eb)}
.auth-card{width:100%;max-width:440px;background:white;padding:28px;border-radius:18px;box-shadow:0 15px 45px #0003}
.logo{text-align:center;margin-bottom:24px}
.logo img{width:75px;height:75px;object-fit:contain}
.logo h1{font-size:22px}
.logo p{color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:white}
.message{padding:12px;border-radius:8px;margin:12px 0;background:#dbeafe;color:#1e40af}
.message.error{background:#fee2e2;color:#991b1b}
.message.success{background:#dcfce7;color:#166534}
.topbar{height:66px;position:fixed;top:0;left:0;right:0;z-index:10;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold}
.brand img{width:38px;height:38px;object-fit:contain}
.top-actions{display:flex;align-items:center;gap:8px}
.top-actions select{max-width:125px;padding:8px;border:1px solid var(--border);border-radius:8px}
.sidebar{position:fixed;left:0;top:66px;bottom:0;width:265px;overflow:auto;background:linear-gradient(#0f172a,#172b50);padding:12px;z-index:9}
.nav-title{color:#94a3b8;font-size:11px;font-weight:bold;padding:15px 8px 7px;text-transform:uppercase}
.nav-btn{width:100%;display:block;text-align:left;background:transparent;color:#dbeafe;margin:3px 0}
.nav-btn:hover,.nav-btn.active{background:var(--blue);color:white}
.main{margin-left:265px;padding:88px 24px 30px}
.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-title h2{margin:0;font-size:26px}
.page-title p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:22px}
.stat,.panel,.assignment-card{background:white;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 5px 20px #0f172a0a}
.stat .num{font-size:28px;font-weight:bold;margin:8px 0}
.panel{margin-bottom:20px;overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{padding:10px;border:1px solid var(--border);border-radius:8px;max-width:100%}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}
th{background:#f8fafc}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{padding:7px 9px;font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fef3c7;color:#92400e}
.badge.ok{background:#dcfce7;color:#166534}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
.modal{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{width:100%;max-width:650px;max-height:90vh;overflow:auto;background:white;border-radius:15px;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.assignment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.assignment-card h3{margin-top:0}
.assignment-card p{line-height:1.5;color:#475569}
.toast{position:fixed;bottom:18px;right:18px;z-index:30;background:#0f172a;color:white;padding:13px 18px;border-radius:9px}
.mobile-menu{display:none;background:var(--blue);color:white}
@media(max-width:950px){
.sidebar{transform:translateX(-105%);transition:.2s}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0;padding:84px 12px 22px}
.mobile-menu{display:inline-block}
.brand-name{display:none}
.topbar{padding:0 8px}
.top-actions{gap:4px}
.top-actions button{padding:8px}
}
@media(max-width:560px){
.form-grid{grid-template-columns:1fr}
.full{grid-column:auto}
.auth-card{padding:22px}
.top-actions select{max-width:95px;font-size:12px}
.topbar .brand img{width:30px;height:30px}
.page-title h2{font-size:22px}
}
</style>
</head>
<body>

<div id="authPage">
  <div class="auth-card">
    <div class="logo">
      <img src="./icon-192.png" alt="Logo">
      <h1>Centre de Formation Le Pédagogue</h1>
      <p>Gestion universitaire et école professionnelle</p>
    </div>
    <div id="authMessage"></div>
    <div id="loginBox">
      <h2>Connexion</h2>
      <div class="field">
        <label for="loginEmail">Adresse email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">Mot de passe</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-primary" style="width:100%" onclick="login()">Se connecter</button>
      <button class="btn-light" style="width:100%;margin-top:8px" onclick="loginGoogle()">Continuer avec Google</button>
      <p>Pas encore de compte ? <button class="btn-light" onclick="showRegister()">Créer un compte</button></p>
    </div>
    <div id="registerBox" class="hidden">
      <h2>Créer un compte</h2>
      <div class="field"><label for="registerName">Nom complet</label><input id="registerName" required></div>
      <div class="field"><label for="registerEmail">Email</label><input id="registerEmail" type="email" required></div>
      <div class="field"><label for="registerPassword">Mot de passe (6 caractères minimum)</label><input id="registerPassword" type="password" minlength="6" required></div>
      <button class="btn-primary" style="width:100%" onclick="register()">Créer mon compte</button>
      <p>Votre compte sera en attente d'approbation par l'administrateur.</p>
      <button class="btn-light" onclick="showLogin()">Retour à la connexion</button>
    </div>
  </div>
</div>

<div id="appPage" class="hidden">
  <header class="topbar">
    <div class="brand">
      <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
      <img src="./icon-192.png" alt="">
      <span class="brand-name">Centre de Formation Le Pédagogue</span>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="btn-success" onclick="installApp()">📲 Installer</button>
      <select id="language" onchange="changeLanguage(this.value)">
        <option value="fr">🇫🇷 Français</option>
        <option value="ht">🇭🇹 Kreyòl</option>
      </select>
      <button class="btn-light" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <aside id="sidebar" class="sidebar">
    <div class="nav-title">Principal</div>
    <button class="nav-btn active" onclick="showPage('dashboard',this)">🏠 Accueil</button>
    <div id="adminNav">
      <div class="nav-title">Administration académique</div>
      <button class="nav-btn" onclick="showPage('etudiants',this)">👨‍🎓 Étudiants</button>
      <button class="nav-btn" onclick="showPage('professeurs',this)">👨‍🏫 Professeurs</button>
      <button class="nav-btn" onclick="showPage('departements',this)">🏛️ Départements</button>
      <button class="nav-btn" onclick="showPage('filieres',this)">🎓 Filières / Programmes</button>
      <button class="nav-btn" onclick="showPage('classes',this)">🏫 Classes / Groupes</button>
      <button class="nav-btn" onclick="showPage('affectations',this)">🔗 Affectations</button>
      <button class="nav-btn" onclick="showPage('matieres',this)">📚 Matières / Cours</button>
      <button class="nav-btn" onclick="showPage('annees',this)">📅 Années académiques</button>
      <button class="nav-btn" onclick="showPage('users',this)">👥 Utilisateurs</button>
      <button class="nav-btn" onclick="showPage('statistiques',this)">📈 Statistiques</button>
    </div>
    <div class="nav-title">Espace pédagogique</div>
    <button class="nav-btn" onclick="showPage('devoirs',this)">📝 Devoirs</button>
    <button class="nav-btn" onclick="showPage('remises',this)">📤 Remises</button>
    <button class="nav-btn" onclick="showPage('resultats',this)">📊 Résultats / Notes</button>
  </aside>

  <main class="main">
    <section id="page-dashboard" class="page"></section>
    <section id="page-etudiants" class="page hidden"></section>
    <section id="page-professeurs" class="page hidden"></section>
    <section id="page-departements" class="page hidden"></section>
    <section id="page-filieres" class="page hidden"></section>
    <section id="page-classes" class="page hidden"></section>
    <section id="page-affectations" class="page hidden"></section>
    <section id="page-matieres" class="page hidden"></section>
    <section id="page-annees" class="page hidden"></section>
    <section id="page-users" class="page hidden"></section>
    <section id="page-statistiques" class="page hidden"></section>
    <section id="page-devoirs" class="page hidden"></section>
    <section id="page-remises" class="page hidden"></section>
    <section id="page-resultats" class="page hidden"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modalTitle">Ajouter</h3><button class="btn-light" onclick="closeModal()">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth,onAuthStateChanged,signInWithEmailAndPassword,
  createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,
  updateDoc,deleteDoc,serverTimestamp,query,where
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAhrtcVaEZ7oU-p4Ihzl0APX2ccXKi4jBU",
  authDomain: "centre-de-formation-le-pe.firebaseapp.com",
  projectId: "centre-de-formation-le-pe",
  storageBucket: "centre-de-formation-le-pe.firebasestorage.app",
  messagingSenderId: "11834103838",
  appId: "1:11834103838:web:b82c994e78486cd313760f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();
const ADMIN_EMAIL = "Centredeformationlepedagogue@gmail.com";

let currentUser = null;
let currentProfile = null;
let deferredPrompt = null;

const modules = {
  etudiants:{title:"Étudiants",icon:"👨‍🎓",fields:[["nom","Nom","text"],["prenom","Prénom","text"],["email","Email","email"],["telephone","Téléphone","tel"],["matricule","Matricule","text"],["classe","Classe","text"],["filiere","Filière","text"]]},
  professeurs:{title:"Professeurs",icon:"👨‍🏫",fields:[["nom","Nom","text"],["prenom","Prénom","text"],["email","Email","email"],["telephone","Téléphone","tel"],["specialite","Spécialité","text"],["departement","Département","text"]]},
  departements:{title:"Départements",icon:"🏛️",fields:[["nom","Nom","text"],["responsable","Responsable","text"],["description","Description","text"]]},
  filieres:{title:"Filières / Programmes",icon:"🎓",fields:[["nom","Nom","text"],["departement","Département","text"],["niveau","Niveau","text"],["duree","Durée","text"]]},
  classes:{title:"Classes / Groupes",icon:"🏫",fields:[["nom","Nom de la classe","text"],["code","Code","text"],["filiere","Filière","text"],["annee","Année académique","text"]]},
  matieres:{title:"Matières / Cours",icon:"📚",fields:[["nom","Nom de la matière","text"],["code","Code","text"],["professeur","Professeur","text"],["classe","Classe","text"]]},
  annees:{title:"Années académiques",collection:"annees_academiques",icon:"📅",fields:[["nom","Année académique","text"],["debut","Date de début","date"],["fin","Date de fin","date"]]}
};

const $ = id => document.getElementById(id);
const safe = value => String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const collectionName = key => modules[key]?.collection || key;
const isAdmin = () => currentProfile?.role === "administrateur" && currentProfile?.status === "accepted";
const isProfessor = () => currentProfile?.role === "professeur" && currentProfile?.status === "accepted";
const isStudent = () => ["eleve","etudiant"].includes(currentProfile?.role) && currentProfile?.status === "accepted";

function toast(message){
  $("toast").textContent = message;
  $("toast").classList.remove("hidden");
  setTimeout(()=>$("toast").classList.add("hidden"),3500);
}
function authMessage(message,type="error"){
  $("authMessage").innerHTML = `<div class="message ${type}">${safe(message)}</div>`;
}
window.showRegister = () => {
  $("authMessage").innerHTML="";
  $("loginBox").classList.add("hidden");
  $("registerBox").classList.remove("hidden");
};
window.showLogin = () => {
  $("authMessage").innerHTML="";
  $("registerBox").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
};

async function createProfile(user,name=""){
  const ref=doc(db,"users",user.uid);
  const existing=await getDoc(ref);
  const admin=(user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase();
  if(existing.exists()){
    if(admin) await updateDoc(ref,{
      email:user.email,nom:name||user.displayName||"",
      role:"administrateur",status:"accepted",updatedAt:serverTimestamp()
    });
    return;
  }
  await setDoc(ref,{
    uid:user.uid,email:user.email||"",nom:name||user.displayName||"",
    role:admin?"administrateur":"eleve",
    status:admin?"accepted":"attente",
    createdAt:serverTimestamp(),updatedAt:serverTimestamp()
  });
}

window.login = async () => {
  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;
  if(!email||!password) return authMessage("Veuillez remplir tous les champs.");
  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    console.error(e);
    authMessage("Connexion impossible. Vérifiez votre email et votre mot de passe.");
  }
};

window.register = async () => {
  const name=$("registerName").value.trim();
  const email=$("registerEmail").value.trim();
  const password=$("registerPassword").value;
  if(!name||!email||!password) return authMessage("Veuillez remplir tous les champs.");
  if(password.length<6) return authMessage("Le mot de passe doit contenir au moins 6 caractères.");
  try{
    const result=await createUserWithEmailAndPassword(auth,email,password);
    await createProfile(result.user,name);
    await signOut(auth);
    showLogin();
    authMessage("Compte créé. Il est en attente d'approbation.","success");
  }catch(e){
    console.error(e);
    authMessage("Création impossible. Vérifiez les paramètres Firebase et les règles Firestore.");
  }
};

window.loginGoogle = async () => {
  try{
    const result=await signInWithPopup(auth,googleProvider);
    await createProfile(result.user);
  }catch(e){
    console.error(e);
    authMessage("Connexion Google impossible. Vérifiez que Google est activé dans Firebase Authentication.");
  }
};

async function getProfile(user){
  const ref=doc(db,"users",user.uid);
  const snap=await getDoc(ref);
  if(!snap.exists()){
    await createProfile(user);
    const created=await getDoc(ref);
    return created.exists()?created.data():null;
  }
  const profile=snap.data();
  if((user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase() &&
     (profile.role!=="administrateur"||profile.status!=="accepted")){
    await updateDoc(ref,{role:"administrateur",status:"accepted",updatedAt:serverTimestamp()});
    profile.role="administrateur";
    profile.status="accepted";
  }
  return profile;
}

onAuthStateChanged(auth,async user=>{
  if(!user){
    currentUser=null;currentProfile=null;
    $("authPage").classList.remove("hidden");
    $("appPage").classList.add("hidden");
    return;
  }
  try{
    currentUser=user;
    currentProfile=await getProfile(user);
    if(!currentProfile){
      await signOut(auth);
      return authMessage("Profil utilisateur introuvable.");
    }
    if(currentProfile.status!=="accepted"){
      await signOut(auth);
      return authMessage("Votre compte est en attente d'approbation par l'administrateur.","info");
    }
    $("authPage").classList.add("hidden");
    $("appPage").classList.remove("hidden");
    $("adminNav").classList.toggle("hidden",!isAdmin());
    await showPage("dashboard");
  }catch(e){
    console.error(e);
    authMessage("Erreur d'accès à Firebase. Vérifiez les règles Firestore.");
  }
});

window.logout = async () => { await signOut(auth); };
window.toggleSidebar = () => $("sidebar").classList.toggle("open");
window.changeLanguage = value => {
  localStorage.setItem("lePedagogueLanguage",value);
  toast(value==="ht"?"Lang Kreyòl chwazi.":"Français sélectionné.");
};
const savedLanguage=localStorage.getItem("lePedagogueLanguage");
if(savedLanguage) $("language").value=savedLanguage;

window.showPage = async (name,button) => {
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  const page=$("page-"+name);
  if(page) page.classList.remove("hidden");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  if(button) button.classList.add("active");
  $("sidebar").classList.remove("open");

  if(name==="dashboard") await dashboard();
  else if(modules[name]&&isAdmin()) await loadModule(name);
  else if(name==="users"&&isAdmin()) await loadUsers();
  else if(name==="devoirs") await loadAssignments();
  else if(name==="remises") await loadSubmissions();
  else if(name==="resultats") await loadResults();
  else if(name==="affectations"&&isAdmin()) await loadAffectations();
  else if(name==="statistiques"&&isAdmin()) await loadStatistics();
};

async function countDocs(name){
  try{return (await getDocs(collection(db,name))).size;}
  catch(e){console.error(e);return 0;}
}

async function dashboard(){
  const role=isAdmin()?"Administrateur":isProfessor()?"Professeur":"Étudiant";
  const email=safe(currentUser?.email);
  $("page-dashboard").innerHTML=`
    <div class="page-title"><div><h2>Tableau de bord</h2><p>Bienvenue dans votre espace académique.</p></div></div>
    <div class="panel"><h3>👤 ${role}</h3><p>${email}</p></div>
    ${isAdmin()?`<div class="stats">
      <div class="stat">👨‍🎓<div class="num" id="nEt">0</div>Étudiants</div>
      <div class="stat">👨‍🏫<div class="num" id="nPr">0</div>Professeurs</div>
      <div class="stat">🏫<div class="num" id="nCl">0</div>Classes</div>
      <div class="stat">📚<div class="num" id="nMa">0</div>Matières</div>
      <div class="stat">📝<div class="num" id="nDe">0</div>Devoirs</div>
      <div class="stat">⏳<div class="num" id="nUs">0</div>Comptes en attente</div>
    </div>`:""}
    <div class="panel"><h3>🏛️ Centre de Formation Le Pédagogue</h3>
    <p>Plateforme de gestion universitaire et de formation professionnelle.</p></div>`;
  if(isAdmin()){
    for(const [id,name] of [["nEt","etudiants"],["nPr","professeurs"],["nCl","classes"],["nMa","matieres"],["nDe","devoirs"]]){
      $(id).textContent=await countDocs(name);
    }
    try{
      const users=await getDocs(collection(db,"users"));
      let pending=0;
      users.forEach(s=>{if(["attente","pending"].includes(s.data().status))pending++;});
      $("nUs").textContent=pending;
    }catch(e){console.error(e);}
  }
}

async function loadModule(key){
  const mod=modules[key],page=$("page-"+key);
  page.innerHTML=`
    <div class="page-title"><div><h2>${mod.icon} ${mod.title}</h2><p>Gestion des ${mod.title.toLowerCase()}.</p></div>
    <button class="btn-primary" onclick="openRecord('${key}')">➕ Ajouter</button></div>
    <div class="panel"><div class="panel-header"><h3>Liste</h3>
    <input class="search" id="search-${key}" placeholder="Rechercher..." oninput="filterRows('${key}')"></div>
    <div id="table-${key}" class="table-wrap">Chargement...</div></div>`;
  await loadTable(key);
}

async function loadTable(key){
  const mod=modules[key],target=$("table-"+key);
  try{
    const snap=await getDocs(collection(db,collectionName(key)));
    if(snap.empty){target.innerHTML='<p>Aucune donnée enregistrée.</p>';return;}
    let html="<table><thead><tr>";
    mod.fields.forEach(f=>html+=`<th>${safe(f[1])}</th>`);
    html+="<th>Actions</th></tr></thead><tbody>";
    snap.forEach(s=>{
      const d=s.data();
      html+=`<tr data-id="${safe(s.id)}">`;
      mod.fields.forEach(f=>html+=`<td>${safe(d[f[0]])}</td>`);
      html+=`<td><div class="actions">
        <button class="btn-light" onclick="editRecord('${key}','${s.id}')">Modifier</button>
        <button class="btn-danger" onclick="deleteRecord('${key}','${s.id}')">Supprimer</button>
      </div></td></tr>`;
    });
    target.innerHTML=html+"</tbody></table>";
  }catch(e){
    console.error(e);
    target.innerHTML="<p>Impossible de charger les données. Vérifiez les règles Firestore.</p>";
  }
}

window.filterRows = key => {
  const term=$("search-"+key)?.value.toLowerCase()||"";
  $("table-"+key)?.querySelectorAll("tbody tr").forEach(row=>{
    row.style.display=row.textContent.toLowerCase().includes(term)?"":"none";
  });
};

window.openRecord = (key,id=null,data={}) => {
  if(!isAdmin()) return toast("Accès réservé à l'administrateur.");
  const mod=modules[key];
  $("modalTitle").textContent=(id?"Modifier ":"Ajouter ")+mod.title;
  let html=`<form id="recordForm" onsubmit="saveRecord(event,'${key}','${id||""}')"><div class="form-grid">`;
  mod.fields.forEach(f=>{
    html+=`<div class="field"><label>${safe(f[1])}</label><input id="field-${f[0]}" type="${f[2]}" value="${safe(data[f[0]])}" ${f[0]==="nom"?"required":""}></div>`;
  });
  html+=`</div><button class="btn-primary" type="submit">Enregistrer</button></form>`;
  $("modalBody").innerHTML=html;
  $("modal").classList.remove("hidden");
};

window.editRecord = async (key,id) => {
  if(!isAdmin()) return;
  try{
    const snap=await getDoc(doc(db,collectionName(key),id));
    if(snap.exists()) openRecord(key,id,snap.data());
  }catch(e){console.error(e);toast("Impossible d'ouvrir cet élément.");}
};

window.saveRecord = async (event,key,id) => {
  event.preventDefault();
  if(!isAdmin()) return;
  const data={};
  modules[key].fields.forEach(f=>data[f[0]]=$("field-"+f[0]).value.trim());
  data.updatedAt=serverTimestamp();
  try{
    if(id) await updateDoc(doc(db,collectionName(key),id),data);
    else {data.createdAt=serverTimestamp();await addDoc(collection(db,collectionName(key)),data);}
    closeModal();toast("Enregistrement réussi.");await loadModule(key);
  }catch(e){console.error(e);toast("Impossible d'enregistrer. Vérifiez les règles Firestore.");}
};

window.deleteRecord = async (key,id) => {
  if(!isAdmin()) return;
  if(!confirm("Confirmer la suppression de cet élément ?")) return;
  try{
    await deleteDoc(doc(db,collectionName(key),id));
    toast("Élément supprimé.");await loadModule(key);
  }catch(e){console.error(e);toast("Suppression impossible. Vérifiez les règles Firestore.");}
};

async function loadUsers(){
  const page=$("page-users");
  page.innerHTML=`<div class="page-title"><div><h2>👥 Utilisateurs</h2><p>Approbation et gestion des rôles.</p></div></div>
  <div class="panel"><div class="table-wrap" id="usersTable">Chargement...</div></div>`;
  try{
    const snap=await getDocs(collection(db,"users"));
    if(snap.empty){$("usersTable").innerHTML="Aucun utilisateur.";return;}
    let html="<table><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Statut</th><th>Actions</th></tr></thead><tbody>";
    snap.forEach(s=>{
      const d=s.data(),status=d.status||"attente",role=d.role||"eleve";
      html+=`<tr><td>${safe(d.nom)}</td><td>${safe(d.email)}</td><td>${safe(role)}</td><td>${status==="accepted"?"Accepté":"En attente"}</td><td><div class="actions">
      ${status!=="accepted"?`<button class="btn-success" onclick="approveUser('${s.id}')">Accepter</button>`:""}
      <button class="btn-light" onclick="changeRole('${s.id}')">Modifier rôle</button>
      ${s.id!==currentUser.uid?`<button class="btn-danger" onclick="removeUser('${s.id}')">Supprimer</button>`:""}
      </div></td></tr>`;
    });
    $("usersTable").innerHTML=html+"</tbody></table>";
  }catch(e){console.error(e);$("usersTable").innerHTML="Impossible de charger les utilisateurs. Vérifiez les règles Firestore.";}
}

window.approveUser = async uid => {
  if(!isAdmin()) return;
  const role=prompt("Choisir un rôle : eleve, professeur ou administrateur","eleve");
  if(!["eleve","etudiant","professeur","administrateur"].includes(role)) return toast("Rôle invalide.");
  try{
    await updateDoc(doc(db,"users",uid),{role,status:"accepted",approvedBy:currentUser.email,approvedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    toast("Compte approuvé.");await loadUsers();
  }catch(e){console.error(e);toast("Impossible d'approuver le compte.");}
};

window.changeRole = async uid => {
  if(!isAdmin()) return;
  const role=prompt("Rôle : eleve, professeur ou administrateur");
  if(!["eleve","etudiant","professeur","administrateur"].includes(role)) return toast("Rôle invalide.");
  try{
    await updateDoc(doc(db,"users",uid),{role,status:"accepted",updatedAt:serverTimestamp()});
    toast("Rôle modifié.");await loadUsers();
  }catch(e){console.error(e);toast("Impossible de modifier le rôle.");}
};

window.removeUser = async uid => {
  if(!isAdmin()||uid===currentUser.uid) return;
  if(!confirm("Supprimer le profil Firestore de cet utilisateur ?")) return;
  try{
    await deleteDoc(doc(db,"users",uid));
    toast("Profil supprimé.");await loadUsers();
  }catch(e){console.error(e);toast("Impossible de supprimer le profil.");}
};

async function loadAssignments(){
  const page=$("page-devoirs");
  page.innerHTML=`<div class="page-title"><div><h2>📝 Devoirs</h2><p>Gestion et suivi des travaux.</p></div>
  ${isAdmin()||isProfessor()?'<button class="btn-primary" onclick="newAssignment()">➕ Nouveau devoir</button>':""}</div>
  <div id="assignmentList" class="assignment-grid">Chargement...</div>`;
  try{
    let snap;
    if(isAdmin()) snap=await getDocs(collection(db,"devoirs"));
    else if(isProfessor()) snap=await getDocs(query(collection(db,"devoirs"),where("professeurId","==",currentUser.uid)));
    else snap=await getDocs(collection(db,"devoirs"));
    if(snap.empty){$("assignmentList").innerHTML="<div class='panel'>Aucun devoir enregistré.</div>";return;}
    let html="";
    snap.forEach(s=>{
      const d=s.data();
      html+=`<div class="assignment-card"><h3>${safe(d.titre)}</h3>
      <p>${safe(d.matiere)} · ${safe(d.classe)}</p><p>${safe(d.description)}</p>
      <p>Date limite : ${safe(d.dateLimite||"Non définie")}</p>
      <div class="actions">
      ${(isAdmin()||isProfessor())?`<button class="btn-danger" onclick="deleteAssignment('${s.id}')">🗑️ Supprimer</button>`:""}
      </div></div>`;
    });
    $("assignmentList").innerHTML=html;
  }catch(e){console.error(e);$("assignmentList").innerHTML="<div class='panel'>Impossible de charger les devoirs. Vérifiez les règles Firestore.</div>";}
}

window.newAssignment = () => {
  if(!(isAdmin()||isProfessor())) return;
  $("modalTitle").textContent="Nouveau devoir";
  $("modalBody").innerHTML=`<form onsubmit="saveAssignment(event)">
    <div class="field"><label>Titre du devoir</label><input id="aTitre" required></div>
    <div class="field"><label>Matière / Cours</label><input id="aMatiere" required></div>
    <div class="field"><label>Classe / Groupe</label><input id="aClasse" required></div>
    <div class="field"><label>Date limite</label><input id="aDate" type="date"></div>
    <div class="field"><label>Description</label><textarea id="aDescription" rows="4" required></textarea></div>
    <button class="btn-primary" type="submit">Publier le devoir</button>
  </form>`;
  $("modal").classList.remove("hidden");
};

window.saveAssignment = async event => {
  event.preventDefault();
  if(!(isAdmin()||isProfessor())) return;
  const data={
    titre:$("aTitre").value.trim(),
    matiere:$("aMatiere").value.trim(),
    classe:$("aClasse").value.trim(),
    dateLimite:$("aDate").value,
    description:$("aDescription").value.trim(),
    professeurId:currentUser.uid,
    professeurEmail:currentUser.email||"",
    createdAt:serverTimestamp(),updatedAt:serverTimestamp()
  };
  try{
    await addDoc(collection(db,"devoirs"),data);
    closeModal();toast("Devoir publié.");await loadAssignments();
  }catch(e){console.error(e);toast("Impossible de publier le devoir. Vérifiez les règles Firestore.");}
};

window.deleteAssignment = async id => {
  if(!(isAdmin()||isProfessor())) return toast("Accès refusé.");
  if(!confirm("Voulez-vous vraiment supprimer ce devoir ?")) return;
  try{
    const ref=doc(db,"devoirs",id);
    const snap=await getDoc(ref);
    if(!snap.exists()) return toast("Ce devoir n'existe plus.");
    if(isProfessor()&&snap.data().professeurId!==currentUser.uid)
      return toast("Vous ne pouvez supprimer que vos propres devoirs.");
    await deleteDoc(ref);
    toast("Devoir supprimé avec succès.");
    await loadAssignments();
    if(isAdmin()) await dashboard();
  }catch(e){
    console.error(e);
    toast("Suppression impossible. Vérifiez les règles Firestore.");
  }
};

async function loadSubmissions(){
  $("page-remises").innerHTML=`<div class="page-title"><div><h2>📤 Remises / Corrections</h2></div></div>
  <div class="panel"><p>Les remises des devoirs peuvent être consultées ici lorsque la collection remises contient des données.</p></div>`;
}
async function loadResults(){
  $("page-resultats").innerHTML=`<div class="page-title"><div><h2>📊 Résultats / Notes</h2></div></div>
  <div class="panel"><div id="resultsTable">Chargement...</div></div>`;
  try{
    const snap=await getDocs(collection(db,"resultats"));
    if(snap.empty){$("resultsTable").textContent="Aucun résultat enregistré.";return;}
    let html="<table><thead><tr><th>Étudiant</th><th>Devoir</th><th>Note /20</th><th>Note /100</th></tr></thead><tbody>";
    snap.forEach(s=>{const d=s.data();html+=`<tr><td>${safe(d.etudiantNom||d.etudiantEmail)}</td><td>${safe(d.devoirTitre)}</td><td>${safe(d.note20)}</td><td>${safe(d.note100)}</td></tr>`;});
    $("resultsTable").innerHTML=html+"</tbody></table>";
  }catch(e){console.error(e);$("resultsTable").textContent="Impossible de charger les résultats.";}
}

async function loadAffectations(){
  $("page-affectations").innerHTML=`<div class="page-title"><div><h2>🔗 Affectations</h2><p>Les affectations nécessitent une configuration spécifique des classes et professeurs.</p></div></div>
  <div class="panel">Utilisez les sections Classes, Professeurs et Matières pour gérer les données académiques.</div>`;
}

async function loadStatistics(){
  $("page-statistiques").innerHTML=`<div class="page-title"><div><h2>📈 Statistiques</h2></div></div><div class="stats">
  <div class="stat">Étudiants<div class="num">${await countDocs("etudiants")}</div></div>
  <div class="stat">Professeurs<div class="num">${await countDocs("professeurs")}</div></div>
  <div class="stat">Classes<div class="num">${await countDocs("classes")}</div></div>
  <div class="stat">Devoirs<div class="num">${await countDocs("devoirs")}</div></div>
  </div>`;
}

window.closeModal = () => $("modal").classList.add("hidden");

window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();deferredPrompt=event;
  $("installBtn").textContent="📲 Installer l'application";
});
window.installApp = async () => {
  if(deferredPrompt){
    await deferredPrompt.prompt();
    deferredPrompt=null;
  }else{
    toast("Dans Chrome, ouvrez le menu ⋮ puis choisissez Installer l'application ou Ajouter à l'écran d'accueil.");
  }
};
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.error));
}
</script>
</body>
</html>
