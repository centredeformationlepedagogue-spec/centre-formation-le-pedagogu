<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Centre de Formation Le Pédagogue">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<title>Centre de Formation Le Pédagogue</title>
<style>
:root{--blue:#1d4ed8;--dark:#0f172a;--bg:#f1f5f9;--border:#e2e8f0;--muted:#64748b;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:var(--bg);color:#1e293b}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;background:white}label{display:block;font-weight:bold;margin:12px 0 6px}.hidden{display:none!important}.btn{background:var(--blue);color:white;font-weight:bold}.green{background:var(--green);color:white}.red{background:var(--red);color:white}.light{background:#e2e8f0;color:#1e293b}.install{background:#15803d;color:white}.auth{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(130deg,#0f172a,#1d4ed8)}.authbox{width:100%;max-width:440px;background:white;padding:25px;border-radius:18px;box-shadow:0 15px 40px #0003}.authbox h1{text-align:center;font-size:23px}.authbox p{text-align:center;color:var(--muted)}.authbox button{width:100%;margin-top:12px}.msg{padding:12px;border-radius:8px;margin:12px 0;background:#dbeafe}.msg.error{background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}
header{height:65px;background:white;border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px}.brand{font-weight:bold;display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;object-fit:contain}.topright{display:flex;align-items:center;gap:8px}.topright select{width:auto}.hamb{display:none;background:var(--blue);color:white}
aside{position:fixed;top:65px;bottom:0;left:0;width:245px;background:var(--dark);color:white;overflow:auto;padding:12px;z-index:9}.navtitle{color:#94a3b8;font-size:11px;text-transform:uppercase;padding:15px 8px 6px}.nav{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;margin:3px 0}.nav:hover,.nav.active{background:var(--blue);color:white}.main{margin-left:245px;padding:88px 22px 30px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.heading h2{margin:0}.panel,.stat,.item{background:white;border:1px solid var(--border);border-radius:12px;padding:17px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.stat strong{display:block;font-size:26px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px;background:white}th,td{text-align:left;border-bottom:1px solid var(--border);padding:10px}th{background:#f8fafc}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:7px;font-size:12px}.badge{display:inline-block;border-radius:20px;padding:5px 8px;background:#fef3c7;color:#92400e}.badge.ok{background:#dcfce7;color:#166534}.badge.no{background:#fee2e2;color:#991b1b}.empty{padding:25px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:15px}.modalbox{background:white;border-radius:14px;padding:20px;width:100%;max-width:650px;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:15px;right:15px;background:#0f172a;color:white;padding:14px;border-radius:10px;z-index:30;max-width:90vw}
@media(max-width:850px){aside{transform:translateX(-105%);transition:.2s}aside.open{transform:translateX(0)}.main{margin-left:0;padding:82px 12px 25px}.hamb{display:inline-block}.brand span{display:none}header{padding:0 8px}.topright{gap:4px}.topright select{max-width:100px}.install{font-size:12px;padding:8px}}
</style>
</head>
<body>

<section id="auth" class="auth">
<div class="authbox">
<h1>🏛️ Centre de Formation Le Pédagogue</h1>
<p>Gestion universitaire et école professionnelle</p>
<button id="authInstall" class="install" onclick="installApp()">📲 Installer l'application</button>
<div id="authMsg"></div>
<div id="loginForm">
<label>Adresse email</label><input id="email" type="email" autocomplete="username" placeholder="Votre email">
<label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe">
<button class="btn" onclick="login()">Se connecter</button>
<button class="light" onclick="googleLogin()">Continuer avec Google</button>
<p>Pas de compte ? <a href="#" onclick="registerView();return false">Créer un compte</a></p>
</div>
<div id="registerForm" class="hidden">
<label>Nom complet</label><input id="regName" placeholder="Nom et prénom">
<label>Email</label><input id="regEmail" type="email" autocomplete="username">
<label>Mot de passe (6 caractères minimum)</label><input id="regPass" type="password" autocomplete="new-password">
<button class="btn" onclick="register()">Créer mon compte</button>
<p>Votre compte restera en attente jusqu'à son approbation par l'administrateur.</p>
<p><a href="#" onclick="loginView();return false">Retour à la connexion</a></p>
</div>
</div>
</section>

<div id="application" class="hidden">
<header>
<div class="brand"><button class="hamb" onclick="document.querySelector('aside').classList.toggle('open')">☰</button><img src="./icon-192.png" alt=""><span>Centre de Formation Le Pédagogue</span></div>
<div class="topright"><button id="appInstall" class="install" onclick="installApp()">📲 Installer</button><select id="lang" onchange="setLang(this.value)"><option value="fr">🇫🇷 Français</option><option value="ht">🇭🇹 Kreyòl</option></select><button class="light" onclick="logout()">Déconnexion</button></div>
</header>
<aside id="sidebar">
<div class="navtitle">Principal</div>
<button class="nav active" data-page="home">🏠 Accueil</button>
<div id="adminMenu">
<div class="navtitle">Administration</div>
<button class="nav" data-page="users">👥 Utilisateurs</button>
<button class="nav" data-page="etudiants">🎓 Étudiants</button>
<button class="nav" data-page="professeurs">👨‍🏫 Professeurs</button>
<button class="nav" data-page="classes">🏫 Classes</button>
<button class="nav" data-page="matieres">📚 Matières / Cours</button>
<button class="nav" data-page="departements">🏛️ Départements</button>
<button class="nav" data-page="programmes">📖 Programmes</button>
<button class="nav" data-page="affectations">🔗 Affectations</button>
<button class="nav" data-page="statistiques">📈 Statistiques</button>
</div>
<div class="navtitle">Pédagogie</div>
<button class="nav" data-page="devoirs">📝 Devoirs</button>
<button class="nav" data-page="remises">📤 Remises / Corrections</button>
<button class="nav" data-page="resultats">📊 Résultats / Notes</button>
<button class="nav" data-page="mescours">📚 Mes cours</button>
</aside>
<main id="main" class="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div class="heading"><h3 id="modalTitle">Formulaire</h3><button class="light" onclick="closeModal()">✕</button></div><div id="modalContent"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

/* Kenbe konfigirasyon Firebase ou te bay la. Verifye li nan Firebase Console si koneksyon an pa mache. */
const firebaseConfig={
apiKey:"AIzaSyAhrtcVaEZ7oU-p4Ihzl0APX2ccXKi4jBU",
authDomain:"centre-de-formation-le-pe.firebaseapp.com",
projectId:"centre-de-formation-le-pe",
storageBucket:"centre-de-formation-le-pe.firebasestorage.app",
messagingSenderId:"11834103838",
appId:"1:11834103838:web:b82c994e78486cd313760f"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const ADMIN_EMAIL="Centredeformationlepedagogue@gmail.com";
let user=null,profile=null,installPrompt=null,currentPage="home";

const $=id=>document.getElementById(id);
const coll=name=>collection(db,name);
const userRef=uid=>doc(db,"users",uid);
const admin=()=>user?.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()||(profile?.role==="administrateur"&&profile?.status==="accepted");
const prof=()=>profile?.role==="professeur"&&profile?.status==="accepted";
const student=()=>["eleve","etudiant"].includes(profile?.role)&&profile?.status==="accepted";
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stamp=()=>serverTimestamp();

function notify(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3000)}
function authMessage(msg,type="error"){$("authMsg").innerHTML=`<div class="msg ${type}">${safe(msg)}</div>`}
function errorText(e){console.error("Firebase:",e);const c=e?.code||"";if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return"Email ou mot de passe incorrect.";if(c.includes("email-already-in-use"))return"Cette adresse email est déjà utilisée.";if(c.includes("weak-password"))return"Le mot de passe doit contenir au moins 6 caractères.";if(c.includes("network-request-failed"))return"Vérifiez votre connexion Internet.";if(c.includes("unauthorized-domain"))return"Ce domaine doit être autorisé dans Firebase Authentication.";if(c.includes("permission-denied"))return"Votre compte n'a pas les autorisations nécessaires.";return"Connexion impossible. Vérifiez vos informations ou contactez l'administrateur."}
window.loginView=()=>{$("loginForm").classList.remove("hidden");$("registerForm").classList.add("hidden");$("authMsg").innerHTML=""};
window.registerView=()=>{$("loginForm").classList.add("hidden");$("registerForm").classList.remove("hidden");$("authMsg").innerHTML=""};

window.login=async()=>{try{if(!$("email").value.trim()||!$("password").value)return authMessage("Entrez votre email et votre mot de passe.");await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){authMessage(errorText(e))}};
window.googleLogin=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){authMessage(errorText(e))}};
window.register=async()=>{const nom=$("regName").value.trim(),email=$("regEmail").value.trim(),password=$("regPass").value;if(!nom||!email||!password)return authMessage("Remplissez tous les champs.");if(password.length<6)return authMessage("Le mot de passe doit contenir au moins 6 caractères.");try{const c=await createUserWithEmailAndPassword(auth,email,password);await setDoc(userRef(c.user.uid),{uid:c.user.uid,nom,email,role:"eleve",status:"attente",createdAt:stamp()});await signOut(auth);loginView();authMessage("Compte créé. Attendez l'approbation de l'administrateur.","ok")}catch(e){authMessage(errorText(e))}};
window.logout=async()=>{try{await signOut(auth)}catch(e){console.error(e)}};

onAuthStateChanged(auth,async u=>{
if(!u){user=null;profile=null;$("application").classList.add("hidden");$("auth").classList.remove("hidden");return}
user=u;
try{
const r=userRef(u.uid),s=await getDoc(r);
if(!s.exists()){profile={uid:u.uid,nom:u.displayName||"",email:u.email||"",role:"eleve",status:"attente"};await setDoc(r,{...profile,createdAt:stamp()})}else profile=s.data();
if(u.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()){profile={...profile,role:"administrateur",status:"accepted"};await setDoc(r,{role:"administrateur",status:"accepted",email:u.email},{merge:true})}
if(profile.status!=="accepted"){await signOut(auth);$("auth").classList.remove("hidden");$("application").classList.add("hidden");authMessage("Votre compte est en attente d'approbation.");return}
$("auth").classList.add("hidden");$("application").classList.remove("hidden");$("adminMenu").classList.toggle("hidden",!admin());renderHome();
}catch(e){console.error("Profil utilisateur:",e);await signOut(auth);authMessage("Impossible de vérifier votre compte. Contactez l'administrateur.")}
});

const modules={
etudiants:{title:"Étudiants",collection:"etudiants",fields:[["nom","Nom complet"],["email","Email"],["telephone","Téléphone"],["classe","Classe"]]},
professeurs:{title:"Professeurs",collection:"professeurs",fields:[["nom","Nom complet"],["email","Email"],["specialite","Spécialité"]]},
classes:{title:"Classes",collection:"classes",fields:[["nom","Nom de la classe"],["programme","Programme"],["annee","Année académique"]]},
matieres:{title:"Matières / Cours",collection:"matieres",fields:[["nom","Nom de la matière"],["code","Code"],["classe","Classe"]]},
departements:{title:"Départements",collection:"departements",fields:[["nom","Nom"],["description","Description"]]},
programmes:{title:"Programmes",collection:"programmes",fields:[["nom","Nom du programme"],["departement","Département"],["description","Description"]]}
};

document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("sidebar").classList.remove("open");openPage(b.dataset.page)}));
async function openPage(page){currentPage=page;if(!admin()&&["users","etudiants","professeurs","classes","matieres","departements","programmes","affectations","statistiques"].includes(page)){notify("Accès réservé à l'administrateur.");return renderHome()}if(page==="home")return renderHome();if(modules[page])return renderModule(page);if(page==="users")return renderUsers();if(page==="affectations")return renderAssignmentsToTeachers();if(page==="devoirs")return renderAssignments();if(page==="remises")return renderSubmissions();if(page==="resultats")return renderResults();if(page==="statistiques")return renderStats();if(page==="mescours")return renderMyCourses()}

async function count(name){try{return(await getDocs(coll(name))).size}catch(e){console.error(e);return 0}}
async function renderHome(){currentPage="home";const isA=admin();$("main").innerHTML=`<div class="heading"><div><h2>Tableau de bord</h2><p class="small">Centre de Formation Le Pédagogue</p></div></div><div class="panel">Bienvenue, <strong>${safe(profile?.nom||user?.email)}</strong><br>Rôle : ${safe(profile?.role)}.</div>${isA?'<div id="stats" class="stats"></div>':prof()?'<div class="panel">Consultez vos classes affectées, publiez des devoirs et corrigez les remises.</div>':'<div class="panel">Consultez les devoirs de votre classe et vos résultats.</div>'}`;
if(isA){const names=[["etudiants","Étudiants"],["professeurs","Professeurs"],["classes","Classes"],["matieres","Matières"],["devoirs","Devoirs"],["users","Utilisateurs"]];for(const[n,t]of names){const el=document.createElement("div");el.className="stat";el.innerHTML=`${t}<strong>${await count(n)}</strong>`;$("stats").append(el)}}
}

async function renderModule(key){const m=modules[key];$("main").innerHTML=`<div class="heading"><h2>${m.title}</h2><button class="btn" onclick="editRecord('${key}')">+ Ajouter</button></div><div class="panel"><input id="filter" placeholder="Rechercher..." oninput="filterRows()"><div id="table" class="tablewrap"><div class="empty">Chargement...</div></div></div>`;try{const s=await getDocs(coll(m.collection));let rows=[];s.forEach(d=>rows.push({id:d.id,...d.data()}));window.moduleRows=rows;let h=`<table><thead><tr>${m.fields.map(f=>`<th>${safe(f[1])}</th>`).join("")}<th>Actions</th></tr></thead><tbody>`;for(const d of rows)h+=`<tr>${m.fields.map(f=>`<td>${safe(d[f[0]])}</td>`).join("")}<td class="actions"><button class="light" onclick="editRecord('${key}','${d.id}')">Modifier</button><button class="red" onclick="deleteRecord('${key}','${d.id}')">Supprimer</button></td></tr>`;if(!rows.length)h+='<tr><td colspan="10">Aucune donnée.</td></tr>';$("table").innerHTML=h+"</tbody></table>"}catch(e){console.error(e);$("table").innerHTML='<div class="empty">Impossible de charger les données. Vérifiez les autorisations Firebase.</div>'}}
window.filterRows=()=>{const v=$("filter").value.toLowerCase();document.querySelectorAll("#table tbody tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?"":"none")};
window.editRecord=(key,id="")=>{if(!admin())return;const m=modules[key],old=(window.moduleRows||[]).find(x=>x.id===id)||{};$("modalTitle").textContent=(id?"Modifier ":"Ajouter ")+m.title;$("modalContent").innerHTML=`<form id="recordForm"><div class="formgrid">${m.fields.map(f=>`<div><label>${safe(f[1])}</label><input name="${f[0]}" value="${safe(old[f[0]]||"")}" required></div>`).join("")}</div><button class="btn" style="margin-top:15px">Enregistrer</button></form>`;$("modal").classList.remove("hidden");$("recordForm").onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.updatedAt=stamp();try{if(id)await updateDoc(doc(db,m.collection,id),data);else{data.createdAt=stamp();await addDoc(coll(m.collection),data)}closeModal();notify("Données enregistrées.");renderModule(key)}catch(x){console.error(x);notify("Impossible d'enregistrer. Vérifiez les autorisations Firebase.")}}};
window.deleteRecord=async(key,id)=>{if(!admin()||!confirm("Supprimer cet élément ?"))return;try{await deleteDoc(doc(db,modules[key].collection,id));renderModule(key);notify("Élément supprimé.")}catch(e){console.error(e);notify("Suppression impossible.")}};
window.closeModal=()=> $("modal").classList.add("hidden");

async function renderUsers(){$("main").innerHTML='<div class="heading"><h2>Utilisateurs</h2></div><div class="panel"><div id="usersTable" class="tablewrap">Chargement...</div></div>';try{const s=await getDocs(coll("users"));let h="<table><thead><tr><th>Email</th><th>Nom</th><th>Rôle</th><th>Statut</th><th>Actions</th></tr></thead><tbody>";s.forEach(x=>{const d=x.data(),id=x.id;h+=`<tr><td>${safe(d.email)}</td><td>${safe(d.nom)}</td><td>${safe(d.role)}</td><td>${safe(d.status)}</td><td class="actions">${d.status!=="accepted"?`<button class="green" onclick="approveUser('${id}')">Approuver</button>`:""}<button class="light" onclick="changeRole('${id}')">Rôle</button><button class="red" onclick="removeUser('${id}')">Supprimer</button></td></tr>`});$("usersTable").innerHTML=h+"</tbody></table>"}catch(e){console.error(e);$("usersTable").textContent="Impossible de charger les utilisateurs."}}
window.approveUser=async id=>{if(!admin())return;const role=prompt("Rôle : eleve, professeur ou administrateur","eleve");if(!["eleve","etudiant","professeur","administrateur"].includes(role))return notify("Rôle non valide.");try{await updateDoc(userRef(id),{role,status:"accepted",approvedBy:user.uid,approvedAt:stamp()});renderUsers()}catch(e){console.error(e);notify("Approbation impossible.")}};
window.changeRole=async id=>{if(!admin())return;const role=prompt("Nouveau rôle : eleve, professeur, administrateur");if(!["eleve","etudiant","professeur","administrateur"].includes(role))return notify("Rôle non valide.");try{await updateDoc(userRef(id),{role,status:"accepted",updatedAt:stamp()});renderUsers()}catch(e){console.error(e);notify("Modification impossible.")}};
window.removeUser=async id=>{if(!admin()||!confirm("Supprimer le profil de cet utilisateur ?"))return;try{await deleteDoc(userRef(id));renderUsers()}catch(e){console.error(e);notify("Suppression impossible.")}};

async function renderAssignmentsToTeachers(){const [ps,cs,ms,as]=await Promise.all([getDocs(coll("professeurs")),getDocs(coll("classes")),getDocs(coll("matieres")),getDocs(coll("affectations"))]);let opts=(s)=>s.docs.map(d=>`<option value="${d.id}">${safe(d.data().nom||d.data().email||d.id)}</option>`).join("");$("main").innerHTML=`<div class="heading"><h2>Affectations</h2></div><div class="panel"><form id="affForm"><label>Professeur</label><select id="aprof" required>${opts(ps)}</select><label>Classe</label><select id="aclasse" required>${opts(cs)}</select><label>Matière</label><select id="amatiere" required>${opts(ms)}</select><button class="btn" style="margin-top:15px">Enregistrer l'affectation</button></form></div><div class="panel"><h3>Affectations existantes</h3><div id="afflist"></div></div>`;$("affForm").onsubmit=async e=>{e.preventDefault();try{const pid=$("aprof").value,cid=$("aclasse").value,mid=$("amatiere").value;await addDoc(coll("affectations"),{professeurId:pid,classeId:cid,matiereId:mid,createdBy:user.uid,createdAt:stamp()});notify("Affectation enregistrée.");renderAssignmentsToTeachers()}catch(x){console.error(x);notify("Impossible d'enregistrer l'affectation.")}};let h="<table><thead><tr><th>Professeur</th><th>Classe</th><th>Matière</th><th></th></tr></thead><tbody>";for(const d of as.docs){const a=d.data(),p=ps.docs.find(x=>x.id===a.professeurId),c=cs.docs.find(x=>x.id===a.classeId),m=ms.docs.find(x=>x.id===a.matiereId);h+=`<tr><td>${safe(p?.data().nom||p?.data().email)}</td><td>${safe(c?.data().nom)}</td><td>${safe(m?.data().nom)}</td><td><button class="red" onclick="deleteAffectation('${d.id}')">Supprimer</button></td></tr>`}$("afflist").innerHTML=h+"</tbody></table>"}
window.deleteAffectation=async id=>{if(!admin()||!confirm("Supprimer cette affectation ?"))return;try{await deleteDoc(doc(db,"affectations",id));renderAssignmentsToTeachers()}catch(e){console.error(e);notify("Suppression impossible.")}};

async function getMyAffectations(){const s=await getDocs(query(coll("affectations"),where("professeurId","==",user.uid)));return s.docs.map(d=>({id:d.id,...d.data()}))}
async function renderMyCourses(){if(!prof())return notify("Cette section est réservée aux professeurs.");const a=await getMyAffectations();$("main").innerHTML=`<div class="heading"><h2>Mes cours</h2></div><div class="grid">${a.map(x=>`<div class="item">Classe : ${safe(x.classeId)}<br>Matière : ${safe(x.matiereId)}</div>`).join("")||'<div class="empty">Aucune affectation.</div>'}</div>`}

async function renderAssignments(){let allowed=[];if(prof())allowed=await getMyAffectations();const cs=await getDocs(coll("classes"));const classList=cs.docs.filter(c=>!prof()||allowed.some(a=>a.classeId===c.id));$("main").innerHTML=`<div class="heading"><h2>Devoirs</h2>${admin()||prof()?'<button class="btn" onclick="newAssignment()">+ Nouveau devoir</button>':""}</div><div id="assignments" class="grid">Chargement...</div>`;
try{const s=await getDocs(coll("devoirs"));let h="";for(const d of s.docs){const a=d.data();if(prof()&&a.professeurId!==user.uid)continue;if(student()&&!await studentCanSee(a))continue;h+=`<div class="item"><h3>${safe(a.titre)}</h3><p>${safe(a.matiere)} · ${safe(a.classeNom||a.classe)}</p><p>${safe(a.description)}</p><p class="small">Date limite : ${safe(a.dateLimite||"Non définie")}</p>${student()?`<button class="btn" onclick="submitWork('${d.id}')">Remettre le devoir</button>`:""}</div>`} $("assignments").innerHTML=h||'<div class="empty">Aucun devoir disponible.</div>'}catch(e){console.error(e);$("assignments").textContent="Impossible de charger les devoirs."}}
async function studentCanSee(a){const s=await getDocs(query(coll("inscriptions"),where("etudiantId","==",user.uid)));return s.docs.some(d=>d.data().classeId===a.classeId)||a.classeId===profile?.classeId}
window.newAssignment=async()=>{if(!admin()&&!prof())return;const cs=await getDocs(coll("classes")),ms=await getDocs(coll("matieres"));let classes=cs.docs,matieres=ms.docs;if(prof()){const af=await getMyAffectations();classes=classes.filter(c=>af.some(a=>a.classeId===c.id));matieres=matieres.filter(m=>af.some(a=>a.matiereId===m.id))}if(!classes.length)return notify("Aucune classe ne vous est affectée.");$("modalTitle").textContent="Créer un devoir";$("modalContent").innerHTML=`<form id="devoirForm"><label>Titre</label><input id="dtitre" required><label>Classe</label><select id="dclasse" required>${classes.map(c=>`<option value="${c.id}">${safe(c.data().nom)}</option>`).join("")}</select><label>Matière</label><select id="dmatiere" required>${matieres.map(m=>`<option value="${m.id}">${safe(m.data().nom)}</option>`).join("")}</select><label>Description / consigne</label><textarea id="ddesc" required></textarea><label>Date limite</label><input id="ddate" type="date"><button class="btn" style="margin-top:15px">Publier le devoir</button></form>`;$("modal").classList.remove("hidden");$("devoirForm").onsubmit=async e=>{e.preventDefault();const cid=$("dclasse").value,mid=$("dmatiere").value,c=classes.find(x=>x.id===cid),m=matieres.find(x=>x.id===mid);try{await addDoc(coll("devoirs"),{titre:$("dtitre").value.trim(),classeId:cid,classeNom:c.data().nom,classe:c.data().nom,matiereId:mid,matiere:m?.data().nom||"",description:$("ddesc").value.trim(),dateLimite:$("ddate").value,professeurId:user.uid,professeurNom:profile.nom||user.email,createdAt:stamp()});closeModal();notify("Devoir publié.");renderAssignments()}catch(x){console.error(x);notify("Publication impossible.")}}};

window.submitWork=async id=>{const d=await getDoc(doc(db,"devoirs",id));if(!d.exists())return;const a=d.data();$("modalTitle").textContent="Remettre le devoir";$("modalContent").innerHTML=`<p>${safe(a.titre)}</p><form id="submitForm"><label>Votre réponse / travail</label><textarea id="workText" rows="8" required></textarea><button class="btn" style="margin-top:12px">Envoyer</button></form>`;$("modal").classList.remove("hidden");$("submitForm").onsubmit=async e=>{e.preventDefault();try{const prior=await getDocs(query(coll("remises"),where("devoirId","==",id),where("etudiantId","==",user.uid)));const data={devoirId:id,devoirTitre:a.titre,classeId:a.classeId,etudiantId:user.uid,etudiantNom:profile.nom||user.email,etudiantEmail:user.email,professeurId:a.professeurId,contenu:$("workText").value.trim(),corrige:false,statut:"remis",updatedAt:stamp()};if(prior.empty){data.createdAt=stamp();await addDoc(coll("remises"),data)}else await updateDoc(doc(db,"remises",prior.docs[0].id),data);closeModal();notify("Travay ou remèt.");renderAssignments()}catch(x){console.error(x);notify("Envoi impossible.")}}};

async function renderSubmissions(){if(!admin()&&!prof())return notify("Accès réservé aux enseignants.");$("main").innerHTML='<div class="heading"><h2>Remises / Corrections</h2></div><div id="submissions" class="panel">Chargement...</div>';try{const s=await getDocs(coll("remises"));let h="<table><thead><tr><th>Devoir</th><th>Étudiant</th><th>Statut</th><th>Note /20</th><th>Action</th></tr></thead><tbody>";for(const x of s.docs){const d=x.data();if(prof()&&d.professeurId!==user.uid)continue;h+=`<tr><td>${safe(d.devoirTitre)}</td><td>${safe(d.etudiantNom)}</td><td>${safe(d.statut)}</td><td>${safe(d.note20??"—")}</td><td class="actions"><button class="light" onclick="viewWork('${x.id}')">Voir</button>${prof()?`<button class="btn" onclick="correctWork('${x.id}')">Corriger</button>`:""}</td></tr>`}$("submissions").innerHTML=h+"</tbody></table>"}catch(e){console.error(e);$("submissions").textContent="Impossible de charger les remises."}}
window.viewWork=async id=>{const s=await getDoc(doc(db,"remises",id));if(!s.exists())return;const d=s.data();if(!admin()&&d.professeurId!==user.uid)return notify("Accès refusé.");$("modalTitle").textContent=d.devoirTitre;$("modalContent").innerHTML=`<p><strong>${safe(d.etudiantNom)}</strong></p><div class="panel" style="white-space:pre-wrap">${safe(d.contenu)}</div><p>Note : ${safe(d.note20??"—")}/20 — ${safe(d.note100??"—")}/100</p><p>${safe(d.commentaire||"")}</p>`;$("modal").classList.remove("hidden")};
window.correctWork=async id=>{if(!prof())return;const s=await getDoc(doc(db,"remises",id));if(!s.exists())return;const d=s.data();if(d.professeurId!==user.uid)return notify("Vous ne pouvez corriger que les remises qui vous sont destinées.");$("modalTitle").textContent="Corriger le travail";$("modalContent").innerHTML=`<p><strong>${safe(d.etudiantNom)}</strong></p><div class="panel" style="white-space:pre-wrap">${safe(d.contenu)}</div><form id="correctForm"><label>Note sur 20</label><input id="score20" type="number" min="0" max="20" step="0.25" value="${safe(d.note20??"")}" required><label>Note sur 100</label><input id="score100" readonly value="${d.note100??""}"><label>Commentaire / correction</label><textarea id="comment" rows="5">${safe(d.commentaire||"")}</textarea><button class="btn green" style="margin-top:12px">Enregistrer la correction</button></form>`;$("modal").classList.remove("hidden");$("score20").oninput=()=> $("score100").value=Number($("score20").value)*5;$("correctForm").onsubmit=async e=>{e.preventDefault();const n=Number($("score20").value),n100=Number((n*5).toFixed(2)),commentaire=$("comment").value.trim();if(n<0||n>20)return notify("La note doit être comprise entre 0 et 20.");try{await updateDoc(doc(db,"remises",id),{note20:n,note100:n100,commentaire,corrige:true,statut:"corrige",dateCorrection:stamp()});await addDoc(coll("resultats"),{remiseId:id,devoirId:d.devoirId,devoirTitre:d.devoirTitre,etudiantId:d.etudiantId,etudiantNom:d.etudiantNom,professeurId:user.uid,note20:n,note100:n100,commentaire,dateCorrection:stamp()});closeModal();notify("Correction enregistrée.");renderSubmissions()}catch(x){console.error(x);notify("Impossible d'enregistrer la correction.")}}};

async function renderResults(){if(!admin()&&!prof()&&!student())return; $("main").innerHTML='<div class="heading"><h2>Résultats / Notes</h2></div><div id="results" class="panel">Chargement...</div>';try{const s=await getDocs(coll("resultats"));let h="<table><thead><tr><th>Devoir</th><th>Étudiant</th><th>/20</th><th>/100</th><th>Commentaire</th></tr></thead><tbody>";for(const x of s.docs){const d=x.data();if(student()&&d.etudiantId!==user.uid)continue;if(prof()&&d.professeurId!==user.uid)continue;h+=`<tr><td>${safe(d.devoirTitre)}</td><td>${safe(d.etudiantNom)}</td><td>${safe(d.note20)}</td><td>${safe(d.note100)}</td><td>${safe(d.commentaire)}</td></tr>`}$("results").innerHTML=h+"</tbody></table>"}catch(e){console.error(e);$("results").textContent="Impossible de charger les résultats."}}
async function renderStats(){$("main").innerHTML='<div class="heading"><h2>Statistiques</h2></div><div id="statistics" class="stats"></div>';for(const[n,t]of [["etudiants","Étudiants"],["professeurs","Professeurs"],["classes","Classes"],["devoirs","Devoirs"],["remises","Remises"],["resultats","Résultats"]]){$("statistics").insertAdjacentHTML("beforeend",`<div class="stat">${t}<strong>${await count(n)}</strong></div>`)}}

const translations={
"Accueil":"Akèy","Utilisateurs":"Itilizatè","Administration":"Administrasyon","Étudiants":"Elèv","Professeurs":"Pwofesè","Classes":"Klas","Matières / Cours":"Matyè / Kou","Départements":"Depatman","Programmes":"Pwogram","Affectations":"Afektasyon","Statistiques":"Estatistik","Pédagogie":"Pedagoji","Devoirs":"Devwa","Remises / Corrections":"Travay remèt / Koreksyon","Résultats / Notes":"Rezilta / Nòt","Mes cours":"Kou mwen","Déconnexion":"Dekonekte","Tableau de bord":"Tablo kontwòl","Bienvenue":"Byenveni","Se connecter":"Konekte","Créer un compte":"Kreye yon kont","Adresse email":"Adrès imèl","Mot de passe":"Modpas","Nom complet":"Non konplè","Enregistrer":"Anrejistre","Ajouter":"Ajoute","Supprimer":"Efase","Modifier":"Modifye","Approuver":"Apwouve","Note sur 20":"Nòt sou 20","Note sur 100":"Nòt sou 100","Date limite":"Dat limit","Votre réponse / travail":"Repons / travay ou","Envoyer":"Voye","Enregistrer la correction":"Anrejistre koreksyon an","Créer un devoir":"Kreye yon devwa","Installer l'application":"Enstale aplikasyon an","Installer":"Enstale"
};
let currentLang="fr";
function translate(root){if(currentLang!=="ht")return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const t=n.nodeValue.trim();if(translations[t])n.nodeValue=n.nodeValue.replace(t,translations[t])}}
window.setLang=v=>{currentLang=v;try{localStorage.setItem("pedagogue-lang",v)}catch(e){}document.documentElement.lang=v==="ht"?"ht":"fr";if(v==="ht")translate(document.body);else location.reload()};
try{$("lang").value=localStorage.getItem("pedagogue-lang")||"fr";currentLang=$("lang").value;if(currentLang==="ht")translate(document.body)}catch(e){}
new MutationObserver(()=>{if(currentLang==="ht")translate(document.body)}).observe(document.body,{subtree:true,childList:true,characterData:true});

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("appInstall").classList.remove("hidden");$("authInstall").classList.remove("hidden")});
window.installApp=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else notify("Nan Chrome, ouvri meni ⋮ a epi chwazi Installer l'application oswa Ajouter à l'écran d'accueil. Sit la dwe sou HTTPS.")};
window.addEventListener("appinstalled",()=>notify("Application installée."));
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(e=>console.error("Service Worker:",e)));
</script>
