:root {
  --blue:#1d4ed8;
  --dark:#102a56;
  --light:#eff6ff;
  --bg:#f3f6fb;
  --white:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#dbe3ef;
  --red:#dc2626;
  --green:#15803d;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
.hidden { display:none!important; }
button:disabled { opacity:.5; cursor:not-allowed; }
.btn {
  border:0;
  border-radius:8px;
  padding:10px 14px;
  background:var(--blue);
  color:white;
  font-weight:600;
}
.btn:hover { filter:brightness(.95); }
.btn-light {
  background:white;
  color:var(--text);
  border:1px solid var(--border);
}
.btn-danger { background:var(--red); }
.btn-success { background:var(--green); }
.btn-small { padding:6px 9px; font-size:12px; margin:2px; }
input,select,textarea {
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:white;
  color:var(--text);
}
textarea { min-height:90px; resize:vertical; }
label { display:block; margin:12px 0 6px; font-weight:600; }
h1,h2,h3 { margin-top:0; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.card {
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 8px #0f172a08;
}
.auth-wrap {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(140deg,#dbeafe,#f8fafc);
}
.auth-card {
  width:100%;
  max-width:430px;
  background:white;
  padding:26px;
  border-radius:16px;
  box-shadow:0 15px 50px #0f172a16;
}
.brand-mark {
  width:62px;height:62px;

  display:flex;align-items:center;justify-content:center;

.auth-card h1 { text-align:center;font-size:23px; }
.auth-card .subtitle { text-align:center;color:var(--muted);font-size:14px; }
.auth-actions { display:grid;gap:10px;margin-top:18px; }
.google-g { width:20px;height:20px;vertical-align:middle;margin-right:9px; }
.auth-note { font-size:13px;color:var(--muted);line-height:1.5; }
.app { min-height:100vh; }
.topbar {
  height:auto;min-height:66px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;
  padding:12px 18px;
  background:var(--dark);color:white;
}
.top-brand { font-weight:700; }
.top-actions { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
.top-actions select { width:auto;min-width:130px;padding:8px; }
.top-actions .btn-light { color:var(--text); }
.layout { display:flex;min-height:calc(100vh - 66px); }
.sidebar {
  width:245px;flex-shrink:0;
  background:white;border-right:1px solid var(--border);
  padding:15px 10px;
}
.nav-label {
  font-size:11px;text-transform:uppercase;
  letter-spacing:1px;color:var(--muted);
  padding:10px 12px 7px;

.nav-btn {

  border-radius:8px;padding:11px 12px;margin:2px 0;
  color:#334155;font-weight:600;
}
.nav-btn:hover,.nav-btn.active { background:var(--light);color:var(--blue); }
.main { flex:1;min-width:0;padding:22px; }
.page-heading { display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap; }
.stats-grid {
  display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:14px;

.stat-number { font-size:29px;font-weight:800;color:var(--blue);margin-top:8px; }
.toolbar { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px; }
.toolbar input { flex:1;min-width:180px; }
.table-wrap { width:100%;overflow-x:auto; }
table { width:100%;border-collapse:collapse;background:white; }
th,td { padding:11px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:13px; }
th { background:#f8fafc;white-space:nowrap; }
.empty { padding:25px;text-align:center;color:var(--muted); }
.status { display:inline-block;border-radius:20px;padding:4px 8px;font-size:12px;background:#fef3c7;color:#92400e; }
.status.accepted { background:#dcfce7;color:#166534; }
.status.refused { background:#fee2e2;color:#991b1b; }
.modal {
  position:fixed;inset:0;z-index:20;
  background:#0f172a99;display:flex;align-items:center;justify-content:center;
  padding:15px;
}
.modal-box {
  background:white;border-radius:12px;padding:20px;

}
.modal-actions { display:flex;justify-content:flex-end;gap:8px;margin-top:16px; }
.toast {

  background:#0f172a;color:white;padding:12px 18px;border-radius:9px;
  z-index:50;max-width:90%;box-shadow:0 5px 20px #0002;

.mobile-menu { display:none; }

  .card { padding:13px; }
  .mobile-menu { display:inline-block; }
}
</style>

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

window.changeLanguage = value => {
  language = value === "ht" ? "ht" : "fr";
  localStorage.setItem("lePedagogueLanguage", language);
  document.documentElement.lang = language === "ht" ? "ht" : "fr";
  $("language").value = language;
  $("authLanguage").value = language;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (translations[language][key]) el.textContent = t(key);
  });
  if (currentUser && currentProfile) renderPage();
};

window.toggleSidebar = () => $("sidebar").classList.toggle("collapsed");

async function createProfile(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  const isAdminEmail = (user.email || "").toLowerCase() === ADMIN_EMAIL;
  if (!snap.exists()) {
    const profile = {
      uid:user.uid,
      email:user.email || "",
      displayName:user.displayName || (user.email || "").split("@")[0],
      role:isAdminEmail ? "administrateur" : "eleve",
      status:isAdminEmail ? "accepted" : "attente",
      createdAt:serverTimestamp()
    };
    await setDoc(ref, profile);
    return {...profile, uid:user.uid};
  }
  const data = snap.data();
  if (isAdminEmail && (data.role !== "administrateur" || data.status !== "accepted")) {
    await updateDoc(ref, {role:"administrateur",status:"accepted"});
    data.role = "administrateur";
    data.status = "accepted";
  }
  return {...data, uid:user.uid};
}

async function getProfile(user) {
  const snap = await getDoc(doc(db,"users",user.uid));
  if (!snap.exists()) return createProfile(user);
  const data = snap.data();
  if ((user.email || "").toLowerCase() === ADMIN_EMAIL &&
      (data.role !== "administrateur" || data.status !== "accepted")) {
    await updateDoc(doc(db,"users",user.uid), {
      role:"administrateur", status:"accepted"
    });
    data.role = "administrateur";
    data.status = "accepted";
  }
  return {...data, uid:user.uid};
}

};

window.register = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) return authMessage(t("fillFields"));
  if (password.length < 6) {
    return authMessage(language === "ht" ?
      "Modpas la dwe gen omwen 6 karaktè." :
      "Le mot de passe doit contenir au moins 6 caractères.");
  }
  try {
    authMessage(t("loading"));
    const result = await createUserWithEmailAndPassword(auth,email,password);
    await createProfile(result.user);
    authMessage(t("accountCreated"));
  } catch (e) {
    authMessage(friendlyAuthError(e));
  }
};

window.loginGoogle = async () => {
  try {
    authMessage(t("loading"));
    await signInWithPopup(auth,googleProvider);
  } catch (e) {
    authMessage(friendlyAuthError(e));
  }
};

function friendlyAuthError(e) {
  const messages = {
    "auth/invalid-email": language === "ht" ? "Adrès imèl la pa valab." : "Adresse e-mail invalide.",
    "auth/user-not-found": language === "ht" ? "Kont sa a pa jwenn." : "Compte introuvable.",
    "auth/wrong-password": language === "ht" ? "Modpas la pa kòrèk." : "Mot de passe incorrect.",
    "auth/invalid-credential": language === "ht" ? "Imèl oswa modpas la pa kòrèk." : "E-mail ou mot de passe incorrect.",
    "auth/email-already-in-use": language === "ht" ? "Imèl sa a deja itilize." : "Cette adresse e-mail est déjà utilisée.",
    "auth/weak-password": language === "ht" ? "Chwazi yon modpas ki pi solid." : "Choisissez un mot de passe plus solide.",
    "auth/popup-closed-by-user": language === "ht" ? "Ou fèmen fenèt Google la." : "La fenêtre Google a été fermée.",
    "auth/unauthorized-domain": language === "ht" ? "Ajoute domèn sit la nan Firebase Authentication > Paramètres." : "Ajoutez le domaine du site dans Firebase Authentication > Paramètres."
  };
  return messages[e.code] || `${t("connectionError")}: ${e.message || e.code}`;
}

window.logoutUser = async () => {
  try { await signOut(auth); }
  catch(e) { toast(friendlyAuthError(e)); }
};

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (!user) {
    currentProfile = null;
    $("authScreen").classList.remove("hidden");
    $("appScreen").classList.add("hidden");
    return;
  }
  try {
    await setPersistence(auth,browserLocalPersistence);
    currentProfile = await getProfile(user);
    if (currentProfile.status !== "accepted") {
      await signOut(auth);
      $("authScreen").classList.remove("hidden");
      $("appScreen").classList.add("hidden");
      authMessage(currentProfile.status === "refused" ? t("refusedAccount") : t("waitingApproval"));
      return;
    }
    $("authScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");
    $("adminNavigation").classList.toggle("hidden", !isAdmin());
    $("language").value = language;
    applyTranslations();
    openPage("dashboard");
  } catch(e) {
    authMessage(`${t("connectionError")}: ${e.message}`);
  }
});

function isAdmin() {
  return !!currentProfile &&
    currentProfile.status === "accepted" &&
    (currentProfile.role === "administrateur" ||
     (currentUser?.email || "").toLowerCase() === ADMIN_EMAIL);
}
function applyTranslations() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (translations[language][key]) el.textContent = t(key);
  });
  $("language").value = language;
  $("authLanguage").value = language;
}

const modules = {
  etudiants:{label:"students",collection:"etudiants",fields:[
    ["nom","name","text"],["email","emailField","email"],["classe","className","text"],["telephone","phone","text"]
  ]},
  professeurs:{label:"teachers",collection:"professeurs",fields:[
    ["nom","name","text"],["email","emailField","email"],["specialite","subjects","text"],["telephone","phone","text"]
  ]},
  departements:{label:"departments",collection:"departements",fields:[
    ["nom","name","text"],["description","description","textarea"]
  ]},
  filieres:{label:"programs",collection:"filieres",fields:[
    ["nom","name","text"],["departement","departments","text"],["description","description","textarea"]
  ]},
  classes:{label:"classes",collection:"classes",fields:[
    ["nom","name","text"],["niveau","level","text"],["annee","academicYear","text"]
  ]},
  matieres:{label:"subjects",collection:"matieres",fields:[
    ["nom","name","text"],["description","description","textarea"]
  ]},
  cours:{label:"courses",collection:"cours",fields:[
    ["titre","title","text"],["matiere","subject","text"],["classe","className","text"],["description","description","textarea"]
  ]},
  affectations:{label:"assignments",collection:"affectations",fields:[
    ["professeur","teacherName","text"],["matiere","subject","text"],["classe","className","text"],["annee","academicYear","text"]
  ]},
  inscriptions:{label:"enrollments",collection:"inscriptions",fields:[
    ["eleve","studentName","text"],["classe","className","text"],["annee","academicYear","text"]
  ]},
  devoirs:{label:"homework",collection:"devoirs",fields:[
    ["titre","title","text"],["matiere","subject","text"],["classe","className","text"],["date","date","date"],["description","description","textarea"]
  ]},
  remises:{label:"submissions",collection:"remises",fields:[
    ["devoir","homework","text"],["eleve","studentName","text"],["contenu","content","textarea"],["note","grade","number"],["commentaire","description","textarea"]
  ]},
  resultats:{label:"results",collection:"resultats",fields:[
    ["eleve","studentName","text"],["matiere","subject","text"],["note","grade","number"],["commentaire","description","textarea"]
  ]},
  annees:{label:"academicYears",collection:"annees_academiques",fields:[
    ["nom","academicYear","text"],["debut","startDate","date"],["fin","endDate","date"]
  ]}
};

window.openPage = async page => {
  if (["utilisateurs","sauvegarde"].includes(page) && !isAdmin()) {
    toast(t("accessDenied")); return;
  }
  currentPage = page;
  document.querySelectorAll(".nav-btn[data-page]").forEach(btn =>
    btn.classList.toggle("active",btn.dataset.page === page)
  );
  if (page === "dashboard") return renderDashboard();
  if (page === "statistiques") return renderStatistics();
  if (page === "utilisateurs") return renderUsers();
  if (page === "sauvegarde") return renderBackup();
  if (modules[page]) return renderModule(page);
  $("pageContent").innerHTML = `<div class="card"><h2>${escapeHtml(t("overview"))}</h2><p>${escapeHtml(t("noRecords"))}</p></div>`;
};

async function getCollectionRecords(collectionName) {
  const snap = await getDocs(collection(db,collectionName));
  return snap.docs.map(d => ({id:d.id,...d.data()}));
}

async function renderDashboard() {
  $("pageContent").innerHTML = `
    <div class="page-heading"><div>
      <h1>${escapeHtml(t("dashboard"))}</h1>
      <p class="muted">${escapeHtml(t("dashboardDescription"))}</p>
    </div></div>
    <div class="stats-grid">
      ${statCard("totalStudents","—")}
      ${statCard("totalTeachers","—")}
      ${statCard("totalClasses","—")}
      ${statCard("pendingUsers","—")}
    </div>
    <div class="card"><h2>${escapeHtml(t("welcome"))}</h2>
      <p>${escapeHtml(currentProfile?.displayName || currentUser?.email || "")}</p>
      <p>${escapeHtml(t("role"))}: ${escapeHtml(roleLabel(currentProfile?.role))}</p>
    </div>`;
  try {
    const [students,teachers,classes,users] = await Promise.all([
      getCollectionRecords("etudiants"),
      getCollectionRecords("professeurs"),
      getCollectionRecords("classes"),
      isAdmin() ? getCollectionRecords("users") : Promise.resolve([])
    ]);
    const pending = users.filter(u => u.status !== "accepted").length;
    const values = {totalStudents:students.length,totalTeachers:teachers.length,
      totalClasses:classes.length,pendingUsers:pending};
    document.querySelectorAll("[data-stat]").forEach(el => {
      el.querySelector(".stat-number").textContent = values[el.dataset.stat] ?? "—";
    });
  } catch(e) { toast(`${t("connectionError")}: ${e.message}`); }
}
function statCard(key,value) {
  return `<div class="card" data-stat="${key}"><div class="muted">${escapeHtml(t(key))}</div><div class="stat-number">${value}</div></div>`;
}
function roleLabel(role) {
  if (role === "administrateur") return t("admin");
  if (role === "professeur") return t("teacher");
  if (role === "eleve") return t("student");
  return role || "—";
}
function statusLabel(status) {
  if (status === "accepted") return t("accepted");
  if (status === "refused") return t("refused");
  return t("pending");
}

async function renderModule(page) {
  const mod = modules[page];
  currentCollection = mod.collection;
  $("pageContent").innerHTML = `
    <div class="page-heading"><h1>${escapeHtml(t(mod.label))}</h1>
      <button class="btn" onclick="openRecordModal('${page}')">＋ ${escapeHtml(t("add"))}</button>
    </div>
    <div class="card">
      <div class="toolbar">
        <input id="searchRecords" placeholder="${escapeHtml(t("search"))}" oninput="filterTable()">
        <button class="btn btn-light" onclick="openPage('${page}')">${escapeHtml(t("refresh"))}</button>
      </div>
      <div id="recordsTable">${escapeHtml(t("loading"))}</div>
    </div>`;
  try {
    currentRecords = await getCollectionRecords(mod.collection);
    drawTable(page,currentRecords);
  } catch(e) {
    $("recordsTable").innerHTML = `<p>${escapeHtml(t("connectionError"))}: ${escapeHtml(e.message)}</p>`;
  }
}
function drawTable(page,records) {
  const mod = modules[page];
  if (!records.length) {
    $("recordsTable").innerHTML = `<div class="empty">${escapeHtml(t("noRecords"))}</div>`;
    return;
  }
  const fields = mod.fields;
  $("recordsTable").innerHTML = `<div class="table-wrap"><table>
    <thead><tr>${fields.map(f=>`<th>${escapeHtml(t(f[1]))}</th>`).join("")}<th>${escapeHtml(t("actions"))}</th></tr></thead>
    <tbody>${records.map(r=>`<tr data-search="${escapeHtml(fields.map(f=>r[f[0]]||"").join(" ").toLowerCase())}">
      ${fields.map(f=>`<td>${escapeHtml(r[f[0]] ?? "—")}</td>`).join("")}
      <td>
        <button class="btn btn-small" onclick="editRecord('${page}','${r.id}')">${escapeHtml(t("edit"))}</button>
        <button class="btn btn-danger btn-small" onclick="removeRecord('${page}','${r.id}')">${escapeHtml(t("delete"))}</button>
      </td></tr>`).join("")}</tbody></table></div>`;
}
window.filterTable = () => {
  const value = ($("searchRecords")?.value || "").toLowerCase();
  document.querySelectorAll("#recordsTable tbody tr").forEach(row => {
    row.style.display = row.dataset.search.includes(value) ? "" : "none";
  });
};

window.openRecordModal = (page,id=null) => {
  const mod = modules[page];
  editingId = id;
  currentCollection = mod.collection;
  const record = id ? currentRecords.find(r=>r.id===id) : {};
  $("modalTitle").textContent = id ? t("edit") : t("add");
  $("modalContent").innerHTML = mod.fields.map(f => `
    <label>${escapeHtml(t(f[1]))}</label>
    ${f[2] === "textarea"
      ? `<textarea name="${f[0]}">${escapeHtml(record?.[f[0]] || "")}</textarea>`
      : `<input name="${f[0]}" type="${f[2]}" value="${escapeHtml(record?.[f[0]] || "")}" ${["nom","titre"].includes(f[0])?"required":""}>`}
  `).join("");
  $("modalSave").disabled = false;
  $("modal").classList.remove("hidden");
  $("modalSave").dataset.page = page;
};
window.editRecord = (page,id) => openRecordModal(page,id);
window.closeModal = () => $("modal").classList.add("hidden");

window.saveRecord = async () => {
  const page = $("modalSave").dataset.page;
  const mod = modules[page];
  const data = {};
  $("modalContent").querySelectorAll("[name]").forEach(el => {
    data[el.name] = el.value.trim();
  });
  if (Object.values(data).some(v => v === "")) {
    // Some optional fields can remain empty; only the first field is required.
    const required = $("modalContent").querySelector("[required]");
    if (required && !required.value.trim()) return toast(t("fillFields"));
  }
  $("modalSave").disabled = true;
  try {
    if (editingId) {
      await updateDoc(doc(db,mod.collection,editingId),{
        ...data,updatedAt:serverTimestamp(),updatedBy:currentUser.uid
      });
    } else {
      await addDoc(collection(db,mod.collection),{
        ...data,createdAt:serverTimestamp(),createdBy:currentUser.uid
      });
    }
    closeModal();
    toast(t("saved"));
    await renderModule(page);
  } catch(e) {
    toast(`${t("connectionError")}: ${e.message}`);
  } finally {
    $("modalSave").disabled = false;
  }
};

window.removeRecord = async (page,id) => {
  if (!confirm(t("confirmDelete"))) return;
  try {
    await deleteDoc(doc(db,modules[page].collection,id));
    toast(t("deleted"));
    await renderModule(page);
  } catch(e) { toast(`${t("connectionError")}: ${e.message}`); }
};

async function renderUsers() {
  if (!isAdmin()) return toast(t("accessDenied"));
  $("pageContent").innerHTML = `<h1>${escapeHtml(t("users"))}</h1><div class="card"><div id="usersTable">${escapeHtml(t("loading"))}</div></div>`;
  try {
    const users = await getCollectionRecords("users");
    if (!users.length) {
      $("usersTable").innerHTML = `<div class="empty">${escapeHtml(t("noRecords"))}</div>`;
      return;
    }
    $("usersTable").innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>${escapeHtml(t("emailField"))}</th><th>${escapeHtml(t("role"))}</th><th>${escapeHtml(t("status"))}</th><th>${escapeHtml(t("uid"))}</th><th>${escapeHtml(t("actions"))}</th></tr></thead>
      <tbody>${users.map(u=>`<tr>
        <td>${escapeHtml(u.email||"—")}</td>
        <td><select id="role-${u.id}">
          <option value="eleve" ${u.role==="eleve"?"selected":""}>${escapeHtml(t("student"))}</option>
          <option value="professeur" ${u.role==="professeur"?"selected":""}>${escapeHtml(t("teacher"))}</option>
          <option value="administrateur" ${u.role==="administrateur"?"selected":""}>${escapeHtml(t("admin"))}</option>
        </select></td>
        <td><span class="status ${u.status==="accepted"?"accepted":u.status==="refused"?"refused":""}">${escapeHtml(statusLabel(u.status))}</span></td>
        <td>${escapeHtml(u.uid||u.id)}</td>
        <td>
          <button class="btn btn-success btn-small" onclick="setUserStatus('${u.id}','accepted')">${escapeHtml(t("accept"))}</button>
          <button class="btn btn-danger btn-small" onclick="setUserStatus('${u.id}','refused')">${escapeHtml(t("refuse"))}</button>
          <button class="btn btn-small" onclick="setUserRole('${u.id}')">${escapeHtml(t("changeRole"))}</button>
        </td></tr>`).join("")}</tbody></table></div>`;
  } catch(e) { $("usersTable").textContent = `${t("connectionError")}: ${e.message}`; }
}
window.setUserStatus = async (id,status) => {
  if (!isAdmin()) return toast(t("accessDenied"));
  try {
    await updateDoc(doc(db,"users",id),{status,updatedAt:serverTimestamp()});
    toast(status==="accepted"?t("userAccepted"):t("userRefused"));
    await renderUsers();
  } catch(e) { toast(`${t("connectionError")}: ${e.message}`); }
};
window.setUserRole = async id => {
  if (!isAdmin()) return toast(t("accessDenied"));
  const role = $(`role-${id}`).value;
  try {
    await updateDoc(doc(db,"users",id),{role,updatedAt:serverTimestamp()});
    toast(t("roleUpdated"));
    await renderUsers();
  } catch(e) { toast(`${t("connectionError")}: ${e.message}`); }
};

async function renderStatistics() {
  $("pageContent").innerHTML = `<h1>${escapeHtml(t("statistics"))}</h1><div class="card">${escapeHtml(t("loading"))}</div>`;
  try {
    const counts = await Promise.all([
      getCollectionRecords("etudiants"),getCollectionRecords("professeurs"),
      getCollectionRecords("classes"),getCollectionRecords("devoirs"),
      getCollectionRecords("resultats")
    ]);
    const labels = ["totalStudents","totalTeachers","totalClasses","homework","results"];
    $("pageContent").innerHTML = `<h1>${escapeHtml(t("statistics"))}</h1><div class="stats-grid">${
      counts.map((items,i)=>statCard(labels[i],items.length)).join("")
    }</div>`;
  } catch(e) { toast(`${t("connectionError")}: ${e.message}`); }
}

async function renderBackup() {
  if (!isAdmin()) return toast(t("accessDenied"));
  $("pageContent").innerHTML = `<h1>${escapeHtml(t("backup"))}</h1>
    <div class="card"><p>${language==="ht"?"Ekspòte done ki nan koleksyon prensipal yo pou konsève yon kopi.":"Exporter les données des principales collections pour en conserver une copie."}</p>
    <button class="btn" onclick="exportData()">${escapeHtml(t("export"))}</button></div>`;
}
window.exportData = async () => {
  if (!isAdmin()) return toast(t("accessDenied"));
  try {
    const names = [...Object.values(modules).map(m=>m.collection),"users"];
    const result = {};
    for (const name of [...new Set(names)]) result[name] = await getCollectionRecords(name);
    const blob = new Blob([JSON.stringify(result,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "le-pedagogue-sauvegarde.json";
    a.click(); URL.revokeObjectURL(url);
  } catch(e) { toast(`${t("connectionError")}: ${e.message}`); }
};

window.installApp = async () => {
  if (!installPrompt) {
    toast(language==="ht"
      ? "Si opsyon an pa parèt, ouvri meni navigatè a epi chwazi « Installer l'application » oswa « Ajouter à l'écran d'accueil »."
      : "Si l'option n'apparaît pas, ouvrez le menu du navigateur et choisissez « Installer l'application » ou « Ajouter à l'écran d'accueil ».");
    return;
  }
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  $("installBtn").classList.add("hidden");
};

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  installPrompt = event;
  $("installBtn").classList.remove("hidden");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    // Le nom du fichier doit correspondre au fichier réellement présent dans le dépôt.
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Service worker:",err));
  });
}

applyTranslations();
</script>
