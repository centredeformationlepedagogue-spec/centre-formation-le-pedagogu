<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a56">
<meta name="description" content="Centre de Formation Le Pédagogue - Gestion universitaire et école professionnelle">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>Centre de Formation Le Pédagogue</title>

<style>
:root {
  --blue:#2457d6;
  --dark:#102a56;
  --light:#edf4ff;
  --bg:#f4f7fc;
  --white:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#dce5f1;
  --red:#dc2626;
  --green:#15803d;
  --radius:16px;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:var(--bg);
}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
.hidden {display:none!important}
button:disabled {opacity:.5;cursor:not-allowed}
.btn {
  border:0;border-radius:10px;padding:11px 15px;
  background:var(--blue);color:white;font-weight:700;
}
.btn:hover {filter:brightness(.95)}
.btn-light {background:white;color:var(--text);border:1px solid var(--border)}
.btn-danger {background:var(--red)}
.btn-success {background:var(--green)}
.btn-small {padding:7px 9px;font-size:12px;margin:2px}
input,select,textarea {
  width:100%;padding:12px;border:1px solid #cbd5e1;
  border-radius:10px;background:white;color:var(--text);
}
textarea {min-height:90px;resize:vertical}
label {display:block;margin:13px 0 6px;font-weight:700;font-size:14px}
h1,h2,h3 {margin-top:0}
.muted {color:var(--muted)}
.small {font-size:12px}
.card {
  background:white;border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:16px;
  box-shadow:0 5px 20px #102a5608;
}
.auth-wrap {
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:
    radial-gradient(circle at top left,#c7dcff 0,transparent 40%),
    linear-gradient(145deg,#eef4ff,#f9fbff);
}
.auth-card {
  width:100%;max-width:440px;background:white;padding:30px;
  border-radius:22px;box-shadow:0 18px 55px #102a5620;
}
.brand-mark {
  width:76px;height:76px;margin:0 auto 18px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2457d6,#102a56);
  color:white;font-size:29px;font-weight:900;
  box-shadow:0 8px 20px #2457d635;
}
.auth-card h1 {text-align:center;font-size:23px;line-height:1.35}
.subtitle {text-align:center;color:var(--muted);line-height:1.5}
.auth-actions {display:grid;gap:10px;margin-top:20px}
.google-g {width:20px;height:20px;vertical-align:middle;margin-right:9px}
.auth-note {font-size:13px;color:var(--muted);line-height:1.5}
.topbar {
  min-height:72px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;padding:13px 20px;
  background:var(--dark);color:white;box-shadow:0 3px 12px #102a5620;
}
.top-brand {font-weight:800;display:flex;align-items:center;gap:10px}
.brand-small {
  width:38px;height:38px;border-radius:12px;background:#ffffff1c;
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.top-actions {display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top-actions select {width:auto;min-width:140px;padding:9px}
.layout {display:flex;min-height:calc(100vh - 72px)}
.sidebar {
  width:255px;flex-shrink:0;background:white;
  border-right:1px solid var(--border);padding:16px 11px;
}
.nav-label {
  font-size:11px;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);padding:12px 12px 8px;font-weight:800;
}
.nav-btn {
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:0;background:transparent;border-radius:10px;
  padding:12px;margin:3px 0;color:#334155;font-weight:700;
}
.nav-btn:hover,.nav-btn.active {background:var(--light);color:var(--blue)}
.main {flex:1;min-width:0;padding:24px}
.hero {
  padding:27px;border-radius:20px;color:white;margin-bottom:20px;
  background:linear-gradient(120deg,#2457d6,#102a56);
  box-shadow:0 10px 25px #102a5620;
}
.hero h1 {margin-bottom:9px;font-size:clamp(23px,3vw,32px)}
.hero p {margin:0;color:#e2eaff;line-height:1.6}
.page-heading {
  display:flex;justify-content:space-between;gap:12px;
  align-items:center;flex-wrap:wrap;margin-bottom:18px;
}
.stats-grid {display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:14px}
.stat-card {position:relative;overflow:hidden}
.stat-icon {
  width:42px;height:42px;border-radius:13px;background:var(--light);
  display:flex;align-items:center;justify-content:center;font-size:21px;
}
.stat-number {font-size:30px;font-weight:900;color:var(--blue);margin-top:12px}
.stat-label {font-size:13px;color:var(--muted);font-weight:700}
.toolbar {display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input {flex:1;min-width:180px}
.table-wrap {width:100%;overflow-x:auto}
table {width:100%;border-collapse:collapse;background:white}
th,td {padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th {background:#f7f9fd;white-space:nowrap}
.empty {padding:25px;text-align:center;color:var(--muted)}
.status {display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;background:#fef3c7;color:#92400e}
.status.accepted {background:#dcfce7;color:#166534}
.status.refused {background:#fee2e2;color:#991b1b}
.modal {
  position:fixed;inset:0;z-index:20;background:#0f172a99;
  display:flex;align-items:center;justify-content:center;padding:15px;
}
.modal-box {
  background:white;border-radius:16px;padding:22px;width:100%;
  max-width:600px;max-height:90vh;overflow:auto;
}
.modal-actions {display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast {
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#102a56;color:white;padding:13px 18px;border-radius:11px;
  z-index:50;max-width:92%;box-shadow:0 5px 20px #0002;
}
.mobile-menu {display:none}
.profile-line {display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.role-chip {display:inline-block;background:#dbeafe;color:#1d4ed8;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:800}
@media(max-width:950px) {
  .stats-grid {grid-template-columns:repeat(2,minmax(130px,1fr))}
  .sidebar {width:225px}
  .main {padding:16px}
}
@media(max-width:650px) {
  .layout {display:block}
  .sidebar {width:100%;border-right:0;border-bottom:1px solid var(--border)}
  .sidebar.collapsed {display:none}
  .main {padding:12px}
  .topbar {padding:12px}
  .top-brand {width:100%;font-size:14px}
  .stats-grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .card {padding:14px}
  .mobile-menu {display:inline-block}
  .hero {padding:20px}
  .auth-card {padding:22px}
}
</style>
</head>
<body>

            <path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.4-6.3l-7.2-5.6c-2 1.4-4.6 2.3-8.2 2.3-6.1 0-11.3-4-13.2-9.5L3 35.2C6.5 42.6 14.6 48 24 48z"/>

</div>

  GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,
  collection,addDoc,getDocs,serverTimestamp

};

const ADMIN_EMAIL="centredeformationlepedagogue@gmail.com";
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const googleProvider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);

let currentUser=null;
let currentProfile=null;
let currentPage="dashboard";
let currentRecords=[];
let editingId=null;
let installPrompt=null;

const words={

const t=k=>words[language]?.[k]||words.fr[k]||k;

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function toast(message){
  $("toast").textContent=message;
  $("toast").classList.remove("hidden");
  setTimeout(()=>$("toast").classList.add("hidden"),3200);
}
function authMessage(message){$("authMessage").textContent=message;}

function isAdmin(){
  return !!currentProfile && currentProfile.status==="accepted" &&
    (currentProfile.role==="administrateur" ||
    (currentUser?.email||"").toLowerCase()===ADMIN_EMAIL);
}
function isTeacher(){return currentProfile?.role==="professeur";}
function isStudent(){return currentProfile?.role==="eleve";}

window.changeLanguage=value=>{
  if(!isAdmin()) return;
  language=value==="ht"?"ht":"fr";
  localStorage.setItem("lePedagogueLanguage",language);
  $("language").value=language;
  document.documentElement.lang=language==="ht"?"ht":"fr";
  renderPage();
};
window.toggleSidebar=()=>$("sidebar").classList.toggle("collapsed");

async function getRecords(name){
  const snap=await getDocs(collection(db,name));
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function profileFor(user){
  const ref=doc(db,"users",user.uid);
  const snap=await getDoc(ref);
  const email=(user.email||"").toLowerCase();
  const adminEmail=email===ADMIN_EMAIL;

  if(!snap.exists()){
    const profile={
      uid:user.uid,email:user.email||"",
      displayName:user.displayName||(user.email||"").split("@")[0],
      role:adminEmail?"administrateur":"eleve",
      status:adminEmail?"accepted":"attente",
      createdAt:serverTimestamp()
    };
    await setDoc(ref,profile);
    return {...profile,uid:user.uid};
  }

  const data=snap.data();
  if(adminEmail && (data.role!=="administrateur"||data.status!=="accepted")){
    await updateDoc(ref,{role:"administrateur",status:"accepted"});
    data.role="administrateur";
    data.status="accepted";
  }
  return {...data,uid:user.uid};
}

window.login=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password) return authMessage(t("fill"));
  try{
    authMessage(t("loading"));
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){authMessage(authError(e));}
};

window.register=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password) return authMessage(t("fill"));
  if(password.length<6) return authMessage("Le mot de passe doit contenir au moins 6 caractères.");
  try{
    authMessage(t("loading"));
    const result=await createUserWithEmailAndPassword(auth,email,password);
    await profileFor(result.user);
    authMessage(t("accountCreated"));
  }catch(e){authMessage(authError(e));}
};

window.loginGoogle=async()=>{
  try{
    authMessage(t("loading"));
    await signInWithPopup(auth,googleProvider);
  }catch(e){authMessage(authError(e));}
};

function authError(e){
  const map={
    "auth/invalid-email":"Adresse e-mail invalide.",
    "auth/invalid-credential":"E-mail ou mot de passe incorrect.",
    "auth/email-already-in-use":"Cette adresse e-mail est déjà utilisée.",
    "auth/weak-password":"Le mot de passe doit contenir au moins 6 caractères.",
    "auth/unauthorized-domain":"Ajoutez le domaine du site dans Firebase Authentication > Paramètres.",
    "auth/popup-closed-by-user":"La fenêtre Google a été fermée."
  };
  return map[e.code]||`${t("connection")}: ${e.message||e.code}`;
}

window.logoutUser=async()=>{try{await signOut(auth);}catch(e){toast(authError(e));}};

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(!user){
    currentProfile=null;
    $("authScreen").classList.remove("hidden");
    $("appScreen").classList.add("hidden");
    return;
  }
  try{
    currentProfile=await profileFor(user);
    if(currentProfile.status!=="accepted"){
      await signOut(auth);
      $("authScreen").classList.remove("hidden");
      $("appScreen").classList.add("hidden");
      authMessage(currentProfile.status==="refused"
        ?"Votre compte a été refusé. Contactez l'administrateur."
        :t("pendingMessage"));
      return;
    }
    $("authScreen").classList.add("hidden");
    $("appScreen").classList.remove("hidden");
    $("adminNavigation").classList.toggle("hidden",!isAdmin());
    $("adminLanguageControl").classList.toggle("hidden",!isAdmin());
    if(isAdmin()) $("language").value=language;
    openPage("dashboard");
  }catch(e){authMessage(`${t("connection")}: ${e.message}`);}
});

function roleName(){
  if(isAdmin()) return t("administrator");
  if(isTeacher()) return t("teacher");
  return t("studentRole");
}
function pageAllowed(page){
  if(isAdmin()) return true;
  if(page==="dashboard"||page==="statistiques") return true;
  if(isTeacher()) return ["classes","cours","matieres","affectations","devoirs","remises","resultats"].includes(page);
  if(isStudent()) return ["classes","cours","matieres","devoirs","remises","resultats"].includes(page);
  return false;
}
function canCreate(page){
  if(isAdmin()) return true;
  if(isTeacher()) return ["devoirs","remises","resultats"].includes(page);
  if(isStudent()) return page==="remises";
  return false;
}
function canEdit(page){
  if(isAdmin()) return true;
  if(isTeacher()) return ["devoirs","remises","resultats"].includes(page);
  return false;
}
function canDelete(page){
  if(isAdmin()) return true;
  if(isTeacher()) return ["devoirs","remises","resultats"].includes(page);
  return false;
}

async function myStudentInfo(){
  const records=await getRecords("etudiants");
  return records.find(r=>(r.email||"").toLowerCase()===(currentUser.email||"").toLowerCase())||null;
}
async function myClassNames(){
  if(isAdmin()) return null;
  const names=new Set();
  if(isTeacher()){
    const rows=await getRecords("affectations");
    rows.filter(r=>{
      const val=String(r.professeur||"").toLowerCase();
      return val===(currentUser.email||"").toLowerCase() ||
        val===(currentProfile.displayName||"").toLowerCase() ||
        val===currentUser.uid.toLowerCase();
    }).forEach(r=>{if(r.classe) names.add(String(r.classe));});
  } else if(isStudent()){
    const own=await myStudentInfo();
    if(own?.classe) names.add(String(own.classe));
    const enrollments=await getRecords("inscriptions");
    enrollments.filter(r=>(r.email||"").toLowerCase()===(currentUser.email||"").toLowerCase())
      .forEach(r=>{if(r.classe) names.add(String(r.classe));});
  }
  return names;
}
function sameClass(record,names){
  if(!names) return true;
  return names.has(String(record.classe||""));
}

async function scopedRecords(page){
  let rows=await getRecords(modules[page].collection);
  if(isAdmin()) return rows;
  const classes=await myClassNames();

  if(page==="classes") return rows.filter(r=>classes?.has(String(r.nom||r.classe||"")));
  if(page==="affectations" && isTeacher()){
    return rows.filter(r=>String(r.professeur||"").toLowerCase()===(currentUser.email||"").toLowerCase());
  }
  if(["cours","matieres","devoirs","resultats","remises","inscriptions"].includes(page)){
    rows=rows.filter(r=>sameClass(r,classes));
  }
  if(isStudent()){
    const email=(currentUser.email||"").toLowerCase();
    if(page==="remises"||page==="resultats") rows=rows.filter(r=>(r.email||"").toLowerCase()===email);
    if(page==="inscriptions") rows=rows.filter(r=>(r.email||"").toLowerCase()===email);
  }
  return rows;
}

window.openPage=async page=>{
  if(!pageAllowed(page)){toast(t("noAccess"));return;}
  if(page==="utilisateurs"||page==="sauvegarde"){
    if(!isAdmin()){toast(t("adminOnly"));return;}
  }
  currentPage=page;
  document.querySelectorAll(".nav-btn[data-page]").forEach(b=>
    b.classList.toggle("active",b.dataset.page===page)
  );
  $("sidebar").classList.add("collapsed");
  if(page==="dashboard") return renderDashboard();
  if(page==="statistiques") return renderStatistics();
  if(page==="utilisateurs") return renderUsers();
  if(page==="sauvegarde") return renderBackup();
  if(modules[page]) return renderModule(page);
};

window.renderPage=()=>openPage(currentPage);

async function renderDashboard(){
  const displayName=currentProfile?.displayName||currentUser?.email||"";
  $("pageContent").innerHTML=`
    <div class="hero">
      <h1>${esc(t("welcome"))}, ${esc(displayName)} 👋</h1>
      <p>${esc(t("overviewText"))}</p>
      <div class="profile-line" style="margin-top:16px">
        <span class="role-chip">${esc(roleName())}</span>
        <span>${esc(currentUser?.email||"")}</span>
      </div>
    </div>
    <div class="page-heading"><h2>${esc(t("overview"))}</h2></div>
    <div class="stats-grid" id="dashboardStats">
      ${statCard("🎓","students","—")}
      ${statCard("👨‍🏫","teachers","—")}
      ${statCard("🏫","classes","—")}
      ${isAdmin()?statCard("⏳","pending","—"):""}
    </div>
    <div class="card">
      <h2>🏫 ${esc(t("classroom"))}</h2>
      <p class="muted">${esc(isAdmin()
        ?"Vous contrôlez les classes, les affectations et les comptes."
        :isTeacher()
        ?"Vous accédez aux classes qui vous sont affectées."
        :"Vous accédez aux devoirs et résultats de votre classe.")}</p>
      <p><strong>${esc(t("myRole"))} :</strong> ${esc(roleName())}</p>
    </div>`;
  try{
    const [students,teachers,classes]=await Promise.all([
      getRecords("etudiants"),getRecords("professeurs"),getRecords("classes")
    ]);
    const stats=$("dashboardStats");
    if(!stats)return;
    const vals={students:students.length,teachers:teachers.length,classes:classes.length};
    stats.querySelectorAll("[data-stat]").forEach(el=>{
      el.querySelector(".stat-number").textContent=vals[el.dataset.stat]??"—";
    });
    if(isAdmin()){
      const users=await getRecords("users");
      const el=stats.querySelector('[data-stat="pending"] .stat-number');
      if(el)el.textContent=users.filter(u=>u.status!=="accepted").length;
    }
  }catch(e){toast(`${t("connection")}: ${e.message}`);}
}
function statCard(icon,key,value){
  return `<div class="card stat-card" data-stat="${key}">
    <div class="stat-icon">${icon}</div>
    <div class="stat-number">${value}</div>
    <div class="stat-label">${esc(t(key))}</div>
  </div>`;
}

async function renderModule(page){
  const mod=modules[page];
  $("pageContent").innerHTML=`
    <div class="page-heading">
      <div><h1>${esc(t(mod.label))}</h1>
      <p class="muted">${esc(t("overviewText"))}</p></div>
      <div>${canCreate(page)?`<button class="btn" onclick="openRecordModal('${page}')">＋ ${esc(t("add"))}</button>`:""}</div>
    </div>
    <div class="card">
      <div class="toolbar">
        <input id="searchRecords" placeholder="${esc(t("search"))}" oninput="filterTable()">
        <button class="btn btn-light" onclick="openPage('${page}')">${esc(t("refresh"))}</button>
      </div>
      <div id="recordsTable">${esc(t("loading"))}</div>
    </div>`;
  try{
    currentRecords=await scopedRecords(page);
    drawTable(page,currentRecords);
  }catch(e){
    $("recordsTable").innerHTML=`<p>${esc(t("connection"))}: ${esc(e.message)}</p>`;
  }
}

function drawTable(page,rows){
  const mod=modules[page];
  if(!rows.length){
    $("recordsTable").innerHTML=`<div class="empty">${esc(t("none"))}</div>`;
    return;
  }
  const fields=mod.fields;
  $("recordsTable").innerHTML=`<div class="table-wrap"><table>
    <thead><tr>${fields.map(f=>`<th>${esc(t(f[1]))}</th>`).join("")}<th>${esc(t("actions"))}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr data-search="${esc(fields.map(f=>r[f[0]]||"").join(" ").toLowerCase())}">
      ${fields.map(f=>`<td>${esc(r[f[0]]??"—")}</td>`).join("")}
      <td>
        ${canEdit(page)?`<button class="btn btn-small" onclick="editRecord('${page}','${r.id}')">${esc(t("edit"))}</button>`:""}
        ${canDelete(page)?`<button class="btn btn-danger btn-small" onclick="removeRecord('${page}','${r.id}')">${esc(t("delete"))}</button>`:""}
      </td>
    </tr>`).join("")}</tbody></table></div>`;
}
window.filterTable=()=>{
  const value=($("searchRecords")?.value||"").toLowerCase();
  document.querySelectorAll("#recordsTable tbody tr").forEach(row=>{
    row.style.display=row.dataset.search.includes(value)?"":"none";
  });
};

window.openRecordModal=(page,id=null)=>{
  if(id&&!canEdit(page)){toast(t("accessDenied"));return;}
  if(!id&&!canCreate(page)){toast(t("accessDenied"));return;}
  if(modules[page].admin&&!isAdmin()){toast(t("adminOnly"));return;}

  const mod=modules[page];
  editingId=id;
  const record=id?currentRecords.find(r=>r.id===id):{};
  $("modalTitle").textContent=id?t("edit"):t("add");
  $("modalSave").dataset.page=page;

  $("modalContent").innerHTML=mod.fields.map(f=>{
    const value=record?.[f[0]]||"";
    const required=f[3]?"required":"";
    if(f[2]==="textarea"){
      return `<label>${esc(t(f[1]))}</label><textarea name="${f[0]}" ${required}>${esc(value)}</textarea>`;
    }
    if(f[2]==="select"&&f[0]==="sexe"){
      return `<label>${esc(t(f[1]))}</label><select name="${f[0]}" ${required}>
        <option value="">—</option>
        <option value="Masculin" ${value==="Masculin"?"selected":""}>Masculin</option>
        <option value="Féminin" ${value==="Féminin"?"selected":""}>Féminin</option>
        <option value="Autre" ${value==="Autre"?"selected":""}>Autre</option>
      </select>`;
    }
    return `<label>${esc(t(f[1]))}</label><input name="${f[0]}" type="${f[2]}" value="${esc(value)}" ${required}>`;
  }).join("");
  $("modal").classList.remove("hidden");
};
window.editRecord=(page,id)=>openRecordModal(page,id);
window.closeModal=()=>$("modal").classList.add("hidden");

window.saveRecord=async()=>{
  const page=$("modalSave").dataset.page;
  const mod=modules[page];
  if(editingId&&!canEdit(page)){toast(t("accessDenied"));return;}
  if(!editingId&&!canCreate(page)){toast(t("accessDenied"));return;}
  if(mod.admin&&!isAdmin()){toast(t("adminOnly"));return;}

  const data={};
  $("modalContent").querySelectorAll("[name]").forEach(el=>data[el.name]=el.value.trim());
  for(const f of mod.fields){
    if(f[3]&&!data[f[0]]){toast(t("fill"));return;}
  }

  // Elèv la pa ka remèt travay pou yon lòt moun.
  if(isStudent()&&page==="remises"){
    data.eleve=currentProfile.displayName||currentUser.email;
    data.email=currentUser.email;
  }

  // Nòt la dwe ant 0 ak 100.
  if((page==="remises"||page==="resultats")&&data.note!==""){
    const grade=Number(data.note);
    if(!Number.isFinite(grade)||grade<0||grade>100){
      toast("La note doit être comprise entre 0 et 100.");return;
    }
  }

  $("modalSave").disabled=true;
  try{
    if(editingId){
      await updateDoc(doc(db,mod.collection,editingId),{
        ...data,updatedAt:serverTimestamp(),updatedBy:currentUser.uid
      });
    }else{
      await addDoc(collection(db,mod.collection),{
        ...data,createdAt:serverTimestamp(),createdBy:currentUser.uid
      });
    }
    closeModal();
    toast(t("saved"));
    await renderModule(page);
  }catch(e){toast(`${t("connection")}: ${e.message}`);}
  finally{$("modalSave").disabled=false;}
};

window.removeRecord=async(page,id)=>{
  if(!canDelete(page)){toast(t("accessDenied"));return;}
  if(!confirm(t("confirm")))return;
  try{
    await deleteDoc(doc(db,modules[page].collection,id));
    toast(t("deleted"));
    await renderModule(page);
  }catch(e){toast(`${t("connection")}: ${e.message}`);}
};

async function renderUsers(){
  if(!isAdmin()){toast(t("adminOnly"));return;}
  $("pageContent").innerHTML=`<h1>${esc(t("users"))}</h1><div class="card"><div id="usersTable">${esc(t("loading"))}</div></div>`;
  try{
    const users=await getRecords("users");
    if(!users.length){$("usersTable").innerHTML=`<div class="empty">${esc(t("none"))}</div>`;return;}
    $("usersTable").innerHTML=`<div class="table-wrap"><table>
      <thead><tr><th>${esc(t("email"))}</th><th>${esc(t("role"))}</th><th>${esc(t("status"))}</th><th>${esc(t("uid"))}</th><th>${esc(t("actions"))}</th></tr></thead>
      <tbody>${users.map(u=>`<tr>
        <td>${esc(u.email||"—")}</td>
        <td><select id="role-${esc(u.id)}">
          <option value="eleve" ${u.role==="eleve"?"selected":""}>${esc(t("studentRole"))}</option>
          <option value="professeur" ${u.role==="professeur"?"selected":""}>${esc(t("teacher"))}</option>
          <option value="administrateur" ${u.role==="administrateur"?"selected":""}>${esc(t("administrator"))}</option>
        </select></td>
        <td><span class="status ${u.status==="accepted"?"accepted":u.status==="refused"?"refused":""}">${esc(u.status==="accepted"?t("accepted"):u.status==="refused"?t("refused"):t("waiting"))}</span></td>
        <td>${esc(u.uid||u.id)}</td>
        <td>
          <button class="btn btn-success btn-small" onclick="setUserStatus('${u.id}','accepted')">${esc(t("accept"))}</button>
          <button class="btn btn-danger btn-small" onclick="setUserStatus('${u.id}','refused')">${esc(t("refuse"))}</button>
          <button class="btn btn-small" onclick="setUserRole('${u.id}')">${esc(t("changeRole"))}</button>
        </td>
      </tr>`).join("")}</tbody></table></div>`;
  }catch(e){$("usersTable").textContent=`${t("connection")}: ${e.message}`;}
}
window.setUserStatus=async(id,status)=>{
  if(!isAdmin())return toast(t("adminOnly"));
  try{
    await updateDoc(doc(db,"users",id),{status,updatedAt:serverTimestamp()});
    toast(status==="accepted"?t("accepted"):t("refused"));
    await renderUsers();
  }catch(e){toast(`${t("connection")}: ${e.message}`);}
};
window.setUserRole=async id=>{
  if(!isAdmin())return toast(t("adminOnly"));
  const role=$(`role-${id}`).value;
  try{
    await updateDoc(doc(db,"users",id),{role,updatedAt:serverTimestamp()});
    toast("Rôle mis à jour.");
    await renderUsers();
  }catch(e){toast(`${t("connection")}: ${e.message}`);}
};

async function renderStatistics(){
  $("pageContent").innerHTML=`<h1>${esc(t("statistics"))}</h1><div class="stats-grid" id="statisticsGrid">${esc(t("loading"))}</div>`;
  try{
    const [students,teachers,classes,homework,results]=await Promise.all([
      getRecords("etudiants"),getRecords("professeurs"),getRecords("classes"),
      getRecords("devoirs"),getRecords("resultats")
    ]);
    const stats=[
      ["🎓","students",students.length],["👨‍🏫","teachers",teachers.length],
      ["🏫","classes",classes.length],["📋","homework",homework.length],
      ["📊","results",results.length]
    ];
    $("statisticsGrid").innerHTML=stats.map(s=>statCard(s[0],s[1],s[2])).join("");
  }catch(e){toast(`${t("connection")}: ${e.message}`);}
}
async function renderBackup(){
  if(!isAdmin())return toast(t("adminOnly"));
  $("pageContent").innerHTML=`<h1>${esc(t("backup"))}</h1>
    <div class="card"><p>Exporter une copie JSON des collections principales.</p>
    <button class="btn" onclick="exportData()">⬇ ${esc(t("export"))}</button></div>`;
}
window.exportData=async()=>{
  if(!isAdmin())return toast(t("adminOnly"));
  try{
    const names=[...Object.values(modules).map(m=>m.collection),"users"];
    const result={};
    for(const name of [...new Set(names)])result[name]=await getRecords(name);
    const blob=new Blob([JSON.stringify(result,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="le-pedagogue-sauvegarde.json";a.click();
    URL.revokeObjectURL(url);
  }catch(e){toast(`${t("connection")}: ${e.message}`);}
};

  if(installPrompt){
    installPrompt.prompt();
    await installPrompt.userChoice;
