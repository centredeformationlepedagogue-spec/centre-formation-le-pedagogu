<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f3d91">
<meta name="description" content="Centre de Formation Le Pédagogue - Gestion universitaire et école professionnelle">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>Centre de Formation Le Pédagogue</title>

<style>
*{box-sizing:border-box}

:root{
  --primary:#0f3d91;
  --primary2:#174ea6;
  --secondary:#f4f7fb;
  --text:#172033;
  --muted:#667085;
  --border:#e2e8f0;
  --white:#fff;
  --success:#16803c;
  --danger:#c62828;
  --warning:#b26a00;
  --shadow:0 8px 25px rgba(15,61,145,.08)
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:var(--text)
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:68px;
  background:var(--white);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.04)
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  color:var(--primary)
}

.brand img{
  width:40px;
  height:40px;
  border-radius:8px;
  object-fit:cover
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px
}

.top-actions select{
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  background:#fff
}

.sidebar{
  position:fixed;
  top:68px;
  bottom:0;
  left:0;
  width:255px;
  background:#0d3278;
  color:#fff;
  overflow-y:auto;
  z-index:900;
  padding:12px 8px
}

.sidebar-title{
  padding:12px;
  font-size:12px;
  text-transform:uppercase;
  opacity:.7;
  font-weight:700
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:11px 12px;
  border-radius:8px;
  margin:2px 0;
  font-size:14px
}

.nav-btn:hover,
.nav-btn.active{
  background:rgba(255,255,255,.14)
}

.main{
  margin-left:255px;
  padding:88px 22px 30px;
  min-height:100vh
}

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#0f3d91,#173b7a)
}

.auth-card{
  width:100%;
  max-width:460px;
  background:#fff;
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.2)
}

.auth-logo{
  width:75px;
  height:75px;
  display:block;
  margin:0 auto 12px;
  border-radius:15px;
  object-fit:cover
}

.auth-title{
  text-align:center;
  color:var(--primary);
  margin:5px 0
}

.auth-subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:20px
}

.auth-tabs{
  display:flex;
  gap:5px;
  margin-bottom:20px
}

.auth-tabs button{
  flex:1;
  border:1px solid var(--border);
  background:#fff;
  padding:10px;
  border-radius:8px
}

.auth-tabs button.active{
  background:var(--primary);
  color:#fff
}

.form-group{
  margin-bottom:14px
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:600;
  font-size:14px
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d5dce7;
  border-radius:8px;
  padding:10px 11px;
  background:#fff;
  color:var(--text);
  outline:none
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary)
}

textarea{
  min-height:100px;
  resize:vertical
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700
}

.btn-primary{
  background:var(--primary);
  color:#fff
}

.btn-primary:hover{
  background:var(--primary2)
}

.btn-light{
  background:#edf2f8;
  color:#172033
}

.btn-success{
  background:#198754;
  color:#fff
}

.btn-danger{
  background:#c62828;
  color:#fff
}

.btn-warning{
  background:#f0a500;
  color:#fff
}

.btn-google{
  background:#fff;
  color:#333;
  border:1px solid #d5dce7
}

.btn-sm{
  padding:7px 9px;
  font-size:12px
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px
}

.page-title h1{
  margin:0;
  font-size:25px
}

.page-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px
}

.stat-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  box-shadow:var(--shadow)
}

.stat-card .label{
  color:var(--muted);
  font-size:13px
}

.stat-card .value{
  font-size:28px;
  font-weight:800;
  margin-top:8px;
  color:var(--primary)
}

.panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:var(--shadow)
}

.panel h3{
  margin-top:0
}

.table-wrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px
}

th,
td{
  border-bottom:1px solid var(--border);
  padding:11px 9px;
  text-align:left;
  font-size:13px;
  vertical-align:top
}

th{
  background:#f7f9fc;
  font-weight:800
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700
}

.badge-success{
  background:#dcfce7;
  color:#166534
}

.badge-warning{
  background:#fff4d6;
  color:#92400e
}

.badge-danger{
  background:#fee2e2;
  color:#991b1b
}

.badge-info{
  background:#dbeafe;
  color:#1e40af
}

.grid-form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}

.full{
  grid-column:1/-1
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted)
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  max-width:360px;
  background:#172033;
  color:#fff;
  padding:13px 16px;
  border-radius:10px;
  z-index:5000;
  box-shadow:0 8px 25px rgba(0,0,0,.2)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:4000
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:22px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}

.modal-head h3{
  margin:0
}

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted)
}

.mobile-menu{
  display:none;
  border:0;
  background:#edf2f8;
  border-radius:8px;
  padding:8px 11px
}

.install-card{
  background:linear-gradient(135deg,#0f3d91,#174ea6);
  color:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px
}

.install-card h3{
  margin:0 0 6px
}

.install-card p{
  margin:0;
  opacity:.9;
  font-size:13px
}

.install-card .btn{
  background:#fff;
  color:#0f3d91;
  white-space:nowrap
}

.required{
  color:#c62828
}

@media(max-width:1000px){

  .sidebar{
    transform:translateX(-100%);
    transition:.2s
  }

  .sidebar.open{
    transform:translateX(0)
  }

  .main{
    margin-left:0
  }

  .mobile-menu{
    display:block
  }

  .cards{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:600px){

  .topbar{
    padding:0 10px
  }

  .brand span{
    display:none
  }

  .top-actions select{
    max-width:115px
  }

  .top-actions .btn-light{
    padding:8px;
    font-size:12px
  }

  #installBtn{
    display:none!important
  }

  .main{
    padding:82px 10px 20px
  }

  .cards{
    grid-template-columns:1fr 1fr
  }

  .grid-form{
    grid-template-columns:1fr
  }

  .page-title{
    align-items:flex-start;
    flex-direction:column
  }

  .auth-card{
    padding:20px
  }

  .install-card{
    flex-direction:column;
    align-items:flex-start
  }

  .install-card .btn{
    width:100%
  }
}
</style>
</head>

<body>

<!-- =====================================================
     AUTHENTIFICATION
     ===================================================== -->

<div id="authPage" class="auth-page">

  <div class="auth-card">

    <img
      src="./icon-192.png"
      class="auth-logo"
      alt="Logo">

    <h1
      class="auth-title"
      data-i18n="appName">
      Centre de Formation Le Pédagogue
    </h1>

    <p
      class="auth-subtitle"
      data-i18n="appSubtitle">
      Gestion universitaire et école professionnelle
    </p>

    <div class="auth-tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showAuthTab('login')"
        data-i18n="loginTab">
        Connexion
      </button>

      <button
        id="registerTab"
        onclick="showAuthTab('register')"
        data-i18n="registerTab">
        Inscription
      </button>

    </div>

    <div id="loginForm">

      <div class="form-group">

        <label data-i18n="email">
          Email
        </label>

        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          data-i18n-placeholder="emailPlaceholder"
          placeholder="Votre adresse email">

      </div>

      <div class="form-group">

        <label data-i18n="password">
          Mot de passe
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          data-i18n-placeholder="passwordPlaceholder"
          placeholder="Votre mot de passe">

      </div>

      <button
        class="btn btn-primary"
        style="width:100%"
        onclick="loginEmailPassword()"
        data-i18n="loginButton">
        Se connecter
      </button>

      <div style="height:10px"></div>

      <button
        class="btn btn-google"
        style="width:100%"
        onclick="loginGoogle()"
        data-i18n="googleLogin">
        🔵 Continuer avec Google
      </button>

    </div>

    <div id="registerForm" class="hidden">

      <div class="form-group">

        <label data-i18n="fullName">
          Nom complet
        </label>

        <input
          id="registerName"
          data-i18n-placeholder="namePlaceholder"
          placeholder="Nom et prénom">

      </div>

      <div class="form-group">

        <label data-i18n="email">
          Email
        </label>

        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          data-i18n-placeholder="emailPlaceholder"
          placeholder="Votre adresse email">

      </div>

      <div class="form-group">

        <label data-i18n="password">
          Mot de passe
        </label>

        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          data-i18n-placeholder="passwordMin"
          placeholder="Minimum 6 caractères">

      </div>

      <div class="form-group">

        <label data-i18n="confirmPassword">
          Confirmation du mot de passe
        </label>

        <input
          id="registerPassword2"
          type="password"
          autocomplete="new-password"
          data-i18n-placeholder="confirmPlaceholder"
          placeholder="Confirmer le mot de passe">

      </div>

      <p
        style="font-size:12px;color:#667085"
        data-i18n="pendingMessage">
        Votre compte sera créé en attente de validation par
        l'administration.
      </p>

      <button
        class="btn btn-primary"
        style="width:100%"
        onclick="registerAccount()"
        data-i18n="createAccount">
        Créer mon compte
      </button>

    </div>

  </div>
</div>


<!-- =====================================================
     APPLICATION
     ===================================================== -->

<div id="appPage" class="hidden">

  <header class="topbar">

    <div class="brand">

      <button
        class="mobile-menu"
        onclick="toggleSidebar()">
        ☰
      </button>

      <img
        src="./icon-192.png"
        alt="Logo">

      <span data-i18n="appName">
        Centre de Formation Le Pédagogue
      </span>

    </div>

    <div class="top-actions">

      <select
        id="languageSelect"
        onchange="changeLanguage(this.value)"
        aria-label="Language">

        <option value="fr">
          🇫🇷 Français
        </option>

        <option value="ht">
          🇭🇹 Kreyòl
        </option>

      </select>

      <button
        id="installBtn"
        class="btn btn-primary"
        onclick="installPWA()">
        📲 <span data-i18n="install">
          Installer l'application
        </span>
      </button>

      <button
        type="button"
        class="btn btn-light"
        onclick="logoutUser()">
        🚪 <span data-i18n="logout">
          Déconnexion
        </span>
      </button>

    </div>

  </header>


  <aside
    id="sidebar"
    class="sidebar">

    <div
      class="sidebar-title"
      data-i18n="navigation">
      Navigation
    </div>

    <button
      class="nav-btn active"
      data-page="dashboard"
      onclick="showPage('dashboard')"
      data-i18n="home">
      🏠 Accueil
    </button>

    <button
      class="nav-btn"
      data-page="etudiants"
      onclick="showPage('etudiants')"
      data-i18n="students">
      🎓 Étudiants
    </button>

    <button
      class="nav-btn"
      data-page="professeurs"
      onclick="showPage('professeurs')"
      data-i18n="professors">
      👨‍🏫 Professeurs
    </button>

    <button
      class="nav-btn"
      data-page="departements"
      onclick="showPage('departements')"
      data-i18n="departments">
      🏢 Départements
    </button>

    <button
      class="nav-btn"
      data-page="filieres"
      onclick="showPage('filieres')"
      data-i18n="programs">
      📚 Filières
    </button>

    <button
      class="nav-btn"
      data-page="classes"
      onclick="showPage('classes')"
      data-i18n="classes">
      🏫 Classes
    </button>

    <button
      class="nav-btn"
      data-page="matieres"
      onclick="showPage('matieres')"
      data-i18n="subjects">
      📖 Matières
    </button>

    <button
      class="nav-btn"
      data-page="cours"
      onclick="showPage('cours')"
      data-i18n="courses">
      📝 Cours
    </button>

    <button
      class="nav-btn"
      data-page="affectations"
      onclick="showPage('affectations')"
      data-i18n="assignments">
      🔗 Affectations
    </button>

    <button
      class="nav-btn"
      data-page="inscriptions"
      onclick="showPage('inscriptions')"
      data-i18n="studentClasses">
      👥 Élèves / Classes
    </button>

    <button
      class="nav-btn"
      data-page="devoirs"
      onclick="showPage('devoirs')"
      data-i18n="homework">
      📋 Devoirs
    </button>

    <button
      class="nav-btn"
      data-page="remises"
      onclick="showPage('remises')"
      data-i18n="submissions">
      📥 Remises / Corrections
    </button>

    <button
      class="nav-btn"
      data-page="resultats"
      onclick="showPage('resultats')"
      data-i18n="results">
      📊 Résultats
    </button>

    <button
      class="nav-btn"
      data-page="statistiques"
      onclick="showPage('statistiques')"
      data-i18n="statistics">
      📈 Statistiques
    </button>

    <div id="adminNavigation">

      <div
        class="sidebar-title"
        data-i18n="administration">
        Administration
      </div>

      <button
        class="nav-btn"
        data-page="users"
        onclick="showPage('users')"
        data-i18n="users">
        👤 Utilisateurs
      </button>

      <button
        class="nav-btn"
        data-page="backup"
        onclick="showPage('backup')"
        data-i18n="backup">
        💾 Données / Sauvegarde
      </button>

    </div>

  </aside>

  <main
    id="mainContent"
    class="main">
  </main>

</div>


<!-- MODAL -->

<div
  id="modal"
  class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">

      <h3 id="modalTitle">
        Formulaire
      </h3>

      <button
        class="btn btn-light"
        onclick="closeModal()">
        ✕
      </button>

    </div>

    <div id="modalBody"></div>

  </div>
</div>


<div
  id="toast"
  class="toast hidden">
</div>

let currentLanguage =
  localStorage.getItem("cfp_language") || "fr";


function tr(key){

  return translations[currentLanguage]?.[key]
    || translations.fr[key]
    || key;
}


function applyLanguage(){

  document.documentElement.lang =
    currentLanguage === "ht" ? "ht" : "fr";

  document
    .querySelectorAll("[data-i18n]")
    .forEach(element=>{

      const key =
        element.getAttribute("data-i18n");

      if(translations[currentLanguage]?.[key]){
        element.textContent =
          translations[currentLanguage][key];
      }

    });

  document
    .querySelectorAll("[data-i18n-placeholder]")
    .forEach(element=>{

      const key =
        element.getAttribute("data-i18n-placeholder");

      if(translations[currentLanguage]?.[key]){
        element.placeholder =
          translations[currentLanguage][key];
      }

    });

  if($("languageSelect")){
    $("languageSelect").value =
      currentLanguage;
  }

  document.title =
    tr("appName");
}


window.changeLanguage = async function(value){

  currentLanguage =
    value === "ht" ? "ht" : "fr";

  localStorage.setItem(
    "cfp_language",
    currentLanguage
  );

  applyLanguage();

  if(currentUser && currentProfile){

    const activePage =
      document
        .querySelector(".nav-btn.active")
        ?.dataset.page || "dashboard";

    await showPage(activePage);
  }
};


/* =====================================================
   OUTILS
   ===================================================== */

function $(id){
  return document.getElementById(id);
}


function esc(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function toast(message){

  const t = $("toast");

  if(!t){
    return;
  }

  t.textContent =
    message;

  t.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(()=>{
      t.classList.add("hidden");
    },3500);
}


function showError(){

function isAdmin(){

  return !!(
    currentUser &&
    (
      currentUser.email?.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()

      ||

      (
        currentProfile?.role ===
        "administrateur"

        &&

        currentProfile?.status ===
        "accepted"
      )
    )
  );
}


function isProfessor(){

  return !!(
    currentProfile?.role ===
    "professeur"

    &&

    currentProfile?.status ===
    "accepted"
  );
}


function isStudent(){

  return !!(
    currentProfile?.role ===
    "eleve"

    &&

    currentProfile?.status ===
    "accepted"
  );
}


function canAcademicAccess(){

  return (
    isAdmin() ||
    isProfessor() ||
    isStudent()
  );
}


function adminRequired(){

  if(!isAdmin()){

    toast(
      currentLanguage === "ht"
        ? "Aksè sa a rezève pou administrasyon an."
        : "Accès réservé à l'administration."
    );

    return false;
  }

  return true;
}

window.registerAccount =
async function(){

  const name =
    $("registerName").value.trim();

  const email =
    $("registerEmail").value.trim();

  const password =
    $("registerPassword").value;

  const password2 =
    $("registerPassword2").value;

  if(
    !name ||
    !email ||
    !password ||
    !password2
  ){

    toast(
      currentLanguage === "ht"
        ? "Tanpri ranpli tout chan yo."
        : "Veuillez remplir tous les champs."
    );

    return;
  }

  if(password.length < 6){

    toast(
      currentLanguage === "ht"
        ? "Modpas la dwe gen omwen 6 karaktè."
        : "Le mot de passe doit contenir au moins 6 caractères."
    );

    return;
  }

  if(password !== password2){

    toast(
      currentLanguage === "ht"
        ? "Modpas yo pa menm."
        : "Les mots de passe ne correspondent pas."
    );

    return;
  }

  try{

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    const isAdminEmail =
      email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase();

    await setDoc(
      doc(
        db,
        "users",
        credential.user.uid
      ),
      {
        uid:credential.user.uid,
        email:email,
        nom:name,
        role:isAdminEmail
          ? "administrateur"
          : "eleve",
        status:isAdminEmail
          ? "accepted"
          : "attente",
        createdAt:serverTimestamp()
      },
      {
        merge:true
      }
    );

    if(!isAdminEmail){

      await signOut(auth);

      showAuthTab("login");

      toast(
        currentLanguage === "ht"
          ? "Kont lan kreye. Li ap tann validasyon administrasyon an."
          : "Compte créé. Votre compte est en attente de validation."
      );

    }else{

      toast(
        currentLanguage === "ht"
          ? "Kont administratè a kreye."
          : "Compte administrateur créé."
      );
    }

  }catch(error){

    console.error(error);

    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      toast(
        currentLanguage === "ht"
          ? "Adrès imèl sa a deja egziste."
          : "Cette adresse email existe déjà."
      );

    }else if(
      error.code ===
      "auth/invalid-email"
    ){

      toast(
        currentLanguage === "ht"
          ? "Adrès imèl la pa valab."
          : "Adresse email invalide."
      );

    }else{

      toast(
        currentLanguage === "ht"
          ? "Li pa posib kreye kont lan."
          : "Impossible de créer le compte."
      );
    }
  }
};


async function ensureUserProfile(
  user,
  name=""
){

  const ref =
    doc(
      db,
      "users",
      user.uid
    );

  const snap =
    await getDoc(ref);

  if(snap.exists()){

    const data =
      snap.data();

    if(
      user.email?.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
    ){

      await setDoc(
        ref,
        {
          uid:user.uid,
          email:user.email || "",
          nom:data.nom ||
              name ||
              user.displayName ||
              "",
          role:"administrateur",
          status:"accepted"
        },
        {
          merge:true
        }
      );
    }

    return;
  }

  const isAdminEmail =
    user.email?.toLowerCase() ===
    ADMIN_EMAIL.toLowerCase();

  await setDoc(
    ref,
    {
      uid:user.uid,
      email:user.email || "",
      nom:name ||
          user.displayName ||
          "",
      role:isAdminEmail
        ? "administrateur"
        : "eleve",
      status:isAdminEmail
        ? "accepted"
        : "attente",
      createdAt:serverTimestamp()
    },
    {
      merge:true
    }
  );
}


async function getUserProfile(uid){

  const snap =
    await getDoc(
      doc(
        db,
        "users",
        uid
      )
    );

  if(!snap.exists()){
    return null;
  }

  return snap.data();
}

/* =====================================================
   AUTH STATE
   ===================================================== */

onAuthStateChanged(
  auth,
  async user=>{

    if(!user){

      currentUser = null;
      currentProfile = null;

      $("appPage")
        .classList.add("hidden");

      $("authPage")
        .classList.remove("hidden");

      return;
    }

    try{

      currentUser = user;

      await ensureUserProfile(user);

      currentProfile =
        await getUserProfile(
          user.uid
        );

      if(!currentProfile){

        await signOut(auth);

        toast(
          currentLanguage === "ht"
            ? "Pwofil itilizatè a pa jwenn."
            : "Profil utilisateur introuvable."
        );

        return;
      }

      const adminEmail =
        user.email?.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase();

      if(
        !adminEmail &&
        currentProfile.status !==
        "accepted"
      ){

        await signOut(auth);

        toast(
          currentLanguage === "ht"
            ? "Kont ou ap tann validasyon administrasyon an."
            : "Votre compte est en attente de validation par l'administration."
        );

        return;
      }

      if(adminEmail){

        currentProfile.role =
          "administrateur";

        currentProfile.status =
          "accepted";

        await setDoc(
          doc(
            db,
            "users",
            user.uid
          ),
          {
            uid:user.uid,
            email:user.email ||
                 ADMIN_EMAIL,
            role:"administrateur",
            status:"accepted"
          },
          {
            merge:true
          }
        );
      }

      $("authPage")
        .classList.add("hidden");

      $("appPage")
        .classList.remove("hidden");

      $("adminNavigation")
        .classList.toggle(
          "hidden",
          !isAdmin()
        );

      applyLanguage();

      await showPage("dashboard");

    }catch(error){

      console.error(error);

      await signOut(auth)
        .catch(()=>{});

      toast(
        currentLanguage === "ht"
          ? "Li pa posib chaje pwofil ou."
          : "Impossible de charger votre profil."
      );
    }
  }
);

window.showPage =
async function(page){

  closeSidebarMobile();

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );

    });

  const main =
    $("mainContent");

  main.innerHTML =
    `<div class="loading">${esc(tr("loading"))}</div>`;

  try{

    switch(page){

      case "dashboard":
        await renderDashboard();
        break;

      case "etudiants":
        await renderGenericPage(
          "Étudiants",
          "etudiants",
          getStudentFields()
        );
        break;

      case "professeurs":
        await renderGenericPage(
          "Professeurs",
          "professeurs",
          getProfessorFields()
        );
        break;

      case "departements":
        await renderGenericPage(
          "Départements",
          "departements",
          getDepartmentFields()
        );
        break;

      case "filieres":
        await renderGenericPage(
          "Filières",
          "filieres",
          getProgramFields()
        );
        break;

      case "classes":
        await renderGenericPage(
          "Classes",
          "classes",
          getClassFields()
        );
        break;

      case "matieres":
        await renderGenericPage(
          "Matières",
          "matieres",
          getSubjectFields()
        );
        break;

      case "cours":
        await renderGenericPage(
          "Cours",
          "cours",
          getCourseFields()
        );
        break;

      case "affectations":
        await renderAffectations();
        break;

      case "inscriptions":
        await renderInscriptions();
        break;

      case "devoirs":
        await renderAssignments();
        break;

      case "remises":
        await renderSubmissions();
        break;

      case "resultats":
        await renderResults();
        break;

      case "statistiques":
        await renderStatistics();
        break;

      case "users":

        if(isAdmin()){
          await renderUsers();
        }else{
          toast(
            currentLanguage === "ht"
              ? "Aksè sa a rezève pou administrasyon an."
              : "Accès réservé à l'administration."
          );

          await renderDashboard();
        }

        break;

      case "backup":

        if(isAdmin()){
          await renderBackup();
        }else{
          toast(
            currentLanguage === "ht"
              ? "Aksè sa a rezève pou administrasyon an."
              : "Accès réservé à l'administration."
          );

          await renderDashboard();
        }

        break;

      default:
        await renderDashboard();
    }

  }catch(error){

    console.error(error);

    main.innerHTML =
      `<div class="panel">
        <h3>${
          currentLanguage === "ht"
            ? "Li pa posib chaje seksyon sa a."
            : "Impossible de charger cette section."
        }</h3>
        <p>${
          currentLanguage === "ht"
            ? "Tanpri eseye ankò."
            : "Veuillez réessayer."
        }</p>
      </div>`;
  }

  applyLanguage();
};

function createFieldHtml(
  key,
  label,
  type,
  value
){

  const safeValue =
    value ?? "";

  if(type === "textarea"){

    return `
      <div class="form-group">

        <label>
          ${esc(label)}
        </label>

        <textarea
          id="generic_${esc(key)}"
          placeholder="${esc(label)}">${esc(safeValue)}</textarea>

      </div>
    `;
  }


  if(type === "selectGender"){

    return `
      <div class="form-group">

        <label>
          ${esc(label)}
        </label>

        <select id="generic_${esc(key)}">

          <option value="">
            ${esc(tr("select"))}
          </option>

          <option
            value="M"
            ${safeValue === "M" ? "selected" : ""}>
            ${esc(tr("male"))}
          </option>

          <option
            value="F"
            ${safeValue === "F" ? "selected" : ""}>
            ${esc(tr("female"))}
          </option>

          <option
            value="O"
            ${safeValue === "O" ? "selected" : ""}>
            ${esc(tr("other"))}
          </option>

        </select>

      </div>
    `;
  }


  return `
    <div class="form-group">

      <label>
        ${esc(label)}
      </label>

      <input
        id="generic_${esc(key)}"
        type="${esc(type || "text")}"
        value="${esc(safeValue)}"
        placeholder="${esc(label)}">

    </div>
  `;
}


window.openGenericForm =
async function(
  collectionName,
  id=""
){

  if(!adminRequired()){
    return;
  }

  const config =
    genericConfigs[
      collectionName
    ];

  if(!config){
    return;
  }

  let data = {};

  if(id){

    const snap =
      await getDoc(
        doc(
          db,
          collectionName,
          id
        )
      );

    if(snap.exists()){
      data =
        snap.data();
    }
  }

  let form =
    `<div class="grid-form">`;

  config.fields.forEach(field=>{

    const [
      key,
      label,
      type
    ] = field;

    form += `
      <div>
        ${createFieldHtml(
          key,
          label,
          type,
          data[key]
        )}
      </div>
    `;
  });

  form += `
    </div>

    <div
      style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">

      <button
        class="btn btn-light"
        onclick="closeModal()">

      <button
        class="btn btn-primary"
        onclick="saveGeneric('${collectionName}','${id}')">
        ${esc(tr("save"))}
      </button>

    </div>
  `;

  openModal(
    id
      ? tr("edit")
      : tr("add"),
    form
  );
};


window.saveGeneric =
async function(
  collectionName,
  id=""
){

  if(!adminRequired()){
    return;
  }

  const config =
    genericConfigs[
      collectionName
    ];

  if(!config){
    return;
  }

  const data = {};

  config.fields.forEach(
    ([key])=>{

      data[key] =
        $(`generic_${key}`)
          ?.value
          .trim() || "";

    }
  );

  if(!data.nom){

    toast(
      currentLanguage === "ht"
        ? "Non an obligatwa."
        : "Le nom est obligatoire."
    );

    return;
  }

  try{

    data.updatedAt =
      serverTimestamp();

    if(id){

      await updateDoc(
        doc(
          db,
          collectionName,
          id
        ),
        data
      );

    }else{

      data.createdAt =
        serverTimestamp();

      await addDoc(
        collection(
          db,
          collectionName
        ),
        data
      );
    }

    closeModal();

    toast(
      currentLanguage === "ht"
        ? "Done yo anrejistre."

    const active =
      document
        .querySelector(".nav-btn.active")
        ?.dataset.page ||
      "dashboard";

    console.error(error);
    showError();

window.saveAffectation =
async function(){

  if(!adminRequired()){
    return;
  }

  const profId =
    $("affProf")?.value || "";

  const filiereId =
    $("affFiliere")?.value || "";

  const classeId =
    $("affClasse")?.value || "";

  const matiereId =
    $("affMatiere")?.value || "";

  if(
    !profId ||
    !filiereId ||
    !classeId ||
    !matiereId
  ){

    toast(
      currentLanguage === "ht"
        ? "Tanpri chwazi tout eleman yo."
        : "Veuillez sélectionner tous les éléments."
    );

    return;
  }

  try{

    const [
      profSnap,
      filiereSnap,
      classeSnap,
      matiereSnap
    ] = await Promise.all([

      getDoc(
        doc(
          db,
          "professeurs",
          profId
        )
      ),

      getDoc(
        doc(
          db,
          "filieres",
          filiereId
        )
      ),

      getDoc(
        doc(
          db,
          "classes",
          classeId
        )
      ),

      getDoc(
        doc(
          db,
          "matieres",
          matiereId
        )
      )

    ]);

    const prof =
      profSnap.exists()
        ? profSnap.data()
        : {};

    const filiere =
      filiereSnap.exists()
        ? filiereSnap.data()
        : {};

    const classe =
      classeSnap.exists()
        ? classeSnap.data()
        : {};

    const matiere =
      matiereSnap.exists()
        ? matiereSnap.data()
        : {};

    let professeurUid =
      prof.uid || "";

    if(!professeurUid && prof.email){

      const q =
        query(
          collection(
            db,
            "users"
          ),
          where(
            "email",
            "==",
            prof.email
          )
        );

      const userSnap =
        await getDocs(q);

      if(!userSnap.empty){

        professeurUid =
          userSnap.docs[0].id;
      }
    }

    await addDoc(
      collection(
        db,
        "affectations"
      ),
      {
        professeurId:profId,
        professeurUid,
        professeurNom:
          prof.prenom
            ? `${prof.prenom} ${prof.nom || ""}`
            : prof.nom || "",
        professeurEmail:
          prof.email || "",
        filiereId,
        filiereNom:
          filiere.nom || "",
        classeId,
        classeNom:
          classe.nom || "",
        matiereId,
        matiereNom:
          matiere.nom || "",
        createdAt:
          serverTimestamp()
      }
    );

    closeModal();

    toast(
      currentLanguage === "ht"
        ? "Afektasyon an anrejistre."
        : "Affectation enregistrée."
    );

    await renderAffectations();

  }catch(error){

    console.error(error);
    showError();
  }
};

                ? "badge-warning"
                : "badge-danger"
            }">

              ${esc(
                status === "accepted"
                  ? tr("accepted")
                  : status === "attente"
                  ? tr("waiting")
                  : status
              )}

          </td>

          <td style="font-size:11px">
            ${esc(
              u.uid ||

  html += `

    </div>

  $("mainContent")

window.acceptUser =
async function(id){

  if(!adminRequired()){
    return;
  }

  try{

    await updateDoc(
      doc(
        db,
        "users",
        id
      ),
      {
        status:"accepted"
      }
    );

    toast(
      currentLanguage === "ht"
        ? "Itilizatè a aksepte."
        : "Utilisateur accepté."
    );

    await renderUsers();

  }catch(error){

    console.error(error);
    showError();
  }
};


window.changeUserRole =
async function(
  id,
  currentRole
){

  if(!adminRequired()){
    return;
  }

  const roles = [
    "eleve",
    "professeur",
    "administrateur"
  ];

  const next =
    roles[
      (
        roles.indexOf(
          currentRole
        ) + 1
      ) %
      roles.length
    ];

  const message =
    currentLanguage === "ht"
      ? `Chanje wòl la pou "${next}" ?`
      : `Changer le rôle vers "${next}" ?`;

  if(!confirm(message)){
    return;
  }

  try{

    await updateDoc(
      doc(
        db,
        "users",
        id
      ),
      {
        role:next,
        status:"accepted"
      }
    );

    toast(
      currentLanguage === "ht"
        ? "Wòl la modifye."
        : "Rôle modifié."
    );

    await renderUsers();

  }catch(error){

    console.error(error);
    showError();
  }
};

window.exportData =
async function(){

  if(!adminRequired()){
    return;
  }

  const collections = [

    "users",
    "etudiants",
    "professeurs",
    "departements",
    "filieres",
    "classes",
    "matieres",
    "cours",
    "affectations",
    "inscriptions",
    "devoirs",
    "remises",
    "resultats"

  ];

  try{

    const output = {};

    for(
      const name
      of collections
    ){

      const snap =
        await getDocs(
          collection(
            db,
            name
          )
        );

      output[name] =
        snap.docs.map(
          d=>({
            id:d.id,
            ...d.data()
          })
        );
    }

    const json =
      JSON.stringify(
        output,
        (
          key,
          value
        )=>{

          if(
            value &&
            typeof value ===
            "object" &&
            value.seconds !==
            undefined
          ){

            return new Date(
              value.seconds * 1000
            ).toISOString();
          }

          return value;
        },
        2
      );

    const blob =
      new Blob(
        [json],
        {
          type:
            "application/json"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement(
        "a"
      );

    a.href =
      url;

    a.download =
      "centre-de-formation-le-pedagogue-backup.json";

    a.click();

    URL.revokeObjectURL(
      url
    );

    toast(
      currentLanguage === "ht"
        ? "Sovgad la telechaje."
        : "Sauvegarde téléchargée."
    );

  }catch(error){

    console.error(error);
    showError();
  }
};
